<style>
*{box-sizing:border-box}

}
html{background:var(--bg);scroll-behavior:smooth}
body{background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:14px; line-height:1.5; margin:0; min-height:100vh;}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius)}
h1,h2,h3{margin:0;font-weight:600}
.muted{color:var(--muted)}
.err{color:var(--err);font-size:12px;min-height:16px;margin-top:4px}
.spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.anim-fade { animation: fadeIn 0.4s ease forwards; }

function el(tag, attrs, kids) {
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];

// ужимаем картинку: max - сторона в пикселях, kb - предел размера
function compress(file, max, kb) {
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith('image/') || file.size > 10e6) return rej(new Error('нужна картинка до 10 МБ'));
    const r = new FileReader();
    r.onerror = () => rej(new Error('не прочиталось'));
    r.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('битая картинка'));
      img.onload = () => {
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        let q = 0.85, u = c.toDataURL('image/jpeg', q);
        while (u.length * 0.75 > kb * 1000 && q > 0.1) { q -= 0.1; u = c.toDataURL('image/jpeg', q); }
        res(u);
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

// занимаем ник в индексе nicks - так никто не сможет взять чужое имя
async function claimNick(n, uid) {
  const r = await db.ref('nicks/' + n.toLowerCase()).transaction(cur => (cur === null || cur === uid) ? uid : undefined);
  return r.committed;
}

// ищем юзера по uid, если нет - по нику (для старых постов)
function getUser(id) {
  if (!id) return null;
  if (S.users[id]) return S.users[id];
  // это мы сами, а в базе записи нет (или она не прочиталась)
  if (S.user && S.user.uid == id) return S.user;
  const low = String(id).toLowerCase();
  return Object.values(S.users).find(u => u.nick && u.nick.toLowerCase() == low) || null;
}

// второй аргумент - ник из самого поста, на случай если юзера в базе нет
function mediaEl(m) {
  if (!m) return null;
  if (okVid(m.s)) {
    const v = el('video', {class:'nick-media', src: m.s, loop:'', playsinline:''});
    v.muted = true; v.autoplay = true;
    v.play().catch(() => {});
    return v;
  }
  if (okImg(m.s)) return el('img', {class:'nick-media', src: m.s});
  return null;
}

// рисуем ник по объекту юзера (так работает и превью в редакторе)
function nickOf(u, fallback) {
  const pf = u.profile || {};
  const priv = canPriv(u);
  let label = priv ? (pf.prefix || '') : '';
  let cls = 'prefix-custom';
  if (u.owner) { cls = 'prefix-owner'; label = label || 'Founder'; }
  else if (u.role == 'admin') { cls = 'prefix-admin'; label = label || 'Admin'; }
  else if (u.role == 'moderator') { cls = 'prefix-moderator'; label = label || 'Mod'; }
  const pre = label ? el('span', {class:'nick-prefix ' + cls, text:'[' + label + ']'}) : null;
  if (pre && priv && /^#[0-9a-fA-F]{6}$/.test(pf.prefixColor || '')) pre.style.color = pf.prefixColor;

  const col = COLORS.find(c => c.id == pf.color);
  const name = el('span', {class:'nick-glow ' + (priv && col ? col.cls : '')}, [u.nick || fallback || 'User']);
  if (priv && pf.emoji) name.append(el('span', {class:'nick-emoji', text: pf.emoji}));

  const w = el('span', {style:'display:inline-flex;align-items:center;gap:4px;cursor:pointer'}, [pre, name]);
  const m = priv ? mediaEl(pf.nickMedia || (pf.mediaUrl ? {s: pf.mediaUrl} : null)) : null;
  if (m) w.prepend(m);
  return w;
}

function nick(id, fallback) {
  const u = getUser(id);
  if (!u) return el('span', {text: fallback || 'User', style:'color:#aaa'});
  const w = nickOf(u, fallback);
  w.onclick = e => { e.stopPropagation(); S.view = 'profile'; S.profile = u.uid || id; draw(); };
  return w;
}

function avatar(id, sz) {
  sz = sz || 40;
  const u = getUser(id);
  const a = el('div', {class:'avatar', style:'width:'+sz+'px;height:'+sz+'px;font-size:'+(sz*0.4)+'px'});
  if (u && u.profile && okImg(u.profile.avatar)) a.appendChild(el('img', {src: u.profile.avatar}));
  else a.textContent = ((u && u.nick) || '?')[0].toUpperCase();
  return a;
}

function authView() {
  const isLogin = S.authMode == 'login';
  const err = el('div', {class:'err'});
  const n = el('input', {type:'text', placeholder: t('nick'), maxlength:'15'});
  const p = el('input', {type:'password', placeholder: t('pass'), minlength:'6'});

  const form = el('form', {class:'auth', onsubmit: async e => {
    e.preventDefault();
    if (S.busy) return;
    S.busy = true;
    err.textContent = '';

    const name = n.value.trim().replace(/[^a-zA-Z0-9_]/g, '');
    if (name.length < 3) {
      err.textContent = 'Ник от 3 символов';
      S.busy = false;
      return;
    }
    if (!isLogin && p.value.length < 8) {
      err.textContent = 'Пароль минимум 8 символов';
      S.busy = false;
      return;
    }
    const email = name.toLowerCase() + '@60tdel.local';

    try {
      if (isLogin) {
        await auth.signInWithEmailAndPassword(email, p.value);
      } else {
        S.registering = true;
        const c = await auth.createUserWithEmailAndPassword(email, p.value);
        await c.user.updateProfile({displayName: name});
        let ok = false;
        try { ok = await claimNick(name, c.user.uid); } catch (x) { console.error(x); }
        if (!ok) {
          await c.user.delete().catch(() => {});
          S.registering = false; S.busy = false;
          err.textContent = 'Ник занят';
          return;
        }
        try {
          await set('users/' + c.user.uid, {uid: c.user.uid, nick: name, role:'user', owner:false, premium:false, created: TS, profile:{}});
        } catch (ex) {
          console.error('не записался юзер в базу', ex);
        }
        S.registering = false;
        await loadUser(auth.currentUser);
      }
      S.view = 'list';
      draw();
    } catch (ex) {
      S.registering = false;
      console.error(ex);
      const code = ex.code || '';
      let m = ex.message;
      if (/wrong-password|user-not-found|invalid-credential|invalid-login/.test(code)) m = 'Неверный ник или пароль';
      else if (code.includes('email-already')) m = 'Ник занят';
      else if (code.includes('weak-password')) m = 'Пароль минимум 6 символов';
      else if (code.includes('too-many-requests')) m = 'Слишком много попыток, подожди пару минут';
      else if (code.includes('network')) m = 'Нет связи с сервером';
      else m = m + ' (' + code + ')';
      err.textContent = m;
    }
    S.busy = false;
  }}, [
    el('h2', {text: isLogin ? t('auth') : t('reg_title'), style:'color:#fff;text-align:center'}),
    el('label', null, ['Никнейм', n]),
    el('label', null, [t('pass'), p]),
    err,
    el('button', {class:'btn primary', type:'submit', text: isLogin ? t('login') : t('reg')}),
    el('div', {class:'switch'}, [
      isLogin ? t('no_acc') : t('has_acc'),
      el('button', {type:'button', text: isLogin ? t('reg') : t('login'), onclick: () => {
        S.authMode = isLogin ? 'register' : 'login';
        draw();
      }})
    ])
  ]);
  return [form];
}

const EMO = ['😀','😂','😍','😎','😭','😡','👍','👎','🔥','💀','❤️','🎉','🤔','😱','🙏','👀'];

function composer(key, ph, onSend) {
  let pic = null, busy = false;
  const ta = el('textarea', {placeholder: ph, maxlength:'2000', rows:'2'});
  ta.value = S.drafts[key] || '';
  ta.oninput = () => { S.drafts[key] = ta.value; };
  const prev = el('div', {class:'prev'});
  const panel = el('div', {class:'emo', style:'display:none'}, EMO.map(e =>
    el('span', {text: e, onclick: () => { ta.value += e; S.drafts[key] = ta.value; ta.focus(); }})));
  const file = el('input', {type:'file', accept:'image/*', style:'display:none', onchange: async e => {
    const f = e.target.files[0];
    if (!f) return;
    try { pic = await compress(f, 900, 120); }
    catch (x) { alert('Не вышло: ' + x.message); return; }
    prev.innerHTML = '';
    prev.append(el('img', {src: pic}), el('button', {class:'btn small', type:'button', text:'✕', onclick: () => { pic = null; prev.innerHTML = ''; }}));
    file.value = '';
  }});

  async function send() {
    const text = ta.value.trim();
    if ((!text && !pic) || busy) return;
    if (Date.now() - (S.lastSend || 0) < 1500) return; // не чаще раза в 1.5 сек
    S.lastSend = Date.now();
    busy = true;
    try {
      await onSend(text, pic);
      ta.value = ''; S.drafts[key] = ''; pic = null; prev.innerHTML = '';
    } catch (x) { alert('Не отправилось: ' + x.message); }
    busy = false;
    ta.focus();
  }
  ta.onkeydown = e => { if (e.key == 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };

  return el('div', {class:'compose'}, [prev, ta, panel, el('div', {class:'bar'}, [
    el('button', {class:'btn small', type:'button', text:'😊', onclick: () => { panel.style.display = panel.style.display == 'none' ? 'flex' : 'none'; }}),
    el('button', {class:'btn small', type:'button', text:'📷', onclick: () => file.click()}),
    file,
    el('button', {class:'btn primary', type:'button', text: t('send'), onclick: send})
  ])]);
}

    el('div', {class:'tnav'}, [
      el('button', {class:'btn', text:'← К списку', onclick: () => { S.view = 'list'; draw(); }}),

    return [
      nickOf(u),
      abtn(u.role || 'user', '', () => {
        const v = (prompt('user / moderator / admin', u.role || 'user') || '').trim().toLowerCase();
        if (['user', 'moderator', 'admin'].includes(v)) db.ref('users/' + k + '/role').set(v).catch(fail);
      }),
      abtn(u.premium ? 'Снять' : 'Выдать', u.premium ? '' : 'primary', () => db.ref('users/' + k + '/premium').set(!u.premium).catch(fail)),
      
      // НОМЕР
      el('div', {class:'phone-cell'}, [
        el('span', {class:'val', text: phoneOf(u) || '—', style:'color:' + (phoneOf(u) ? '#fff' : '#555')}),
        abtn(u.phone ? '✕' : 'Выдать', u.phone ? 'danger' : 'primary', () => {
          const cur = phoneOf(u);
          const v = prompt('Номер (пусто — снять):', cur || '+');
          if (v === null) return;
          const val = v.trim();
          if (!val) { db.ref('users/' + k + '/phone').remove().catch(fail); return; }
          db.ref('users/' + k + '/phone').set(val).catch(fail);
        })
      ]),

      // ПОДПИСЧИКИ
      el('div', {class:'phone-cell'}, [
        el('span', {class:'val', text: String(follCount), style:'color:' + (u.followers ? '#f5b842' : '#fff')}),
        abtn(u.followers ? '✕' : 'Задать', u.followers ? 'danger' : 'primary', () => {
          const cur = u.followers || follCount;
          const v = prompt('Кол-во подписчиков (пусто — сбросить):', cur);
          if (v === null) return;
          const val = parseInt(v.trim());
          if (!v.trim()) { db.ref('users/' + k + '/followers').remove().catch(fail); return; }
          if (isNaN(val) || val < 0) return alert('Нужно положительное число');
          db.ref('users/' + k + '/followers').set(val).catch(fail);
        })
      ]),

      iOwner
        ? abtn(isOwn ? 'Снять' : 'Выдать', isOwn ? 'danger' : 'primary', () => {
            if (isOwn && k == S.user.uid) return alert('Себя лишить овнера нельзя');
            db.ref('users/' + k + '/owner').set(!isOwn).catch(fail);
          })
        : el('span', {text: isOwn ? 'Да' : 'Нет'}),
      iOwner ? abtn('Удалить', 'danger', () => {
        if (!confirm('Удалить запись пользователя ' + u.nick + '?')) return;
        db.ref('users/' + k).remove().then(() => db.ref('nicks/' + String(u.nick).toLowerCase()).remove()).catch(fail);
      }) : el('span')
    ];
  });
  return adminTable(['Ник', 'Роль', 'Премиум', 'Номер', 'Подписчики', 'Овнер', 'Действия'], rows);
}

function profileView() {
  const uid = S.profile || (S.user && S.user.uid);
  const u = getUser(uid);
  if (!u) return [el('div', {text:'Профиль не найден'})];
  const isMe = S.user && u.uid == S.user.uid;
  const pf = u.profile || {};

  const mine = S.threads.filter(th => th.uid == u.uid || th.author == u.nick);
  let posts = 0;
  S.threads.forEach(th => Object.values(th.posts || {}).forEach(p => { if (p.uid == u.uid) posts++; }));
  
  // Если админ задал кол-во подписчиков, показываем его. Иначе реальное.
  const followers = u.followers !== undefined ? u.followers : (u.owner ? 666 : Object.keys(S.follows[u.uid] || {}).length);
  const following = Object.values(S.follows).filter(f => f[u.uid]).length;
  const iFollow = S.user && S.follows[u.uid] && S.follows[u.uid][S.user.uid];

  const banner = el('div', {class:'profile-banner'});
  if (okImg(pf.banner)) banner.append(el('img', {src: pf.banner}));
  const av = el('div', {class:'profile-avatar'});
  if (okImg(pf.avatar)) av.append(el('img', {src: pf.avatar}));
  else av.textContent = (u.nick || '?')[0].toUpperCase();

  const btn = isMe
    ? el('button', {class:'btn', text: t('edit'), onclick: () => { S.edit = !S.edit; S.draft = {bio: pf.bio || '', avatar: pf.avatar, banner: pf.banner, nickMedia: pf.nickMedia, nick: u.nick, prefix: pf.prefix || '', prefixColor: pf.prefixColor || '', color: pf.color || '', emoji: pf.emoji || ''}; draw(); }})
    : el('button', {class: 'btn ' + (iFollow ? '' : 'primary'), text: iFollow ? 'Отписаться' : 'Подписаться', onclick: () => {
        if (!S.user) { S.view = 'auth'; draw(); return; }
        const r = db.ref('follows/' + u.uid + '/' + S.user.uid);
        iFollow ? r.remove() : r.set(true);
      }});

  const out = [
    el('div', {class:'profile-container'}, [banner, el('div', {class:'profile-main'}, [av, el('div', {class:'profile-details'}, [
      el('div', {class:'profile-name-row'}, [el('div', {class:'profile-username'}, [nick(u.uid, u.nick)]), btn]),
      el('div', {class:'pstats'}, [
        el('span', null, [el('b', {text: String(followers)}), ' подписчиков']),
        el('span', null, [el('b', {text: String(following)}), ' подписок']),
        el('span', null, [el('b', {text: String(mine.length)}), ' тем']),
        el('span', null, [el('b', {text: String(posts)}), ' ответов'])
      ])
    ])])]),
    el('table', {class:'profile-table'}, [el('tbody', null, [
      el('tr', null, [el('td', {text:'Username'}), el('td', {text:'@' + u.nick})]),
      el('tr', null, [el('td', {text:'Роль'}), el('td', {text: u.owner ? 'Founder' : (u.role || 'user')})]),
      el('tr', null, [el('td', {text:'Joined'}), el('td', {text: fmt(u.created)})]),
      ...(phoneOf(u) ? [el('tr', null, [el('td', {text:'Номер'}), el('td', {text: phoneOf(u)})])] : [])
    ])])]
  ];
  if (pf.bio) out.push(el('div', {class:'bio', text: pf.bio}));
  if (mine.length) {
    out.push(el('h3', {text:'Темы', style:'color:#fff'}));
    out.push(el('div', {class:'tlist'}, mine.slice(0, 10).map(th => el('a', {text: th.title, onclick: () => { S.view = 'thread'; S.open = th.id; draw(); }}))));
  }

  if (isMe && S.edit) {
    const d = S.draft;
    const err = el('div', {class:'err'});
    const bPrev = el('div', {class:'ed-banner'});
    const aPrev = el('div', {class:'ed-ava'});
    const mPrev = el('div', {class:'ed-media'});

    function showPrev() {
      bPrev.innerHTML = ''; aPrev.innerHTML = ''; mPrev.innerHTML = '';
      if (okImg(d.banner)) bPrev.append(el('img', {src: d.banner})); else bPrev.textContent = 'Баннер не выбран';
      if (okImg(d.avatar)) aPrev.append(el('img', {src: d.avatar})); else aPrev.textContent = 'Аватар';
      const m = mediaEl(d.nickMedia);
      if (m) mPrev.append(m); else mPrev.textContent = 'нет';
    }
    const readUrl = f => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
    function fileBtn(text, accept, onFile) {
      const inp = el('input', {type:'file', accept: accept, style:'display:none', onchange: async e => {
        const f = e.target.files[0];
        if (!f) return;
        try { await onFile(f); } catch (x) { alert(x.message); }
        showPrev(); inp.value = '';
      }});
      return el('span', null, [inp, el('button', {class:'btn small', type:'button', text: text, onclick: () => inp.click()})]);
    }
    showPrev();

    const nIn = el('input', {type:'text', value: d.nick, maxlength:'15', oninput: e => { d.nick = e.target.value; }});
    const bIn = el('textarea', {maxlength:'300', placeholder:'Расскажите о себе', oninput: e => { d.bio = e.target.value; cnt.textContent = d.bio.length + '/300'; }});
    bIn.value = d.bio;
    const cnt = el('span', {class:'hint', text: (d.bio || '').length + '/300'});

    out.push(el('div', {class:'ed'}, [
      el('h3', {text: t('edit')}),
      el('div', null, [el('span', {class:'cap', text:'Никнейм'}), nIn, el('div', {class:'hint', text:'Логин для входа не меняется'})]),
      el('div', null, [el('span', {class:'cap', text:'О себе'}), bIn, cnt]),
      el('div', null, [el('span', {class:'cap', text:'Баннер'}), bPrev,
        el('div', {class:'row', style:'margin-top:8px'}, [
          fileBtn('Выбрать', 'image/*', async f => { d.banner = await compress(f, 900, 90); }),
          el('button', {class:'btn small', type:'button', text:'Убрать', onclick: () => { d.banner = null; showPrev(); }})])]),
      el('div', null, [el('span', {class:'cap', text:'Аватар'}),
        el('div', {class:'row'}, [aPrev,
          fileBtn('Выбрать', 'image/*', async f => { d.avatar = await compress(f, 200, 40); }),
          el('button', {class:'btn small', type:'button', text:'Убрать', onclick: () => { d.avatar = null; showPrev(); }})])]),
      el('div', null, [el('span', {class:'cap', text:'Фото / видео возле ника'}),
        el('div', {class:'row'}, [mPrev,
          fileBtn('Выбрать', 'image/*,video/mp4,video/webm', async f => {
            if (!canPriv(S.user)) throw new Error('Медиа у ника доступно с привилегией');
            if (f.type.startsWith('video/')) {
              if (f.size > 1000000) throw new Error('Видео для ника до 1 МБ');
              const v = await readUrl(f);
              if (!okVid(v)) throw new Error('Только mp4 или webm');
              d.nickMedia = {t:'v', s: v};
            } else d.nickMedia = {t:'i', s: await compress(f, 48, 8)};
          }),
          el('button', {class:'btn small', type:'button', text:'Убрать', onclick: () => { d.nickMedia = null; showPrev(); }})]),
        el('div', {class:'hint', text:'Картинка или видео mp4/webm до 1 МБ'})]),
      privBox(d),
      err,
      el('div', {class:'acts'}, [
        el('button', {class:'btn primary', text: t('save'), onclick: async () => {
          const n = (d.nick || '').trim();
          if (!/^[A-Za-z0-9_]{3,15}$/.test(n)) { err.textContent = 'Ник: 3-15 символов, латиница, цифры, _'; return; }
          if (d.prefix && !isStaff(S.user) && BAD_PREFIX.test(d.prefix)) { err.textContent = 'Этот префикс запрещён'; return; }
          const oldLow = (u.nick || '').toLowerCase();
          if (n.toLowerCase() != oldLow) {
            const busy = Object.entries(S.users).some(([k, x]) => k != u.uid && x.uid != u.uid && x.nick && x.nick.toLowerCase() == n.toLowerCase());
            if (busy) { err.textContent = 'Ник занят'; return; }
            let ok = false;
            try { ok = await claimNick(n, u.uid); } catch (x) { console.error(x); }
            if (!ok) { err.textContent = 'Ник занят'; return; }
          }
          try {
            await upd('users/' + u.uid, {nick: n, profile: {bio: d.bio || '', avatar: d.avatar || null, banner: d.banner || null, nickMedia: d.nickMedia || null, prefix: d.prefix || null, prefixColor: d.prefixColor || null, color: d.color || null, emoji: d.emoji || null}});
            if (n.toLowerCase() != oldLow) db.ref('nicks/' + oldLow).remove().catch(() => {});
            S.user.nick = n; S.edit = false; draw();
          } catch (x) { err.textContent = 'Не сохранилось: ' + x.message; }
        }}),
        el('button', {class:'btn', text: t('cancel'), onclick: () => { S.edit = false; draw(); }})
      ])
    ]));
  }
  return out;
}

// ---------- чаты ----------

function chatView() {
  const c = S.chats[S.chatId];
  if (!c) return [el('div', {text:'Не найдено'})];
  const win = el('div', {class:'chatwin'});
  let stick = true; // прилипать к низу

  S.fill = () => {
    const cc = S.chats[S.chatId];
    if (!cc) return;
    const old = win.scrollTop;
    const near = stick || win.scrollHeight - win.scrollTop - win.clientHeight < 80;
    win.innerHTML = '';
    Object.entries(cc.messages || {}).map(([key, m]) => ({...m, key})).sort((a, b) => a.date - b.date).forEach(m => {
      const mine = S.user && m.uid == S.user.uid;
      win.append(el('div', {class:'chatmsg' + (mine ? ' self' : '')}, [
        avatar(m.uid, 32),
        el('div', {class:'bub'}, [
          el('div', {class:'top'}, [nick(m.uid, m.author), el('span', {text: fmt(m.date)}),
            (mine || isAdmin()) ? el('button', {class:'btn small danger', text:'✕', onclick: () => { if (confirm('Удалить?')) del('chats/' + cc.id + '/messages/' + m.key); }}) : null]),
          el('div', {class:'txt', text: m.text || ''}),
          picEl(m.media)
        ])
      ]));
    });
    win.scrollTop = near ? win.scrollHeight : old;
    stick = false;
  };
  S.fill();
  setTimeout(() => { win.scrollTop = win.scrollHeight; }, 0);

  const out = [
    el('button', {class:'btn', text:'← Назад', onclick: () => { S.view = 'chatList'; draw(); }}),
    el('h2', {text: c.name, style:'margin:16px 0'}),
    win
  ];
  if (S.user) {
    out.push(composer('c' + c.id, 'Сообщение... (Enter - отправить)', (text, pic) => {
      stick = true;
      return db.ref('chats/' + c.id + '/messages').push({uid: S.user.uid, author: S.user.nick, text: text, media: pic || null, date: TS});
    }));
  } else out.push(el('div', {class:'muted', text:'Войдите, чтобы писать'}));
  return out;
}

function chatListView() {
  const tbody = el('tbody');
  Object.values(S.chats).sort((a, b) => (b.date || 0) - (a.date || 0)).forEach(c => {
    const canDel = S.user && (c.uid == S.user.uid || isAdmin());
    tbody.appendChild(el('tr', {style:'cursor:pointer', onclick: () => {
      S.view = 'chat';
      S.chatId = c.id;
      draw();
    }}, [
      el('td', {text: c.name}),
      el('td', {text: Object.keys(c.messages || {}).length}),
      el('td', null, [nick(c.uid, c.author)]),
      el('td', {style:'text-align:right;width:1%'}, [
        canDel ? el('button', {class:'btn small danger', text:'✕', title:'Удалить чат', onclick: e => {
          e.stopPropagation();
          if (confirm('Удалить чат «' + c.name + '» со всеми сообщениями?'))
            del('chats/' + c.id).catch(fail);
        }}) : null
      ])
    ]));
  });

  const out = [el('h2', {text:'Чаты'})];

  if (S.user) {
    const inp = el('input', {type:'text', maxlength:'60', placeholder:'Название нового чата'});
    const create = () => {
      const name = inp.value.trim();
      if (!name) return;
      db.ref('chats').push({name, uid: S.user.uid, author: S.user.nick, date: TS})
        .then(() => { inp.value = ''; })
        .catch(fail);
    };
    inp.onkeydown = e => { if (e.key == 'Enter') create(); };
    out.push(el('div', {class:'create-chat'}, [
      inp,
      el('button', {class:'btn primary', text:'+ Создать чат', onclick: create})
    ]));
  } else {
    out.push(el('div', {class:'muted', style:'margin-bottom:12px', text:'Войдите, чтобы создавать чаты'}));
  }

  out.push(el('div', {class:'tablebox'}, [el('table', null, [
    el('thead', null, [el('tr', null, [
      el('th', {text:'Чат'}), el('th', {text:'Сообщений'}), el('th', {text:'Автор'}), el('th')
    ])]),
    tbody
  ])]));
  return out;
}

// ---------- юзеры ----------

function membersView() {
  const all = new Map();

  Object.values(S.users).forEach(u => {
    if (u.nick) all.set(u.nick.toLowerCase(), u);
  });

  function addAuthor(name, uid, date) {
    if (!name) return;
    const k = name.toLowerCase();
    if (!all.has(k)) all.set(k, {nick: name, role:'user', created: date, uid: uid});
  }
  S.threads.forEach(th => {
    addAuthor(th.author, th.uid, th.date);
    Object.values(th.posts || {}).forEach(p => addAuthor(p.author, p.uid, p.date));
  });
  Object.values(S.chats).forEach(c => {
    addAuthor(c.author, c.uid, c.date);
    Object.values(c.messages || {}).forEach(m => addAuthor(m.author, m.uid, m.date));
  });
  if (S.user) addAuthor(S.user.nick, S.user.uid, Date.now());

  const tbody = el('tbody');
  Array.from(all.values()).forEach(u => {
    tbody.appendChild(el('tr', null, [
      el('td', null, [nick(u.uid || u.nick, u.nick)]),
      el('td', {text: u.owner ? 'Owner' : (u.role || 'user')}),
      el('td', {text: fmt(u.created)})
    ]));
  });

  return [el('h2', {text:'Юзеры'}), el('div', {class:'tablebox'}, [el('table', null, [tbody])])];
}

// ---------- отрисовка ----------

function drawWho() {
  const w = document.getElementById('who');
  w.innerHTML = '';
  if (S.user) w.append(nick(S.user.uid, S.user.nick), el('button', {text: t('out'), onclick: () => auth.signOut()}));
  else if (S.ready) w.append(el('button', {text: t('login'), onclick: () => { S.view = 'auth'; S.authMode = 'login'; draw(); }}));
  document.getElementById('nav-admin').style.display = isAdmin() ? '' : 'none';
}

function draw() {
  S.fill = null;
  const app = document.getElementById('app');
  app.innerHTML = '';
  drawWho();
  if (!S.ready) { app.append(el('div', {class:'muted', style:'text-align:center;padding:40px'}, [el('span', {class:'spinner'}), 'Загрузка...'])); return; }

  const id = {thread: S.open, chat: S.chatId, profile: S.profile}[S.view];
  history.replaceState(null, '', '#' + S.view + (id ? '/' + id : ''));

  let nodes;
  switch (S.view) {
    case 'auth': nodes = authView(); break;
    case 'thread': nodes = threadView(); break;
    case 'chatList': nodes = chatListView(); break;
    case 'chat': nodes = chatView(); break;
    case 'profile': nodes = profileView(); break;
    case 'members': nodes = membersView(); break;
    case 'admin': nodes = adminView(); break;
    case 'priv': nodes = privView(); break;
    default: nodes = listView();
  }
  nodes.forEach(n => { if (n) app.append(n); });
}

function refresh() {
  drawWho();
  if (!S.ready) return;
  if (S.fill && (S.view == 'chat' || S.view == 'thread')) S.fill();
  else if (S.view == 'auth' || (S.view == 'profile' && S.edit)) return;
  else draw();
}

const router = {
  home: () => { S.view = 'list'; S.open = null; draw(); },
  goChats: () => { S.view = 'chatList'; draw(); },
  goMembers: () => { S.view = 'members'; draw(); },
  goAdmin: () => { S.view = 'admin'; draw(); },
  goPriv: () => { S.view = 'priv'; draw(); },
  goNew: () => {
    if (!S.user) { S.view = 'auth'; draw(); return; }
    const title = (prompt('Заголовок:') || '').trim().slice(0, 120);
    const text = (prompt('Текст:') || '').trim().slice(0, 5000);
    if (title && text) {
      const r = db.ref('threads').push();
      r.set({
        title: title, uid: S.user.uid, author: S.user.nick, date: TS,
        posts: {p0: {uid: S.user.uid, author: S.user.nick, text: text, date: TS}}
      }).then(draw).catch(x => alert('Не создалось: ' + x.message));
    }
  }
};

// ---------- слушаем базу ----------

db.ref('users').on('value', s => {
  S.users = s.val() || {};
  const mine = S.user && S.users[S.user.uid];
  if (mine) {
    S.user.role = mine.role || 'user';
    S.user.premium = mine.premium === true;
    S.user.profile = mine.profile;
    S.user.phone = mine.phone;
    S.user.followers = mine.followers;
    S.user.owner = mine.owner === true || OWNERS.includes(S.user.login || '');
  }
  refresh();
}, err => {
  console.error('users не читаются:', err.message);
});

db.ref('threads').on('value', s => {
  const d = s.val() || {};
  S.threads = Object.keys(d).map(k => ({id: k, ...d[k]})).sort((a, b) => (b.date || 0) - (a.date || 0));
  refresh();
}, err => console.error('threads:', err.message));

db.ref('chats').on('value', s => {
  const d = s.val() || {};
  S.chats = {};
  Object.keys(d).forEach(k => { S.chats[k] = {id: k, ...d[k]}; });
  refresh();
}, err => console.error('chats:', err.message));

// ---------- кто залогинен ----------

async function loadUser(u) {
  if (!u) { S.user = null; return; }

  const fromMail = (u.email || '').split('@')[0];
  let me = {uid: u.uid, login: fromMail, nick: u.displayName || fromMail, role:'user', owner:false};

  try {
    let rec = await get('users/' + u.uid);
    let viaNick = false;

    if (!rec) {
      try {
        const all = await get('users');
        if (all) rec = Object.values(all).find(x => x.nick && x.nick.toLowerCase() == fromMail.toLowerCase());
        viaNick = !!rec;
      } catch (e) {
        console.warn('список юзеров не прочитать', e.message);
      }
    }

    if (rec) {
      me.nick = rec.nick || me.nick;
      if (!viaNick) { me.owner = !!rec.owner; me.role = rec.role || 'user'; }
      me.created = rec.created;
      if (!viaNick) me.premium = rec.premium === true;
      me.profile = rec.profile;
      me.phone = rec.phone;
      me.followers = rec.followers;
    }

    if (OWNERS.includes(fromMail.toLowerCase())) {
      me.owner = true;
      if (get_has(rec, u.uid) && rec.owner !== true) db.ref('users/' + u.uid + '/owner').set(true).catch(e => console.warn('owner:', e.message));
    }

    if (get_has(rec, u.uid)) claimNick(me.nick, u.uid).catch(() => {});

    if (!get_has(rec, u.uid)) {
      try {
        await claimNick(me.nick, u.uid);
        await set('users/' + u.uid, {uid: u.uid, nick: me.nick, role: me.role, owner: me.owner, premium: false, created: me.created || TS, profile: me.profile || {}});
      } catch (e) {
        console.warn('не смог создать запись юзера', e.message);
      }
    }
  } catch (e) {
    console.error('loadUser:', e.message);
  }

  S.user = me;
}

function get_has(rec, uid) {
  return !!(rec && rec.uid == uid);
}

db.ref('follows').on('value', s => { S.follows = s.val() || {}; refresh(); }, err => console.error('follows:', err.message));

(function () {
  const [v, i] = location.hash.slice(1).split('/');
  if (['thread', 'chat', 'chatList', 'profile', 'members', 'admin', 'priv'].includes(v)) {
    S.view = v;
    if (v == 'thread') S.open = i;
    if (v == 'chat') S.chatId = i;
    if (v == 'profile') S.profile = i;
  }
})();

auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(e => console.warn('persistence:', e.code));

auth.onAuthStateChanged(async u => {
  if (S.registering) return;
  await loadUser(u);
  S.ready = true;
  draw();
});

setLang(lang);
</script>
