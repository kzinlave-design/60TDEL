<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>60TDEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#0a0a0c; --bg-2:#0f0f12; --surface:#141418; --surface-2:#1a1a20; --surface-3:#212129;
  --pin:#1c0f0f;
  --line:#26262e; --line-2:#34343e; --line-3:#454552;
  --fg:#ececf0; --fg-dim:#c8c8d0; --muted:#7c7c88; --muted-2:#5a5a66;
  --link:#e05a5a; --accent:#e04a4a; --accent-2:#ff5c5c; --accent-dim:#7a2424;
  --btn-bg:#c0392b; --btn-fg:#fff;
  --nav-bg:rgba(10,10,12,.85); --nav-fg:#ececf0; --nav-line:#1f1f26;
  --ok:#3fbf6f; --warn:#e0a040; --err:#e05a5a;
  --radius:6px; --radius-sm:4px;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.25);
  --font-body:"Inter","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(224,74,74,.06), transparent 60%),
    radial-gradient(900px 500px at -10% 100%, rgba(80,120,255,.04), transparent 60%),
    var(--bg);
  color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;margin:0;
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
::selection{background:rgba(224,74,74,.35);color:#fff}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.97);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes emojiPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
.anim-fadeup{animation:fadeUp .35s cubic-bezier(.22,.7,.3,1) both}
.anim-fadein{animation:fadeIn .3s ease both}
.anim-pop{animation:pop .3s cubic-bezier(.22,.8,.3,1.1) both}
.spinner{width:14px;height:14px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-2px;margin-right:6px}
.ico{display:inline-flex;vertical-align:-3px;margin-right:6px;flex:none}
.ico svg{display:block;width:16px;height:16px}

.nav{background:var(--nav-bg);border-bottom:1px solid var(--nav-line);padding-inline:16px;position:sticky;top:0;z-index:20;backdrop-filter:saturate(180%) blur(14px)}
.nav-in{max-width:1240px;margin-inline:auto;display:flex;align-items:center;gap:2px;min-height:60px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:center;background:none;border:0;padding:4px 12px 4px 0;cursor:pointer;margin-right:8px}
.brand svg{height:38px;width:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.nav button.link{background:none;border:0;color:var(--nav-fg);opacity:.66;padding:8px 11px;cursor:pointer;font-size:13.5px;position:relative;white-space:nowrap;border-radius:var(--radius-sm);font-weight:500}
.nav button.link:hover{opacity:1;color:var(--accent-2);background:rgba(224,74,74,.07)}
.nav button.link[aria-current="page"]{opacity:1;color:var(--accent-2)}
.nav button.link[aria-current="page"]::after{content:"";position:absolute;left:11px;right:11px;bottom:1px;height:2px;background:var(--accent);border-radius:2px}
.nav .who{margin-left:auto;color:var(--nav-fg);opacity:.9;font-family:var(--font-mono);font-size:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nav .who button{margin-left:4px;background:none;border:1px solid var(--nav-line);color:var(--nav-fg);padding:5px 11px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px}
.nav .who button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.lang{display:inline-flex;border:1px solid var(--nav-line);border-radius:var(--radius-sm);overflow:hidden;margin-left:8px}
.lang button{background:none;border:0;color:var(--nav-fg);padding:5px 9px;font-size:11px;font-family:var(--font-mono);cursor:pointer;opacity:.6}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff;opacity:1}

.wrap{max-width:1180px;margin-inline:auto;padding-inline:16px;padding-block:28px 64px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.015em}
h2{font-size:17px;position:relative;padding-left:12px}
h2::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;background:linear-gradient(180deg,var(--accent),var(--accent-dim));border-radius:3px}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.hero{padding:22px 0 6px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line);padding-bottom:16px}
.hero h1{font-size:28px;font-weight:700;background:linear-gradient(180deg,#fff,#b8b8c4);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{font-size:13px;color:var(--muted);font-family:var(--font-mono)}

.stats{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.stats .grid{display:grid;grid-template-columns:repeat(4,1fr)}
.stats .cell{padding:14px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.stats .cell:last-child{border-right:0}
.stats .cell .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.stats .cell .v{font-size:22px;font-weight:600;font-family:var(--font-mono)}
.stats .cell .v.accent{color:var(--accent-2)}
@media (max-width:700px){
  .stats .grid{grid-template-columns:repeat(2,1fr)}
  .stats .cell:nth-child(2){border-right:0}
  .stats .cell:nth-child(1),.stats .cell:nth-child(2){border-bottom:1px solid var(--line)}
}

.search{display:flex;flex-direction:column;gap:12px;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
.search .cap{font-weight:600;color:var(--fg-dim);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.modes{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.modes label{display:flex;align-items:center;gap:7px;cursor:pointer}
.modes input{accent-color:var(--accent);cursor:pointer}
.sf{display:flex;gap:8px;width:100%;max-width:560px}
.sf input[type=search]{flex:1;min-width:0;background:var(--bg-2);border:1px solid var(--line);padding:10px 13px;border-radius:var(--radius-sm)}
.sf input[type=search]:focus{border-color:var(--accent);outline:none}
.btn{background:var(--surface-2);border:1px solid var(--line);padding:9px 15px;border-radius:var(--radius-sm);cursor:pointer;display:inline-flex;align-items:center;text-decoration:none;font-size:13.5px;line-height:1.2;font-weight:500;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--line-3);background:var(--surface-3);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(180deg,var(--accent-2),var(--btn-bg));color:var(--btn-fg);border-color:var(--btn-bg);font-weight:600}
.btn.primary:hover{background:linear-gradient(180deg,#ff6b6b,#d0483a);border-color:#d0483a;color:#fff}
.btn.danger{background:transparent;color:var(--err);border-color:#5a2020}
.btn.danger:hover{background:#3a1414;border-color:#8a2a2a}
.btn.small{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.count{font-size:12.5px;color:var(--muted);font-family:var(--font-mono)}

.pager{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.pager button{background:none;border:0;border-right:1px solid var(--line);padding:6px 13px;min-width:36px;cursor:pointer;font-size:13px;color:var(--fg);font-family:var(--font-mono)}
.pager button:last-child{border-right:0}
.pager button:hover{background:var(--surface-2);color:var(--accent-2)}
.pager button[aria-current="true"]{background:var(--accent);color:#fff}
.pager button:disabled{opacity:.35;cursor:default}

.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:0}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
thead th{font-weight:600;background:var(--surface-2);font-size:11.5px;white-space:nowrap;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
tbody tr{background:var(--surface)}
tbody tr:nth-child(even){background:var(--bg-2)}
tbody tr.pin{background:var(--pin)}
td.num,th.num{text-align:center;width:1%;white-space:nowrap}
td.date,th.date{text-align:right;white-space:nowrap;width:1%}
td.title{width:100%;min-width:0}
tr.row{cursor:pointer}
tr.row:hover{background:var(--surface-2)}
.rowbtn{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--fg);font-weight:500;font-size:14.5px}
.rowbtn:hover{text-decoration:underline;color:var(--accent-2)}
.sub{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.board-tag{font-size:10.5px;color:var(--accent-2);border:1px solid var(--accent-dim);border-radius:3px;padding:1px 6px;margin-right:8px;white-space:nowrap;font-family:var(--font-mono);text-transform:uppercase;background:rgba(224,74,74,.06)}
.empty{padding:40px 12px;text-align:center;color:var(--muted);font-size:14px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}

.compose{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.compose label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500}
.compose input,.compose select,.compose textarea{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 11px;color:var(--fg);width:100%}
.compose input:focus,.compose select:focus,.compose textarea:focus{border-color:var(--accent);outline:none}
.compose textarea{min-height:120px;resize:vertical;font-family:inherit;line-height:1.55}
.compose .row2{display:grid;grid-template-columns:1fr 220px;gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:11.5px;color:var(--muted-2)}

.drop{border:1px dashed var(--line-2);border-radius:var(--radius-sm);padding:12px;background:var(--bg-2);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.drop.dragover{border-color:var(--accent);background:rgba(224,74,74,.06)}
.drop .droprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.drop .thumb{width:72px;height:72px;border:1px solid var(--line);border-radius:var(--radius-sm);object-fit:cover;background:var(--surface-2)}
.drop .thumb-v{width:110px;height:72px;border:1px solid var(--line);border-radius:var(--radius-sm);object-fit:cover;background:#000}
.badge{font-size:11px;font-family:var(--font-mono);color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:2px 7px}
.badge.warn{color:var(--warn);border-color:#5a4400}
.badge.err{color:var(--err);border-color:#5a2020}
.badge.ok{color:var(--ok);border-color:#1f4a1f}
.progress{height:4px;width:100%;background:var(--surface-2);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0%;transition:width .2s}

.auth{max-width:420px;margin:0 auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.auth h2{font-size:20px;padding-left:12px}
.auth label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500}
.auth input{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;color:var(--fg);width:100%}
.auth input:focus{border-color:var(--accent);outline:none}
.auth .switch{font-size:12.5px;color:var(--muted);text-align:center}
.auth .switch button{background:none;border:0;color:var(--link);cursor:pointer;text-decoration:underline;padding:0;font-weight:500}
.auth .hintline{font-size:12px;color:var(--muted-2);line-height:1.5}
.err{color:var(--err);font-size:12.5px;min-height:16px;font-weight:500}

.post{display:grid;grid-template-columns:150px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.post+.post{margin-top:10px}
.post .who{padding:14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--surface-2)}
.avatar{width:44px;height:44px;border:1px solid var(--line-2);color:var(--fg);display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:17px;text-transform:uppercase;overflow:hidden;cursor:pointer;border-radius:var(--radius-sm);background:var(--surface)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.post .name{font-weight:500;overflow-wrap:anywhere;display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-size:14px}
.post .body{padding:14px 16px;min-width:0}
.post .meta{font-size:11.5px;color:var(--muted);margin-bottom:8px;font-family:var(--font-mono);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.post .text{white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 8px;line-height:1.6;font-size:14.5px}
.post .attach{margin-top:8px}
.post .attach img{max-width:100%;max-height:480px;border:1px solid var(--line);border-radius:var(--radius-sm);display:block;cursor:zoom-in}
.post .attach video{max-width:100%;max-height:480px;border:1px solid var(--line);border-radius:var(--radius-sm);display:block;background:#000}
.post-actions{margin-left:auto;display:inline-flex;gap:4px;opacity:0;transition:opacity .2s}
.post:hover .post-actions{opacity:1}
.post-actions button{background:none;border:1px solid var(--line);color:var(--muted);width:26px;height:26px;border-radius:var(--radius-sm);cursor:pointer;display:grid;place-items:center;font-size:12px;padding:0}
.post-actions button:hover{color:var(--accent-2);border-color:var(--accent-dim);background:rgba(224,74,74,.08)}

.edit-row{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.edit-row textarea{background:var(--bg-2);border:1px solid var(--accent-dim);border-radius:var(--radius-sm);padding:10px 12px;color:var(--fg);width:100%;min-height:90px;resize:vertical;font-family:inherit;line-height:1.55}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);display:grid;place-items:center;z-index:50;cursor:zoom-out}
.lightbox img,.lightbox video{max-width:92vw;max-height:92vh;border:1px solid var(--line-2);border-radius:var(--radius)}
.back{align-self:flex-start}
.titlebar{display:flex;flex-direction:column;gap:6px}
.titlebar h1{font-size:24px;font-weight:700;letter-spacing:-.02em}

.page{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.page h1{font-size:26px;font-weight:700;background:linear-gradient(180deg,#fff,#c0c0cc);-webkit-background-clip:text;background-clip:text;color:transparent}
.page .body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font-size:15px;color:var(--fg-dim)}
.page .body:empty::before{content:attr(data-empty);color:var(--muted);font-style:italic}
.page .meta{font-size:11.5px;color:var(--muted-2);font-family:var(--font-mono)}
.page .tools{display:flex;gap:8px;flex-wrap:wrap}
.page textarea{min-height:280px;resize:vertical;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;color:var(--fg);font-family:var(--font-mono);font-size:13px;line-height:1.6}
.page input[type=text]{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;color:var(--fg);font-size:16px;font-weight:500;width:100%}

.footer{border-top:1px solid var(--nav-line);padding:22px 16px;text-align:center;color:var(--muted-2);font-family:var(--font-mono);font-size:12px;background:rgba(10,10,12,.6)}
.footer b{color:var(--accent);font-weight:600;letter-spacing:.05em}
.footer .sep{opacity:.4;margin:0 10px}

.chatbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chatform{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end;box-shadow:var(--shadow)}
.chatform input{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;color:var(--fg);width:100%}
.chatform input:focus{border-color:var(--accent);outline:none}
.chatwin{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);min-height:340px;max-height:65vh;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.chatmsg{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px}
.chatmsg .av{width:40px;height:40px;border:1px solid var(--line-2);color:var(--fg);display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:15px;text-transform:uppercase;overflow:hidden;cursor:pointer;border-radius:var(--radius-sm);background:var(--surface)}
.chatmsg .av img{width:100%;height:100%;object-fit:cover;display:block}
.chatmsg .bub{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;min-width:0}
.chatmsg.self .bub{border-color:var(--accent-dim);background:linear-gradient(180deg,var(--surface-2),#1e1414)}
.chatmsg .top{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:5px;flex-wrap:wrap}
.chatmsg .top .time{color:var(--muted-2);font-family:var(--font-mono);font-size:11px;margin-left:auto;white-space:nowrap}
.chatmsg .txt{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font-size:14px;line-height:1.55}
.chatmsg .attach{margin-top:8px}
.chatmsg .attach img,.chatmsg .attach video{max-width:100%;max-height:340px;border:1px solid var(--line);border-radius:var(--radius-sm);display:block}
.chat-empty{color:var(--muted);text-align:center;padding:40px 12px;font-size:14px}
.chat-hint{font-size:12px;color:var(--muted);text-align:center}

.dm-list{display:flex;flex-direction:column;gap:6px}
.dm-item{border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 14px;background:var(--bg-2);display:flex;align-items:center;gap:12px;cursor:pointer}
.dm-item:hover{border-color:var(--accent-dim);background:var(--surface-2)}
.dm-item .av{width:38px;height:38px;border-radius:50%;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;font-weight:600;font-family:var(--font-mono);color:var(--accent);flex:none}
.dm-item .av img{width:100%;height:100%;object-fit:cover;display:block}
.dm-item .info{flex:1;min-width:0}
.dm-item .name{font-weight:600;font-size:14px}
.dm-item .last{font-size:12px;color:var(--muted);white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.dm-item .meta{font-size:11px;color:var(--muted-2);font-family:var(--font-mono)}

.chat-head{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px;box-shadow:var(--shadow)}
.chat-head .av{width:56px;height:56px;border-radius:50%;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;font-weight:600;font-family:var(--font-mono);color:var(--accent);flex:none;font-size:22px}
.chat-head .av img{width:100%;height:100%;object-fit:cover;display:block}
.chat-head .info{flex:1;min-width:0}
.chat-head .info h1{font-size:20px;font-weight:700}
.chat-head .info .desc{font-size:13px;color:var(--muted);margin-top:3px}

.profile-head{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden;position:relative;box-shadow:var(--shadow)}

function register(username,pass){

  if(OWNERS.indexOf(key)>=0) return Promise.reject(new Error(t('errUsernameTaken')));
  return usernameTaken(username).then(function(taken){

  }).then(function(cred){

  var key=usernameToKey(username);
  if(!isSafeKey(key)) return Promise.reject(new Error(t('errUserNotFound')));

    return fbGet('users/'+key);

    S.isAdmin=!!(rec&&(rec.role==='admin'||rec.role==='moderator'))||S.isOwnerFlag;

/* ---------- MEDIA ---------- */
function compressImage(file,maxSide,maxBytes){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();
    reader.onload=function(){
      var img=new Image();
      img.onload=function(){
        var w=img.width,h=img.height;
        var scale=Math.min(1,maxSide/Math.max(w,h));
        w=Math.round(w*scale); h=Math.round(h*scale);
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        var q=0.85,url=c.toDataURL('image/jpeg',q);
        while(url.length*0.75>maxBytes&&q>0.3){ q-=0.08; url=c.toDataURL('image/jpeg',q); }
        if(url.length*0.75>maxBytes){ reject(new Error(t('photoFail')+fmtBytes(maxBytes))); return; }
        resolve(url);
      };
      img.onerror=function(){ reject(new Error(t('notImage'))); };
      img.src=reader.result;
    };
    reader.onerror=function(){ reject(new Error(t('fileReadFail'))); };
    reader.readAsDataURL(file);
  });
}
function videoDuration(file){
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file);
    var v=document.createElement('video');
    v.preload='metadata';
    v.onloadedmetadata=function(){ URL.revokeObjectURL(url); resolve(v.duration); };
    v.onerror=function(){ URL.revokeObjectURL(url); reject(new Error(t('videoReadFail'))); };
    v.src=url;
  });
}
function reencodeVideo(file,targetBytes,onProgress){
  var url=URL.createObjectURL(file);
  var v=document.createElement('video');
  v.src=url; v.muted=true; v.playsInline=true; v.preload='auto';
  return new Promise(function(res,rej){ v.onloadedmetadata=function(){res();}; v.onerror=function(){rej(new Error(t('videoReadFail')));}; })
  .then(function(){
    var dur=v.duration;
    var scale=Math.min(1,480/Math.max(v.videoWidth,v.videoHeight));
    var w=Math.max(2,Math.round(v.videoWidth*scale));
    var h=Math.max(2,Math.round(v.videoHeight*scale));
    var canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
    var ctx=canvas.getContext('2d');
    var stream=canvas.captureStream(24);
    var mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp8')?'video/webm;codecs=vp8':(MediaRecorder.isTypeSupported('video/webm')?'video/webm':'');
    if(!mime){ URL.revokeObjectURL(url); throw new Error(t('videoNoRecorder')); }
    var chunks=[];
    var rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:700000});
    rec.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data); };
    var done=new Promise(function(res){ rec.onstop=function(){res();}; });
    rec.start(200);
    v.currentTime=0;
    return v.play().catch(function(){}).then(function(){
      var raf;
      var draw=function(){ if(v.paused||v.ended) return; ctx.drawImage(v,0,0,w,h); if(onProgress) onProgress(Math.min(1,v.currentTime/dur)); raf=requestAnimationFrame(draw); };
      raf=requestAnimationFrame(draw);
      return new Promise(function(res){ var stop=function(){ cancelAnimationFrame(raf); res(); }; v.onended=stop; setTimeout(stop,(dur+0.5)*1000); });
    }).then(function(){
      rec.stop();
      return done;
    }).then(function(){
      URL.revokeObjectURL(url);
      var blob=new Blob(chunks,{type:'video/webm'});
      if(blob.size>targetBytes) throw new Error(t('videoTooBig')+fmtBytes(blob.size));
      var reader=new FileReader();
      return new Promise(function(res2,rej2){ reader.onload=function(){res2(reader.result);}; reader.onerror=function(){rej2(new Error(t('fileReadFail')));}; reader.readAsDataURL(blob); });
    });
  });
}
function readAsDataURL(file){
  return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){res(r.result);}; r.onerror=function(){rej(new Error(t('fileReadFail')));}; r.readAsDataURL(file); });
}
function packMedia(a){
  var p={};
  if(a.imageData){ p.media=a.imageData; p.mediaType='image'; }
  else if(a.videoData){ p.media=a.videoData; p.mediaType='video'; }
  if(a.linkUrl) p.link=a.linkUrl;
  return p;
}
function verifyImageUrl(url){
  return new Promise(function(resolve){
    var s=String(url||'').trim();
    if(!s){ resolve(false); return; }
    if(!/^data:image\//i.test(s)){ resolve(true); return; }
    var img=new Image(); var done=false;
    var finish=function(ok){ if(done) return; done=true; resolve(ok); };
    img.onload=function(){ finish(img.naturalWidth>0&&img.naturalHeight>0); };
    img.onerror=function(){ finish(false); };
    setTimeout(function(){ finish(false); },4000);
    img.src=s;
  });
}
function makeAvatarImg(url,onFail){
  var img=document.createElement('img'); img.alt=''; img.src=url;
  var failed=false;
  var fail=function(){ if(failed) return; failed=true; img.remove(); if(onFail) onFail(); };
  img.addEventListener('error',fail);
  if(img.decode){ img.decode().catch(fail); }
  return img;
}

/* ---------- COOLDOWN / MUTE ---------- */
function getCooldown(nick){
  var r=userRecord(nick);
  var c=r&&typeof r.threadCooldown==='number'?r.threadCooldown:DEFAULT_THREAD_COOLDOWN;
  return Math.max(0,c|0);
}
function lastThreadTime(nick){ return S.threads.filter(function(th){ return th.author===nick; }).reduce(function(m,th){ return Math.max(m,th.date||0); },0); }
function cooldownRemaining(nick){
  var cd=getCooldown(nick)*1000;
  if(!cd) return 0;
  var last=lastThreadTime(nick);
  return Math.max(0,cd-(Date.now()-last));
}
function parseMuteDuration(str){
  if(!str) return 0;
  var m=String(str).trim().toLowerCase().match(/^(\d+)\s*(s|m|h|d)?$/);
  if(!m) return 0;
  var n=parseInt(m[1],10);
  var u=m[2]||'m';
  var mult=u==='s'?1000:u==='m'?60000:u==='h'?3600000:86400000;
  return n*mult;
}
function isMuted(chat,c){
  if(!chat||!chat.mutes||!c) return 0;
  var until=chat.mutes[usernameToKey(c)]||0;
  return until>Date.now()?until:0;
}

function attachmentsBlock(opts){
  opts=opts||{};
  var allowMedia=opts.allowMedia!==false;
  var wrap=el('div',{class:'drop'});
  var state={imageData:null,videoData:null,linkUrl:''};
  var preview=el('div',{class:'droprow'});
  var info=el('div',{class:'badge',text:allowMedia?t('limitInfo'):''});
  var progWrap=el('div',{class:'progress'},[el('i')]); progWrap.style.display='none';
  var imgInput=el('input',{type:'file',accept:'image/*',style:'display:none'});
  imgInput.addEventListener('change',function(){ if(imgInput.files[0]) handleImage(imgInput.files[0]); });
  var vidInput=el('input',{type:'file',accept:'video/*',style:'display:none'});
  vidInput.addEventListener('change',function(){ if(vidInput.files[0]) handleVideo(vidInput.files[0]); });
  if(allowMedia){
    var imgBtn=el('button',{type:'button',class:'btn small'},[icon('image'),t('photo')]);
    imgBtn.addEventListener('click',function(){imgInput.click();});
    var vidBtn=el('button',{type:'button',class:'btn small'},[icon('video'),t('video')+' ≤ '+VIDEO_MAX_SEC+'s']);
    vidBtn.addEventListener('click',function(){vidInput.click();});
    var pasteBtn=el('button',{type:'button',class:'btn small'},[icon('clipboard'),t('fromClipboard')]);
    pasteBtn.addEventListener('click',function(){
      if(!(navigator.clipboard&&navigator.clipboard.read)){ setInfo(t('clipboardDenied'),'warn'); return; }
      navigator.clipboard.read().then(function(items){
        for(var i=0;i<items.length;i++){
          var t2=null; for(var j=0;j<items[i].types.length;j++){ if(items[i].types[j].indexOf('image/')===0){ t2=items[i].types[j]; break; } }
          if(t2){ return items[i].getType(t2).then(function(blob){ handleImage(new File([blob],'paste.png',{type:t2})); }); }
        }
        setInfo(t('clipboardEmpty'),'warn');
      }).catch(function(){ setInfo(t('clipboardDenied'),'warn'); });
    });
    var clearBtn=el('button',{type:'button',class:'btn small'},[icon('trash'),t('clear')]);
    clearBtn.addEventListener('click',function(){ state.imageData=null; state.videoData=null; state.linkUrl=''; imgInput.value=''; vidInput.value=''; if(linkInput) linkInput.value=''; renderPreview(); setInfo(t('cleared'),''); progWrap.style.display='none'; });
    wrap.appendChild(el('div',{class:'droprow'},[imgBtn,vidBtn,pasteBtn,clearBtn]));
    wrap.appendChild(imgInput); wrap.appendChild(vidInput);
  } else {
    wrap.appendChild(el('div',{class:'hint',text:'⚠ Медиа в личных сообщениях отключено'}));
  }
  var linkInput=el('input',{type:'url',placeholder:t('linkPlaceholder')});
  linkInput.addEventListener('input',function(){ state.linkUrl=linkInput.value.trim(); renderPreview(); });
  wrap.appendChild(linkInput);
  wrap.appendChild(progWrap); wrap.appendChild(info); wrap.appendChild(preview);
  ['dragenter','dragover'].forEach(function(ev){ wrap.addEventListener(ev,function(e){ if(!allowMedia) return; e.preventDefault();wrap.classList.add('dragover'); }); });
  ['dragleave','drop'].forEach(function(ev){ wrap.addEventListener(ev,function(e){ if(!allowMedia) return; e.preventDefault();wrap.classList.remove('dragover'); }); });
  wrap.addEventListener('drop',function(e){ if(!allowMedia) return; var f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(!f) return; if(f.type.indexOf('video/')===0) handleVideo(f); else if(f.type.indexOf('image/')===0) handleImage(f); });
  function setInfo(text,kind){ info.textContent=text; info.className='badge'+(kind==='err'?' err':kind==='warn'?' warn':kind==='ok'?' ok':''); }
  function handleImage(file){ setInfo(t('photoCompressing'),''); compressImage(file,IMG_MAX_SIDE,IMG_MAX_BYTES).then(function(dataUrl){ state.imageData=dataUrl; state.videoData=null; renderPreview(); setInfo(t('photoDone')+fmtBytes(dataUrl.length*0.75),'ok'); }).catch(function(ex){ setInfo(ex.message,'err'); }); }
  function handleVideo(file){
    progWrap.style.display=''; progWrap.firstChild.style.width='0%'; setInfo(t('videoChecking'),'');
    videoDuration(file).then(function(dur){
      if(!isFinite(dur)||dur>VIDEO_MAX_SEC+0.3){ setInfo(t('videoTooLong')+dur.toFixed(1)+t('videoTooLongTail'),'err'); progWrap.style.display='none'; return; }
      if(file.size<=VIDEO_MAX_BYTES){ return readAsDataURL(file).then(function(dataUrl){ if(dataUrl.length*0.75>8*1024*1024){ setInfo(t('videoToBaseTooBig'),'err'); progWrap.style.display='none'; return; } state.videoData=dataUrl; state.imageData=null; renderPreview(); setInfo(t('videoDone')+fmtBytes(dataUrl.length*0.75),'ok'); progWrap.style.display='none'; }); }
      setInfo(t('videoReencoding'),'');
      return reencodeVideo(file,VIDEO_TARGET,function(p){ progWrap.firstChild.style.width=Math.round(p*100)+'%'; }).then(function(dataUrl){ state.videoData=dataUrl; state.imageData=null; renderPreview(); setInfo(t('videoReencDone')+fmtBytes(dataUrl.length*0.75),'ok'); progWrap.style.display='none'; });
    }).catch(function(ex){ setInfo(ex.message,'err'); progWrap.style.display='none'; });
  }
  function renderPreview(){
    preview.replaceChildren();
    if(state.imageData){
      verifyImageUrl(state.imageData).then(function(ok){
        if(!ok){ setInfo('broken','err'); return; }
        var i=el('img',{class:'thumb',src:state.imageData,alt:''}); i.addEventListener('error',function(){i.remove();}); preview.appendChild(i);
      });
    }
    if(state.videoData){ var v=el('video',{class:'thumb-v',src:state.videoData,controls:'',preload:'metadata'}); v.addEventListener('error',function(){v.remove();}); preview.appendChild(v); }
    var safeLink=safeMediaUrl(state.linkUrl);
    if(safeLink){
      var isV=/\.(mp4|webm|ogg|mov)(\?|$)/i.test(safeLink);
      if(isV){ var v2=el('video',{class:'thumb-v',src:safeLink,controls:'',preload:'metadata'}); v2.addEventListener('error',function(){v2.remove();}); preview.appendChild(v2); }
      else { var i2=el('img',{class:'thumb',src:safeLink,alt:''}); i2.addEventListener('error',function(){i2.remove();}); preview.appendChild(i2); }
    }
  }
  wrap.getData=function(){ return {imageData:state.imageData,videoData:state.videoData,linkUrl:safeMediaUrl(state.linkUrl)}; };
  return wrap;
}
function mediaNode(p){
  var nodes=[];
  var addImage=function(src){
    var safe=safeMediaUrl(src); if(!safe) return;
    verifyImageUrl(safe).then(function(ok){
      if(!ok) return;
      var img=el('img',{src:safe,alt:'',loading:'lazy'});
      img.addEventListener('error',function(){img.remove();});
      img.addEventListener('click',function(){openLightbox(el('img',{src:safe,alt:''}));});
      nodes.push(el('div',{class:'attach'},[img]));
    });
  };
  var addVideo=function(src){
    var safe=safeMediaUrl(src); if(!safe) return;
    var v=el('video',{src:safe,controls:'',preload:'metadata'});
    v.addEventListener('error',function(){v.remove();});
    nodes.push(el('div',{class:'attach'},[v]));
  };
  if(p.media){ if(p.mediaType==='video') addVideo(p.media); else addImage(p.media); }
  if(p.link){
    var safeLink=safeMediaUrl(p.link);
    if(safeLink){ var isV=/\.(mp4|webm|ogg|mov)(\?|$)/i.test(safeLink); if(isV) addVideo(safeLink); else addImage(safeLink); }
  }
  return nodes.length?nodes[0]:null;
}

function home(){ S.view='list'; S.open=null; S.board=null; S.q=''; S.page=1; S.compose=false; S.pageEdit=null; S.chatId=null; S.chatCreating=false; S.profileUser=null; S.profileEdit=false; S.adminTab='users'; S.dmId=null; render(); window.scrollTo(0,0); }
function goPage(id){ S.view=id; S.open=null; S.compose=false; S.pageEdit=null; S.chatId=null; S.profileUser=null; S.profileEdit=false; S.dmId=null; render(); window.scrollTo(0,0); }
function goChats(){ S.view='chatList'; S.open=null; S.compose=false; S.pageEdit=null; S.chatId=null; S.profileUser=null; S.profileEdit=false; S.dmId=null; render(); window.scrollTo(0,0); }
function goDms(){ S.view='dmList'; S.open=null; S.compose=false; S.pageEdit=null; S.chatId=null; S.profileUser=null; S.profileEdit=false; S.dmId=null; render(); window.scrollTo(0,0); }
function goAdmin(){ S.view='admin'; S.open=null; S.compose=false; S.pageEdit=null; S.chatId=null; S.profileUser=null; S.profileEdit=false; S.dmId=null; render(); window.scrollTo(0,0); }
function openThread(id){ if(!isSafeKey(id)) return; S.view='thread'; S.open=id; render(); window.scrollTo(0,0); bumpViews(id).catch(function(){}); }

/* ---------- RENDER ---------- */
function captureFormState(){
  var state={focusId:null,selStart:null,selEnd:null,values:{}};
  var a=document.activeElement;
  if(a){ if(a.id) state.focusId=a.id; if(a.selectionStart!=null){ state.selStart=a.selectionStart; state.selEnd=a.selectionEnd; } }
  appEl.querySelectorAll('input,textarea,select').forEach(function(elx){
    var key=elx.id;
    if(!key) key='__'+elx.tagName+'_'+(elx.getAttribute('placeholder')||'')+'_'+(elx.getAttribute('type')||'')+'_'+(elx.name||'');
    state.values[key]=elx.value;
  });
  return state;
}
function restoreFormState(state){
  if(!state) return;
  appEl.querySelectorAll('input,textarea,select').forEach(function(elx){
    var key=elx.id;
    if(!key) key='__'+elx.tagName+'_'+(elx.getAttribute('placeholder')||'')+'_'+(elx.getAttribute('type')||'')+'_'+(elx.name||'');
    if(Object.prototype.hasOwnProperty.call(state.values,key)){
      if(elx.value!==state.values[key]) elx.value=state.values[key];
    }
  });
  if(state.focusId){
    var elx=document.getElementById(state.focusId);
    if(elx&&typeof elx.focus==='function'){
      try{ elx.focus({preventScroll:true}); if(state.selStart!=null&&elx.setSelectionRange) elx.setSelectionRange(state.selStart,state.selEnd); }catch(e){}
    }
  }
}
function render(){
  try{
    var formState=captureFormState();
    var oldWin=document.getElementById('chat-win');
    var wasAtBottom=oldWin?(oldWin.scrollHeight-oldWin.scrollTop-oldWin.clientHeight<50):true;
    appEl.replaceChildren();
    var nodes=[];
    if(S.view==='auth') nodes=authView();
    else if(S.view==='thread') nodes=threadView();
    else if(S.view==='members') nodes=membersView();
    else if(S.view==='chatList') nodes=chatListView();
    else if(S.view==='chat') nodes=chatView();
    else if(S.view==='dmList') nodes=dmListView();
    else if(S.view==='dm') nodes=dmView();
    else if(S.view==='profile') nodes=profileView();
    else if(S.view==='admin') nodes=adminView();
    else if(PAGES.some(function(p){ return p.id===S.view; })) nodes=pageView();
    else nodes=listView();
    nodes.filter(function(n){ return n instanceof Node; }).forEach(function(n){ appEl.appendChild(n); });
    setNav();
    restoreFormState(formState);
    if(S.view==='chat'||S.view==='dm'){ var nw=document.getElementById('chat-win'); if(nw&&wasAtBottom) nw.scrollTop=nw.scrollHeight; }
  }catch(e){
    console.error('Render error:',e);
    appEl.replaceChildren();
    appEl.appendChild(el('div',{class:'empty',style:'color:#e05a5a;padding:40px;text-align:center'},[
      el('div',{text:'Render error'}),
      el('div',{class:'mono',style:'font-size:12px;margin-top:8px;opacity:.7',text:String(e&&e.message||e)})
    ]));
  }
}
var _pendingRender=false, _renderTimer=null;
function isUserTyping(){
  var a=document.activeElement;
  if(!a) return false;
  var tag=a.tagName;
  if(tag!=='INPUT'&&tag!=='TEXTAREA') return false;
  if(a.type==='checkbox'||a.type==='radio'||a.type==='file'||a.type==='color') return false;
  return true;
}
function scheduleRender(){
  if(isUserTyping()){
    _pendingRender=true;
    if(_renderTimer) clearTimeout(_renderTimer);
    _renderTimer=setTimeout(function(){ if(_pendingRender&&!isUserTyping()){ _pendingRender=false; render(); } },800);
    return;
  }
  render();
}
document.addEventListener('focusout',function(){ setTimeout(function(){ if(_pendingRender&&!isUserTyping()){ _pendingRender=false; render(); } },200); });

/* ---------- EVENTS ---------- */
$('brand').addEventListener('click',home);
$('nav-home').addEventListener('click',home);
$('nav-dm').addEventListener('click',goDms);

$('nav-catalog').addEventListener('click',function(){goPage('catalog');});

$('nav-about').addEventListener('click',function(){goPage('about');});

$('nav-new').addEventListener('click',function(){ if(!S.user){ S.view='auth'; S.authMode='login'; render(); return; } S.view='list'; S.open=null; S.compose=true; render(); window.scrollTo(0,0); });
$('nav-members').addEventListener('click',function(){S.view='members';S.open=null;S.compose=false;S.profileUser=null;render();window.scrollTo(0,0);});

var savedLang=storeGet('f60_lang');
if(savedLang==='en'||savedLang==='ru') S.lang=savedLang;
else S.lang=(navigator.language||'ru').toLowerCase().indexOf('en')===0?'en':'ru';

/* ---------- REALTIME ---------- */
var _lastUsersHash='',_lastThreadsHash='',_lastChatsHash='',_lastPagesHash='',_lastOnlineHash='',_lastSessionsHash='',_lastDmsHash='';
function quickHash(obj){ try{ var s=JSON.stringify(obj); return s.length+':'+s.slice(0,120); }catch(e){ return String(Date.now()); } }
db.ref('threads').on('value',function(snap){
  var data=snap.val()||{};
  var arr=Object.keys(data).map(function(k){ var o={id:k}; var v=data[k]; for(var kk in v) o[kk]=v[kk]; return o; }).sort(function(a,b){ return (b.pin?1:0)-(a.pin?1:0)||(b.date||0)-(a.date||0); });
  var h=quickHash(arr); if(h===_lastThreadsHash) return; _lastThreadsHash=h;
  S.threads=arr; scheduleRender();
},function(err){ console.error('threads:',err); });
db.ref('users').on('value',function(snap){
  var data=snap.val()||{};
  var h=quickHash(data); if(h===_lastUsersHash) return; _lastUsersHash=h;
  S.users=data; scheduleRender();
},function(err){ console.error('users:',err); });
db.ref('online').on('value',function(snap){
  var data=snap.val()||{};
  var h=quickHash(data); if(h===_lastOnlineHash) return; _lastOnlineHash=h;
  S.online=data;
  if(S.view==='list'||S.view==='members') scheduleRender();
});
db.ref('pages').on('value',function(snap){
  var data=snap.val()||{};
  var h=quickHash(data); if(h===_lastPagesHash) return; _lastPagesHash=h;
  S.pages=data;
  if(PAGES.some(function(p){return p.id===S.view;})||S.view==='admin') scheduleRender();
});
db.ref('chats').on('value',function(snap){
  var data=snap.val()||{};
  var h=quickHash(data); if(h===_lastChatsHash) return; _lastChatsHash=h;
  S.chats=data;
  if(S.view==='chatList'||S.view==='chat'||S.view==='admin') scheduleRender();
});
db.ref('dms').on('value',function(snap){
  var data=snap.val()||{};
  var h=quickHash(data); if(h===_lastDmsHash) return; _lastDmsHash=h;
  S.dms=data;
  if(S.view==='dmList'||S.view==='dm') scheduleRender();
});
db.ref('sessions').on('value',function(snap){
  var data=snap.val()||{};
  var h=quickHash(data); if(h===_lastSessionsHash) return; _lastSessionsHash=h;
  S.sessions=data;
  if(S.view==='profile'&&S.profileTab==='sessions') scheduleRender();
});

/* ---------- AUTH STATE ---------- */
auth.onAuthStateChanged(function(u){
  restoreFromAuth(u).catch(function(e){ console.error('restoreFromAuth:',e); });
});

/* ---------- INIT ---------- */
render();

})();
