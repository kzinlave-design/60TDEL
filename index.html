<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>60TDEL</title>
<style>
:root{
  --bg:#0d0d0f; --surface:#16161a; --surface-2:#1d1d22; --pin:#1a0d0d;
  --line:#2a2a30; --line-2:#3a3a42;
  --fg:#e8e8ec; --muted:#8a8a94; --link:#d94a4a;
  --btn-bg:#c0392b; --btn-fg:#fff; --nav-bg:#0d0d0f; --nav-fg:#e8e8ec;
  --nav-line:#2a2a30; --accent:#d94a4a; --accent-dim:#8a2a2a;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes emojiPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

.anim-fadeup{animation:fadeUp .35s cubic-bezier(.22,.7,.3,1) both}
.anim-fadein{animation:fadeIn .3s ease both}
.anim-pop{animation:pop .3s cubic-bezier(.22,.8,.3,1.1) both}
.spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-2px;margin-right:6px}

.ico{display:inline-flex;vertical-align:-3px;margin-right:6px;flex:none}
.ico svg{display:block;width:16px;height:16px}

.nav{background:var(--nav-bg);border-bottom:1px solid var(--nav-line);padding-inline:16px;position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
.nav-in{max-width:1200px;margin-inline:auto;display:flex;align-items:center;gap:4px;min-height:56px;flex-wrap:wrap;padding-block:4px}
.brand{display:flex;align-items:center;background:none;border:0;padding:4px 10px 4px 0;cursor:pointer;margin-right:6px}
.brand svg{height:38px;width:auto;display:block}
.nav button.link{background:none;border:0;color:var(--nav-fg);opacity:.7;padding:8px 10px;cursor:pointer;font-size:14px;position:relative;transition:opacity .2s,color .2s;white-space:nowrap;border-radius:3px}
.nav button.link:hover{opacity:1;color:var(--accent);background:rgba(217,74,74,.06)}
.nav button.link[aria-current="page"]{opacity:1;color:var(--accent)}
.nav button.link[aria-current="page"]::after{content:"";position:absolute;left:10px;right:10px;bottom:2px;height:2px;background:var(--accent);border-radius:2px}
.nav .who{margin-left:auto;color:var(--nav-fg);opacity:.8;font-family:var(--font-mono);font-size:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav .who b{color:var(--accent);opacity:1}
.nav .who button{margin-left:4px;background:none;border:1px solid var(--nav-line);color:var(--nav-fg);padding:4px 10px;border-radius:3px;cursor:pointer;font-size:12px;transition:background .2s,color .2s,border-color .2s}
.nav .who button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.lang{display:inline-flex;border:1px solid var(--nav-line);border-radius:3px;overflow:hidden;margin-left:6px}
.lang button{background:none;border:0;color:var(--nav-fg);padding:4px 8px;font-size:11px;font-family:var(--font-mono);cursor:pointer;opacity:.6;transition:background .2s,opacity .2s,color .2s}
.lang button:hover{opacity:1;color:var(--accent)}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff;opacity:1}

.wrap{max-width:1100px;margin-inline:auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;font-weight:500;letter-spacing:-.01em}
h2{font-size:18px;position:relative;padding-left:10px}
h2::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:2px;background:var(--accent);border-radius:2px}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

.hero{padding:18px 0 4px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line);padding-bottom:14px}
.hero h1{font-size:26px;letter-spacing:-.02em;font-weight:600}
.hero .sub{color:var(--muted);font-size:14px;font-family:var(--font-mono)}

.stats{border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:hidden;animation:fadeUp .35s ease both}
.stats .grid{display:grid;grid-template-columns:repeat(4,1fr)}
.stats .cell{padding:12px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.stats .cell:last-child{border-right:0}
.stats .cell .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stats .cell .v{font-size:20px;font-weight:600;font-family:var(--font-mono)}
@media (max-width:700px){
  .stats .grid{grid-template-columns:repeat(2,1fr)}
  .stats .cell:nth-child(2){border-right:0}
  .stats .cell:nth-child(1),.stats .cell:nth-child(2){border-bottom:1px solid var(--line)}
}

.search{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.search .cap{font-weight:500;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.modes{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.modes label{display:flex;align-items:center;gap:6px;cursor:pointer}
.modes input{accent-color:var(--accent)}
.sf{display:flex;gap:8px;width:100%;max-width:520px}
.sf input[type=search]{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);padding:9px 12px;border-radius:3px;transition:border-color .2s}
.sf input[type=search]:focus{border-color:var(--accent);outline:none}
.sf input::placeholder{color:var(--muted)}
.btn{background:var(--surface-2);border:1px solid var(--line);padding:8px 14px;border-radius:3px;cursor:pointer;transition:background .15s,border-color .15s,color .15s;display:inline-flex;align-items:center;text-decoration:none;font-size:14px;line-height:1.2}
.btn:hover{border-color:var(--line-2);background:#232329}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg);font-weight:500}
.btn.primary:hover{background:#d0483a;border-color:#d0483a;color:#fff}
.btn.danger{background:transparent;color:#e05a5a;border-color:#5a2020}
.btn.danger:hover{background:#3a1414;border-color:#8a2a2a}
.btn.small{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.count{font-size:13px;color:var(--muted);font-family:var(--font-mono)}

.pager{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.pager button{background:none;border:0;border-right:1px solid var(--line);padding:5px 12px;min-width:34px;cursor:pointer;font-size:13px;transition:background .15s,color .15s;color:var(--fg)}
.pager button:last-child{border-right:0}
.pager button:hover{background:var(--surface-2);color:var(--accent)}
.pager button[aria-current="true"]{background:var(--accent);color:#fff}
.pager button:disabled{opacity:.35;cursor:default}

.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:4px;animation:fadeUp .35s ease both;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:0}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
thead th{font-weight:600;background:var(--surface-2);font-size:12px;white-space:nowrap;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
tbody tr{background:var(--surface);transition:background .15s}
tbody tr:nth-child(even){background:var(--bg)}
tbody tr.pin{background:var(--pin)}
td.num,th.num{text-align:center;width:1%;white-space:nowrap}
td.date,th.date{text-align:right;white-space:nowrap;width:1%}
td.title{width:100%;min-width:0}
td.title .t{display:block;overflow-wrap:anywhere}
tr.row{cursor:pointer}
tr.row:hover{background:var(--surface-2)}
.rowbtn{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--fg);font-weight:500;transition:color .15s}
.rowbtn:hover{text-decoration:underline;color:var(--accent)}
.sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.board-tag{font-size:11px;color:var(--accent);border:1px solid var(--accent-dim);border-radius:2px;padding:0 5px;margin-right:6px;white-space:nowrap;font-family:var(--font-mono);text-transform:uppercase}
.empty{padding:32px 12px;text-align:center;color:var(--muted)}

.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}

.compose{border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px;animation:fadeUp .3s ease both}
.compose label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.compose input,.compose select,.compose textarea{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:8px 10px;color:var(--fg);width:100%;transition:border-color .2s}
.compose input:focus,.compose select:focus,.compose textarea:focus{border-color:var(--accent);outline:none}
.compose textarea{min-height:100px;resize:vertical;font-family:inherit}
.compose .row2{display:grid;grid-template-columns:1fr 200px;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:12px;color:var(--muted)}

.drop{border:1px dashed var(--line);border-radius:3px;padding:10px;background:var(--bg);display:flex;flex-direction:column;gap:8px;align-items:flex-start;transition:border-color .2s,background .2s}
.drop.dragover{border-color:var(--accent);background:rgba(217,74,74,.05)}
.drop .droprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.drop .thumb{width:64px;height:64px;border:1px solid var(--line);border-radius:3px;object-fit:cover;background:var(--surface-2)}
.drop .thumb-v{width:100px;height:64px;border:1px solid var(--line);border-radius:3px;object-fit:cover;background:#000}
.badge{font-size:11px;font-family:var(--font-mono);color:var(--muted);border:1px solid var(--line);border-radius:2px;padding:1px 6px}
.badge.warn{color:#e0a040;border-color:#5a4400}
.badge.err{color:#e05a5a;border-color:#5a2020}
.badge.ok{color:#6ad06a;border-color:#1f4a1f}
.progress{height:4px;width:100%;background:var(--surface-2);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0%;transition:width .2s}

.auth{max-width:400px;margin:0 auto;border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:12px;animation:pop .3s ease both}
.auth h2{font-size:18px;padding-left:10px}
.auth label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.auth input{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:9px 11px;color:var(--fg);width:100%;transition:border-color .2s}
.auth input:focus{border-color:var(--accent);outline:none}
.auth .switch{font-size:12px;color:var(--muted);text-align:center}
.auth .switch button{background:none;border:0;color:var(--link);cursor:pointer;text-decoration:underline;padding:0}
.auth .hintline{font-size:12px;color:var(--muted);line-height:1.4}
.err{color:#e05a5a;font-size:12px;min-height:16px}

.post{display:grid;grid-template-columns:140px minmax(0,1fr);border:1px solid var(--line);border-radius:4px;background:var(--surface);animation:fadeUp .3s ease both}
.post+.post{margin-top:8px}
.post .who{padding:12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--surface-2)}
.avatar{width:40px;height:40px;border:1px solid var(--line-2);color:var(--fg);display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:16px;text-transform:uppercase;overflow:hidden;cursor:pointer;border-radius:3px}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.post .name{font-weight:500;overflow-wrap:anywhere;display:flex;align-items:center;gap:2px;flex-wrap:wrap;font-size:14px}
.post .body{padding:12px 14px;min-width:0}
.post .meta{font-size:12px;color:var(--muted);margin-bottom:6px;font-family:var(--font-mono);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.post .text{white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 6px}
.post .attach{margin-top:6px}
.post .attach img{max-width:100%;max-height:480px;border:1px solid var(--line);border-radius:3px;display:block;cursor:zoom-in}
.post .attach video{max-width:100%;max-height:480px;border:1px solid var(--line);border-radius:3px;display:block;background:#000}
.post-actions{margin-left:auto;display:inline-flex;gap:4px;opacity:0;transition:opacity .2s}
.post:hover .post-actions{opacity:1}
.post-actions button{background:none;border:1px solid var(--line);color:var(--muted);width:24px;height:24px;border-radius:3px;cursor:pointer;display:grid;place-items:center;font-size:12px;padding:0;transition:color .15s,border-color .15s,background .15s}
.post-actions button:hover{color:var(--accent);border-color:var(--accent-dim);background:rgba(217,74,74,.06)}

.edit-row{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.edit-row textarea{background:var(--bg);border:1px solid var(--accent-dim);border-radius:3px;padding:8px 10px;color:var(--fg);width:100%;min-height:80px;resize:vertical;font-family:inherit}
.edit-row .actions{justify-content:flex-end}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:grid;place-items:center;z-index:50;animation:fadeIn .2s ease both;cursor:zoom-out}
.lightbox img,.lightbox video{max-width:92vw;max-height:92vh;border:1px solid var(--line-2);border-radius:3px}

.back{align-self:flex-start}
.titlebar{display:flex;flex-direction:column;gap:4px;animation:fadeUp .3s ease both}
.titlebar h1{font-size:22px;text-wrap:balance;overflow-wrap:anywhere;font-weight:600}

.page{border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:12px;animation:fadeUp .3s ease both}
.page h1{font-size:24px;letter-spacing:-.02em;font-weight:600}
.page .body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;font-size:15px}
.page .body:empty::before{content:attr(data-empty);color:var(--muted);font-style:italic}
.page .meta{font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.page .tools{display:flex;gap:8px;flex-wrap:wrap}
.page textarea{min-height:260px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:12px;color:var(--fg);font-family:var(--font-mono);font-size:13px}
.page input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:9px 11px;color:var(--fg);font-size:16px;font-weight:500;width:100%}
.page input[type=text]:focus,.page textarea:focus{border-color:var(--accent);outline:none}

.footer{border-top:1px solid var(--nav-line);padding:18px 16px;text-align:center;color:var(--muted);font-family:var(--font-mono);font-size:12px;background:var(--nav-bg)}
.footer b{color:var(--accent);font-weight:600}
.footer .sep{opacity:.4;margin:0 8px}

.chatbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chatform{border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;animation:fadeUp .3s ease both}
.chatform input{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:9px 11px;color:var(--fg);width:100%}
.chatform input:focus{border-color:var(--accent);outline:none}
.chatwin{border:1px solid var(--line);border-radius:4px;background:var(--surface);min-height:320px;max-height:65vh;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;animation:fadeUp .3s ease both}
.chatmsg{display:grid;grid-template-columns:36px minmax(0,1fr);gap:8px;animation:fadeIn .2s ease both}
.chatmsg .av{width:36px;height:36px;border:1px solid var(--line-2);color:var(--fg);display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:14px;text-transform:uppercase;overflow:hidden;cursor:pointer;border-radius:3px}
.chatmsg .av img{width:100%;height:100%;object-fit:cover;display:block}
.chatmsg .bub{background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:8px 10px;min-width:0}
.chatmsg.self .bub{border-color:var(--accent-dim)}
.chatmsg .top{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:4px;flex-wrap:wrap}
.chatmsg .top .name{font-weight:500;overflow-wrap:anywhere}
.chatmsg .top .time{color:var(--muted);font-family:var(--font-mono);font-size:11px;margin-left:auto;white-space:nowrap}
.chatmsg .txt{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font-size:14px}
.chatmsg .attach{margin-top:6px}
.chatmsg .attach img,.chatmsg .attach video{max-width:100%;max-height:340px;border:1px solid var(--line);border-radius:3px;display:block}
.chatmsg .attach img{cursor:zoom-in}
.chat-empty{color:var(--muted);text-align:center;padding:32px 12px}
.chat-hint{font-size:12px;color:var(--muted);text-align:center}
@media (max-width:700px){
  .chatform{grid-template-columns:1fr}
  .chatwin{max-height:60vh;padding:8px}
}

.profile-head{border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:hidden;animation:fadeUp .3s ease both;position:relative}
.profile-banner{height:140px;background:linear-gradient(135deg,#1a1a20,#2a1a1a);position:relative;overflow:hidden;background-size:cover;background-position:center}
.profile-banner img{width:100%;height:100%;object-fit:cover;display:block}
.profile-head-inner{display:flex;align-items:flex-end;gap:16px;padding:0 20px 18px;margin-top:-40px;position:relative}
.profile-avatar{width:90px;height:90px;border:3px solid var(--surface);border-radius:50%;display:grid;place-items:center;overflow:hidden;background:var(--surface-2);font-family:var(--font-mono);font-weight:600;font-size:32px;color:var(--accent);text-transform:uppercase;flex:none}
.profile-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.profile-info{display:flex;flex-direction:column;gap:4px;min-width:0;padding-bottom:4px}
.profile-name{font-size:22px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;overflow-wrap:anywhere}
.profile-meta{font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.profile-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

.nick-wrap{display:inline-flex;align-items:center;flex-wrap:wrap;gap:2px}
.nick-glow{position:relative;display:inline-flex;align-items:center;gap:1px;font-weight:600;padding:0 2px}
.nick-glow.glow-red{color:#ff4d4d;text-shadow:0 0 5px rgba(255,77,77,.7)}
.nick-glow.glow-blue{color:#4d8cff;text-shadow:0 0 5px rgba(77,140,255,.7)}
.nick-glow.glow-green{color:#4dd07a;text-shadow:0 0 5px rgba(77,208,122,.7)}
.nick-glow.glow-purple{color:#b06bff;text-shadow:0 0 5px rgba(176,107,255,.7)}
.nick-glow.glow-gold{color:#f5b042;text-shadow:0 0 5px rgba(245,176,66,.7)}
.nick-glow.glow-pink{color:#ff6bb0;text-shadow:0 0 5px rgba(255,107,176,.7)}
.nick-glow.shimmer{background:linear-gradient(90deg,#e8e8ec,#d94a4a,#e8e8ec,#d94a4a,#e8e8ec);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 4s linear infinite}
.nick-emoji{display:inline-block;font-size:1.05em;line-height:1;margin-left:2px;animation:emojiPulse 3s ease-in-out infinite}
.nick-prefix{font-size:.85em;font-weight:600;opacity:.95;margin-right:2px}
.nick-prefix.prefix-admin{color:#e04a4a}
.nick-prefix.prefix-moderator{color:#b06bff}
.nick-prefix.prefix-owner{color:#f5b042}
.nick-prefix.prefix-custom{color:inherit}
.nick-media{display:inline-block;width:18px;height:18px;border-radius:3px;object-fit:cover;vertical-align:-3px;margin-right:3px;border:1px solid var(--line);cursor:pointer;transition:transform .2s}
.nick-media:hover{transform:scale(1.4);border-color:var(--accent);z-index:2;position:relative}
.nick-media-video{position:relative;display:inline-block;vertical-align:-3px;margin-right:3px}
.nick-media-video video{width:24px;height:18px;border-radius:3px;border:1px solid var(--line);object-fit:cover}

const FORBIDDEN_PREFIX_WORDS=[
  'admin','administrator','админ','администратор',
  'mod','moder','moderator','мод','модер','модератор',
  'owner','владелец','влад','хозяин',

function isForbiddenPrefix(v){
  if(!v) return false;
  let s=String(v).toLowerCase();
  s=s.replace(/[^a-zа-яё0-9]/gi,'');
  const map={'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'c','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
  s=s.split('').map(c=>map[c]||c).join('');
  const sNoDigits=s.replace(/[0-9]/g,'');
  for(const w of FORBIDDEN_PREFIX_WORDS){ if(s.includes(w)||sNoDigits.includes(w)) return true; }
  const l33t=s.replace(/4/g,'a').replace(/3/g,'e').replace(/1/g,'i').replace(/0/g,'o');
  for(const w of FORBIDDEN_PREFIX_WORDS){ if(l33t.includes(w)) return true; }
  const compact=s.replace(/[^a-z]/g,'');
  for(const w of ['adm','mod','own','root']){ if(compact.startsWith(w)) return true; }
  return false;
}

    if(k==='class') e.className=attrs[k];
    else if(k==='text') e.textContent=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.indexOf('on')===0) e.addEventListener(k.slice(2),attrs[k]);
    else if(k==='disabled'){ if(attrs[k]) e.setAttribute('disabled',''); }

/* ============================================================
   АВТОРИЗАЦИЯ (Firebase Auth)
   ============================================================
   Правила:
   1. Пароль вводится как есть (без суффиксов).
   2. Email = nickToKey(nick) + '@60tdel.local' — это "виртуальный" email
      для Firebase Auth, чтобы использовать ник вместо email.
   3. Если юзер есть в базе, но не в Firebase Auth (старый аккаунт) —
      при входе код создаст его в Firebase Auth автоматически.
      Это работает для владельцев, админов, модераторов и всех остальных.
   ============================================================ */

const AUTH_DOMAIN='@60tdel.local';

function authErr(ex){
  const c=String((ex&&ex.code)||'');
  if(c.includes('wrong-password')||c.includes('invalid-credential')) return new Error(t('errWrongPass'));
  if(c.includes('user-not-found')) return new Error(t('errUserNotFound'));
  if(c.includes('email-already-in-use')) return new Error(t('errNickTaken'));
  if(c.includes('weak-password')) return new Error(t('errPassShort'));
  if(c.includes('too-many-requests')) return new Error('Слишком много попыток, попробуйте через 15 минут');
  if(c.includes('operation-not-allowed')) return new Error('Включите Email/Password в Firebase Console');
  if(c.includes('network-request-failed')) return new Error('Проверьте интернет');
  return ex;
}

async function findUserRecord(nick){
  const raw=String(nick||'').trim();
  if(!raw) return {key:null,rec:null};
  const variants=new Set([raw,raw.toLowerCase(),nickToKey(raw)]);
  for(const v of variants){
    if(!v||!isSafeKey(v)) continue;
    try{ const r=await fbGet('users/'+v); if(r) return {key:v,rec:r}; }catch(e){}
  }
  try{
    const all=await fbGet('users');
    if(all&&typeof all==='object'){
      const wanted=raw.toLowerCase();
      for(const k of Object.keys(all)){
        const u=all[k]; if(!u) continue;
        const un=String(u.nick||'').toLowerCase();
        if(k.toLowerCase()===wanted||un===wanted) return {key:k,rec:u};
      }
    }
  }catch(e){}
  return {key:nickToKey(raw),rec:null};
}

/* Пытается создать Firebase Auth аккаунт для юзера из базы, которого ещё нет в Auth */
async function tryMigrateToAuth(nick, key, email, pass){
  let rec=null;
  try{ rec=await fbGet('users/'+key); }catch(e){}
  if(!rec) return false;

  const recNick=rec.nick||nick;
  const isStaff=isOwner(recNick)||isOwner(key)
    || rec.owner===true
    || rec.role==='admin'
    || rec.role==='moderator';

  /* Для обычных юзеров — проверяем старый salt/hash, если он есть */
  if(!isStaff){
    if(!rec.salt||!rec.hash) return false;
    const check=await hashPass(pass,rec.salt);
    if(check!==rec.hash) return false;
  }

  /* Пытаемся создать аккаунт в Firebase Auth */
  try{
    await createUserWithEmailAndPassword(auth,email,pass);
  }catch(e2){
    const c2=String(e2.code||'');
    if(c2.includes('email-already-in-use')){
      /* Email уже есть в Auth с другим паролем — не мигрируем */
      return false;
    }
    throw authErr(e2);
  }

  /* Обновляем запись: убираем старый salt/hash, привязываем uid */
  try{ await fbUpdate('users/'+key,{uid:auth.currentUser.uid,salt:null,hash:null}); }catch(e){}
  return true;
}

async function register(nick,pass){
  nick=String(nick||'').trim();
  pass=String(pass||'');
  if(!NICK_RE.test(nick)) throw new Error(t('errNickFormat'));
  if(pass.length<6) throw new Error(t('errPassShort'));
  const key=nickToKey(nick);
  if(!isSafeKey(key)) throw new Error(t('errNickFormat'));
  if(OWNERS.includes(key)||OWNERS.includes(nick.toLowerCase())) throw new Error(t('errNickTaken'));

  const found=await findUserRecord(nick);

  /* Если ник есть в базе — возможно, это старый аккаунт без Firebase Auth */
  if(found.rec){
    const recNick=found.rec.nick||nick;
    const isStaff=found.rec.owner===true
      || found.rec.role==='admin'
      || found.rec.role==='moderator'
      || isOwner(recNick);
    if(isStaff){
      const ok=await tryMigrateToAuth(nick,key,authEmail(nick),pass);
      if(ok){
        let rec=null; try{ rec=await fbGet('users/'+key); }catch(e){}
        S.user={nick:(rec&&rec.nick)||nick,owner:true,role:(rec&&rec.role)||'user'};
        return;
      }
    }
    throw new Error(t('errNickTaken'));
  }

  /* Новый аккаунт */
  try{ await createUserWithEmailAndPassword(auth,authEmail(nick),pass); }
  catch(ex){ throw authErr(ex); }

  await fbSet('users/'+key,{
    nick,
    uid:auth.currentUser.uid,
    owner:false,
    role:'user',
    created:Date.now(),
    profile:{
      color:'', prefix:'', prefixColor:'',
      emojis:[], mediaUrl:'', avatar:'', banner:''
    }
  });
  S.user={nick,owner:false,role:'user'};
}

async function login(nick,pass){
  nick=String(nick||'').trim();
  pass=String(pass||'');
  if(!nick) throw new Error(t('errUserNotFound'));
  if(pass.length<6) throw new Error(t('errPassShort'));

  const key=nickToKey(nick);
  if(!isSafeKey(key)) throw new Error(t('errUserNotFound'));
  const email=authEmail(nick);

  try{
    await signInWithEmailAndPassword(auth,email,pass);
  }catch(ex){
    const c=String((ex&&ex.code)||'');
    if(c.includes('user-not-found')||c.includes('invalid-credential')||c.includes('invalid-login')){
      const migrated=await tryMigrateToAuth(nick,key,email,pass);
      if(!migrated) throw authErr(ex);
    } else {
      throw authErr(ex);
    }
  }

  let rec=null;
  try{ rec=await fbGet('users/'+key); }catch(e){}
  const realNick=(rec&&rec.nick)||nick;
  S.user={
    nick:realNick,
    owner:isOwner(realNick)||isOwner(key)||!!(rec&&rec.owner===true),
    role:(rec&&rec.role)||'user'
  };
}

function logout(){
  if(S.user) fbSet('online/'+String(S.user.nick).toLowerCase(),null).catch(()=>{});
  if(S._sessionId&&S.user) fbRemove('sessions/'+nickToKey(S.user.nick)+'/'+S._sessionId).catch(()=>{});
  S.user=null; storeRemove('f60_user');
  signOut(auth).catch(()=>{}); render();
}

async function restoreFromAuth(u){
  if(S._busy) return;
  if(!u||!u.email||!u.email.endsWith(AUTH_DOMAIN)){
    if(S.user){ S.user=null; render(); }
    return;
  }
  const key=u.email.slice(0,-AUTH_DOMAIN.length);
  let rec=null; try{ rec=await fbGet('users/'+key); }catch(e){}
  if(S._busy) return;
  const realNick=(rec&&rec.nick)||key;
  S.user={
    nick:realNick,
    owner:isOwner(realNick)||isOwner(key)||!!(rec&&rec.owner===true),
    role:(rec&&rec.role)||'user'
  };
  render();
  heartbeat();
  registerSession();
}

async function heartbeat(){
  if(!S.user) return;
  const key=String(S.user.nick||'').toLowerCase();
  if(!isSafeKey(key)) return;
  try{ await fbSet('online/'+key,{nick:S.user.nick,ts:Date.now()}); }catch(e){}
  if(S._sessionId){
    try{ await fbUpdate('sessions/'+nickToKey(S.user.nick)+'/'+S._sessionId,{ts:Date.now()}); }catch(e){}
  }
}
setInterval(heartbeat,25000);
window.addEventListener('beforeunload',()=>{

/* Сессии */
function deviceInfo(){
  const ua=navigator.userAgent||'';
  let os='Unknown', br='Unknown';
  if(/Windows/i.test(ua)) os='Windows';
  else if(/Mac OS X/i.test(ua)) os='macOS';
  else if(/Android/i.test(ua)) os='Android';
  else if(/iPhone|iPad|iPod/i.test(ua)) os='iOS';
  else if(/Linux/i.test(ua)) os='Linux';
  if(/Edg\//i.test(ua)) br='Edge';
  else if(/Chrome\//i.test(ua)) br='Chrome';
  else if(/Firefox\//i.test(ua)) br='Firefox';
  else if(/Safari\//i.test(ua)) br='Safari';
  return os+' · '+br;
}
async function registerSession(){
  if(!S.user) return;
  const key=nickToKey(S.user.nick);
  S._sessionId=safeRandomId('s');
  try{
    await fbSet('sessions/'+key+'/'+S._sessionId,{
      device:deviceInfo(), ua:navigator.userAgent||'', ts:Date.now(), created:Date.now()
    });
  }catch(e){}
}
async function killSession(sid){
  if(!S.user||!sid) return;
  const key=nickToKey(S.user.nick);
  try{ await fbRemove('sessions/'+key+'/'+sid); if(sid===S._sessionId){ await signOut(auth); S.user=null; render(); } }catch(e){}
}
async function killAllOtherSessions(){
  if(!S.user) return;
  const key=nickToKey(S.user.nick);
  const all=S.sessions[key]||{};
  for(const sid of Object.keys(all)){
    if(sid!==S._sessionId){ try{ await fbRemove('sessions/'+key+'/'+sid); }catch(e){} }
  }
}

/* Медиа */
function compressImage(file,maxSide,maxBytes){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        const scale=Math.min(1,maxSide/Math.max(w,h));
        w=Math.round(w*scale); h=Math.round(h*scale);
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        let q=0.85,url=c.toDataURL('image/jpeg',q);
        while(url.length*0.75>maxBytes&&q>0.3){ q-=0.08; url=c.toDataURL('image/jpeg',q); }
        if(url.length*0.75>maxBytes){ reject(new Error(t('photoFail')+fmtBytes(maxBytes))); return; }
        resolve(url);
      };
      img.onerror=()=>reject(new Error(t('notImage')));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error(t('fileReadFail')));
    reader.readAsDataURL(file);
  });
}
function videoDuration(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const v=document.createElement('video');
    v.preload='metadata';
    v.onloadedmetadata=()=>{ URL.revokeObjectURL(url); resolve(v.duration); };
    v.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error(t('videoReadFail'))); };
    v.src=url;
  });
}
async function reencodeVideo(file,targetBytes,onProgress){
  const url=URL.createObjectURL(file);
  const v=document.createElement('video');
  v.src=url; v.muted=true; v.playsInline=true; v.preload='auto';
  await new Promise((res,rej)=>{ v.onloadedmetadata=()=>res(); v.onerror=()=>rej(new Error(t('videoReadFail'))); });
  const dur=v.duration;
  const scale=Math.min(1,480/Math.max(v.videoWidth,v.videoHeight));
  const w=Math.max(2,Math.round(v.videoWidth*scale));
  const h=Math.max(2,Math.round(v.videoHeight*scale));
  const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
  const ctx=canvas.getContext('2d');
  const stream=canvas.captureStream(24);
  const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp8')?'video/webm;codecs=vp8':(MediaRecorder.isTypeSupported('video/webm')?'video/webm':'');
  if(!mime){ URL.revokeObjectURL(url); throw new Error(t('videoNoRecorder')); }
  const chunks=[];
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:700000});
  rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  const done=new Promise(res=>{ rec.onstop=()=>res(); });
  rec.start(200);
  v.currentTime=0;
  try{ await v.play(); }catch(e){}
  let raf;
  const draw=()=>{ if(v.paused||v.ended) return; ctx.drawImage(v,0,0,w,h); if(onProgress) onProgress(Math.min(1,v.currentTime/dur)); raf=requestAnimationFrame(draw); };
  raf=requestAnimationFrame(draw);
  await new Promise(res=>{ const stop=()=>{ cancelAnimationFrame(raf); res(); }; v.onended=stop; setTimeout(stop,(dur+0.5)*1000); });
  rec.stop(); await done; URL.revokeObjectURL(url);
  const blob=new Blob(chunks,{type:'video/webm'});
  if(blob.size>targetBytes) throw new Error(t('videoTooBig')+fmtBytes(blob.size));
  const reader=new FileReader();
  return await new Promise((res,rej)=>{ reader.onload=()=>res(reader.result); reader.onerror=()=>rej(new Error(t('fileReadFail'))); reader.readAsDataURL(blob); });
}
function readAsDataURL(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error(t('fileReadFail'))); r.readAsDataURL(file); });
}
function packMedia(a){
  const p={};
  if(a.imageData){ p.media=a.imageData; p.mediaType='image'; }
  else if(a.videoData){ p.media=a.videoData; p.mediaType='video'; }
  if(a.linkUrl) p.link=a.linkUrl;
  return p;
}

async function publishThread({board,title,text,att}){
  if(!S.user){ S.view='auth'; S.authMode='login'; render(); return; }
  const id=safeRandomId('t');
  const now=Date.now();
  const post=Object.assign({author:S.user.nick,text,date:now},packMedia(att));
  await fbSet('threads/'+safePathKey(id),{board,title,author:S.user.nick,uid:myUid(),date:now,views:0,pin:false,posts:{p0:post}});
  S.compose=false; S.board=null; S.q=''; S.page=1; S.view='list'; S.open=id;
  render(); window.scrollTo(0,0);
}
async function replyThread(threadId,text,att){
  if(!S.user){ S.view='auth'; S.authMode='login'; render(); return; }
  if(!isSafeKey(threadId)) throw new Error(t('errGeneric'));
  const now=Date.now();
  const post=Object.assign({author:S.user.nick,text,date:now},packMedia(att));
  const th=S.threads.find(x=>x.id===threadId);
  const count=th&&th.posts?Object.keys(th.posts).length:0;
  await fbSet(`threads/${threadId}/posts/p${count}`,post);
  render();
}

  const v=(th.views||0)+1;

  await fbUpdate(`threads/${id}`,{views:v});
}

  if(!S.user) throw new Error(t('needLoginToSend'));
  const th=S.threads.find(x=>x.id===threadId);
  if(!th) throw new Error(t('topicNotFound'));
  const p=th.posts&&th.posts[postKey];
  if(!p) throw new Error(t('errGeneric'));
  const isAuthor=p.author===S.user.nick;
  const isStaff=isOwner(S.user.nick)||isAdmin(S.user.nick)||isModerator(S.user.nick);

  await fbUpdate(`threads/${threadId}/posts/${postKey}`,{text,edited:Date.now(),editedBy:S.user.nick});
  render();

async function savePage(id,title,body){
  if(!canEdit()) throw new Error(t('onlyOwners'));
  const payload={id,title:title||'',body:body||'',updated:Date.now(),author:S.user?S.user.nick:'—'};
  await fbSet('pages/'+safePathKey(id),payload);
  S.pages[id]=payload;
  S.pageEdit=null;
  render();
}
function pageView(){
  const meta=PAGES.find(p=>p.id===S.view);
  if(!meta) return [el('div',{class:'empty',text:'—'})];
  if(meta.id==='privilege') return [privilegePage()];
  const rec=S.pages[meta.id]||null;
  const editing=S.pageEdit===meta.id&&canEdit();
  const title=(rec&&rec.title)||pageLabel(meta);
  const body=(rec&&rec.body)||'';
  const out=[];
  if(editing){
    const tInput=el('input',{type:'text',value:title,maxlength:'80',id:'page-edit-title'});
    const bArea=el('textarea',{value:body,placeholder:t('editBody'),id:'page-edit-body'});
    const errBox=el('div',{class:'err'});
    const saveBtn=el('button',{class:'btn primary',type:'button'},[icon('save'),t('save')]);
    saveBtn.addEventListener('click',async()=>{ saveBtn.disabled=true; try{ await savePage(meta.id,tInput.value.trim(),bArea.value); }catch(ex){ errBox.textContent=ex.message||t('errGeneric'); } finally{ saveBtn.disabled=false; } });
    const cancelBtn=el('button',{class:'btn',type:'button',text:t('cancel'),onclick:()=>{S.pageEdit=null;render();}});
    out.push(el('section',{class:'page'},[
      el('h1',{text:pageLabel(meta)}),
      el('div',{class:'tools'},[el('label',{style:'flex:1'},[t('editTitle'),tInput])]),
      el('label',null,[t('editBody'),bArea]),
      errBox,
      el('div',{class:'actions'},[saveBtn,cancelBtn])
    ]));
    return out;
  }
  out.push(el('section',{class:'page'},[
    el('h1',{text:title}),
    el('div',{class:'body','data-empty':t('pageEmpty'),text:body}),
    rec?el('div',{class:'meta',text:t('lastEdited')+' '+fmt(rec.updated)+' · '+t('by')+' '+(rec.author||'—')}):null,
    canEdit()?el('div',{class:'tools'},[el('button',{class:'btn',type:'button',onclick:()=>{S.pageEdit=meta.id;render();}},[icon('edit'),t('edit')])]):el('div',{class:'meta',text:t('onlyOwners')})

  return out;
}

  pasteBtn.addEventListener('click',async()=>{
    if(!(navigator.clipboard&&navigator.clipboard.read)){ setInfo(t('clipboardDenied'),'warn'); return; }
    try{ const items=await navigator.clipboard.read(); for(const it of items){ const t2=it.types.find(x=>x.startsWith('image/')); if(t2){ const blob=await it.getType(t2); handleImage(new File([blob],'paste.png',{type:t2})); return; } } setInfo(t('clipboardEmpty'),'warn'); }catch(e){ setInfo(t('clipboardDenied'),'warn'); }
  });
  const clearBtn=el('button',{type:'button',class:'btn small'},[icon('trash'),t('clear')]);
  clearBtn.addEventListener('click',()=>{ state.imageData=null; state.videoData=null; state.linkUrl=''; imgInput.value=''; vidInput.value=''; linkInput.value=''; renderPreview(); setInfo(t('cleared'),''); progWrap.style.display='none'; });
  const linkInput=el('input',{type:'url',placeholder:t('linkPlaceholder')});
  linkInput.addEventListener('input',()=>{ state.linkUrl=linkInput.value.trim(); renderPreview(); });
  wrap.appendChild(el('div',{class:'droprow'},[imgBtn,vidBtn,pasteBtn,clearBtn]));
  wrap.appendChild(linkInput);
  wrap.appendChild(progWrap);
  wrap.appendChild(info);
  wrap.appendChild(preview);
  wrap.appendChild(imgInput); wrap.appendChild(vidInput);
  ['dragenter','dragover'].forEach(ev=>wrap.addEventListener(ev,e=>{e.preventDefault();wrap.classList.add('dragover');}));
  ['dragleave','drop'].forEach(ev=>wrap.addEventListener(ev,e=>{e.preventDefault();wrap.classList.remove('dragover');}));
  wrap.addEventListener('drop',e=>{ const f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(!f) return; if(f.type.startsWith('video/')) handleVideo(f); else if(f.type.startsWith('image/')) handleImage(f); });
  function setInfo(text,kind){ info.textContent=text; info.className='badge'+(kind==='err'?' err':kind==='warn'?' warn':kind==='ok'?' ok':''); }
  async function handleImage(file){ setInfo(t('photoCompressing'),''); try{ const dataUrl=await compressImage(file,IMG_MAX_SIDE,IMG_MAX_BYTES); state.imageData=dataUrl; state.videoData=null; renderPreview(); setInfo(t('photoDone')+fmtBytes(dataUrl.length*0.75),'ok'); }catch(ex){ setInfo(ex.message,'err'); } }
  async function handleVideo(file){
    progWrap.style.display=''; progWrap.firstChild.style.width='0%'; setInfo(t('videoChecking'),'');
    try{
      const dur=await videoDuration(file);
      if(!isFinite(dur)||dur>VIDEO_MAX_SEC+0.3){ setInfo(t('videoTooLong')+dur.toFixed(1)+t('videoTooLongTail'),'err'); progWrap.style.display='none'; return; }
      if(file.size<=VIDEO_MAX_BYTES){ const dataUrl=await readAsDataURL(file); if(dataUrl.length*0.75>8*1024*1024){ setInfo(t('videoToBaseTooBig'),'err'); progWrap.style.display='none'; return; } state.videoData=dataUrl; state.imageData=null; renderPreview(); setInfo(t('videoDone')+fmtBytes(dataUrl.length*0.75),'ok'); progWrap.style.display='none'; return; }
      setInfo(t('videoReencoding'),'');
      const dataUrl=await reencodeVideo(file,VIDEO_TARGET,p=>{ progWrap.firstChild.style.width=Math.round(p*100)+'%'; });
      state.videoData=dataUrl; state.imageData=null; renderPreview(); setInfo(t('videoReencDone')+fmtBytes(dataUrl.length*0.75),'ok'); progWrap.style.display='none';
    }catch(ex){ setInfo(ex.message,'err'); progWrap.style.display='none'; }
  }
  function renderPreview(){
    preview.replaceChildren();
    if(state.imageData) preview.appendChild(el('img',{class:'thumb',src:state.imageData,alt:''}));
    if(state.videoData) preview.appendChild(el('video',{class:'thumb-v',src:state.videoData,controls:'',preload:'metadata'}));
    const safeLink=safeMediaUrl(state.linkUrl);
    if(safeLink){ const isV=/\.(mp4|webm|ogg|mov)(\?|$)/i.test(safeLink); preview.appendChild(isV?el('video',{class:'thumb-v',src:safeLink,controls:'',preload:'metadata'}):el('img',{class:'thumb',src:safeLink,alt:''})); }
  }
  wrap.getData=()=>({imageData:state.imageData,videoData:state.videoData,linkUrl:safeMediaUrl(state.linkUrl)});
  return wrap;
}

function computeStats(){
  let posts=0,threads=0,bytes=0;
  S.threads.forEach(th=>{ threads++; const ps=th.posts?Object.values(th.posts):[]; posts+=ps.length; ps.forEach(p=>{ if(p.media) bytes+=Math.round((p.media.length||0)*0.75); if(p.link) bytes+=p.link.length; }); });
  Object.values(S.chats||{}).forEach(c=>{ const ms=c.messages?Object.values(c.messages):[]; posts+=ms.length; ms.forEach(p=>{ if(p.media) bytes+=Math.round((p.media.length||0)*0.75); if(p.link) bytes+=p.link.length; }); });
  const users=Object.keys(S.users||{}).length;
  const now=Date.now();
  const online=Object.values(S.online||{}).filter(o=>o&&o.ts&&(now-o.ts)<90000).length;
  S.stats={posts,threads,bytes,users,online};
}

const VERIFIED={m4lm0v:'red',crollow:'green',himical:'white'};
const VB_SVG='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4"/></svg>';
function verifiedBadge(name){
  const kind=VERIFIED[(name||'').toLowerCase()];
  if(!kind) return null;
  const s=document.createElement('span');
  s.className='v-badge '+kind;
  s.setAttribute('role','img');
  s.setAttribute('aria-label','Verified');
  s.title='Verified';
  s.innerHTML=VB_SVG;
  return s;
}
function setBusy(btn,label){ btn.replaceChildren(el('span',{class:'spinner'}),document.createTextNode(label)); }
function safeMediaUrl(u){ if(!u) return ''; const s=String(u).trim(); if(/^(javascript|vbscript|data:text\/html|data:application)/i.test(s)) return ''; return /^(https?:|blob:|data:(image|video)\/)/i.test(s)?s:''; }
function safeColor(v){ if(!v) return ''; const s=String(v).trim(); if(/^#[0-9a-fA-F]{3,8}$/.test(s)) return s; if(/^[a-zA-Z]+$/.test(s)) return s; return ''; }
function storeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function storeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function storeRemove(k){ try{ localStorage.removeItem(k); }catch(e){} }

function userRecord(nick){
  if(!nick||!S.users) return null;
  const k1=nickToKey(nick);
  const k2=String(nick).toLowerCase();
  return S.users[k1]||S.users[k2]||null;
}
function isAdmin(nick){
  if(isOwner(nick)) return true;
  const r=userRecord(nick);
  return !!(r&&(r.role==='admin'||r.owner===true));
}
function isModerator(nick){
  const r=userRecord(nick);
  return !!(r&&r.role==='moderator');
}
function isPremium(nick){
  const r=userRecord(nick);
  return !!(r&&r.premium===true);
}
function hasPrivilege(nick){ return isAdmin(nick)||isPremium(nick); }
function canSetPrefix(nick){ return isAdmin(nick)||isOwner(nick); }

function nickDisplay(name,opts){
  opts=opts||{};
  const rec=userRecord(name);
  const prof=(rec&&rec.profile)||{};
  const colorCls=(COLORS.find(c=>c.id===prof.color)||{}).cls||'';
  let prefixLabel=prof.prefix||'';
  let prefixCls='prefix-custom';
  if(!prefixLabel){
    if(isOwner(name)){ prefixLabel='OWNER'; prefixCls='prefix-owner'; }
    else if(isAdmin(name)){ prefixLabel='ADMIN'; prefixCls='prefix-admin'; }
    else if(isModerator(name)){ prefixLabel='MOD'; prefixCls='prefix-moderator'; }
  } else {
    if(isOwner(name)) prefixCls='prefix-owner';
    else if(isAdmin(name)) prefixCls='prefix-admin';
    else if(isModerator(name)) prefixCls='prefix-moderator';
  }
  const emojis=Array.isArray(prof.emojis)?prof.emojis.slice(0,1):[];
  const mediaUrl=safeMediaUrl(prof.mediaUrl);
  const wrap=document.createElement('span');
  wrap.className='nick-wrap';
  if(opts.clickable&&S.user){
    wrap.style.cursor='pointer';
    wrap.addEventListener('click',e=>{ e.stopPropagation(); S.profileUser=name; S.profileEdit=false; S.profileTab='profile'; S.view='profile'; render(); window.scrollTo(0,0); });
  }
  if(mediaUrl){
    const isVid=/\.(mp4|webm|ogg|mov)(\?|$)/i.test(mediaUrl)||/^data:video\//i.test(mediaUrl);
    if(isVid){
      const v=el('span',{class:'nick-media-video'});
      v.appendChild(el('video',{class:'nick-media',src:mediaUrl,autoplay:'',loop:'',muted:'',playsinline:'',preload:'auto'}));
      wrap.appendChild(v);
    } else {
      const img=el('img',{class:'nick-media',src:mediaUrl,alt:''});
      img.addEventListener('click',()=>openLightbox(el('img',{src:mediaUrl,alt:''})));
      wrap.appendChild(img);
    }
  }
  const vb=verifiedBadge(name);
  if(vb) wrap.appendChild(vb);
  const nickEl=document.createElement('span');
  nickEl.className='nick-glow '+colorCls;
  if(prefixLabel){
    const pref=document.createElement('span');
    pref.className='nick-prefix '+prefixCls;
    const pc=safeColor(prof.prefixColor);
    if(pc) pref.style.color=pc;
    pref.textContent='['+prefixLabel+']';
    nickEl.appendChild(pref);
  }
  nickEl.appendChild(document.createTextNode(name));
  emojis.forEach(em=>{ const s=document.createElement('span'); s.className='nick-emoji'; s.textContent=em; nickEl.appendChild(s); });
  wrap.appendChild(nickEl);
  return wrap;
}
function authorCell(name){ const td=el('td'); td.appendChild(nickDisplay(name,{clickable:true})); return td; }
function avatarFor(name,size){
  const rec=userRecord(name);
  const prof=(rec&&rec.profile)||{};
  const avatar=safeMediaUrl(prof.avatar);
  const box=document.createElement('div');
  box.className='avatar';
  if(size){ box.style.width=size+'px'; box.style.height=size+'px'; box.style.fontSize=Math.round(size*0.4)+'px'; }
  if(avatar) box.appendChild(el('img',{src:avatar,alt:''}));
  else box.textContent=String(name||'?').charAt(0);
  return box;
}

function profileView(){
  if(!S.user) return [el('section',{class:'auth anim-pop'},[
    el('h2',{text:t('profile')}),
    el('div',{class:'hintline',text:t('notLoggedIn')}),
    el('div',{class:'actions'},[el('button',{class:'btn primary',type:'button',text:t('signIn'),onclick:()=>{S.view='auth';S.authMode='login';render();}})])
  ])];
  const targetName=S.profileUser||S.user.nick;
  const isMe=targetName===S.user.nick;
  const rec=userRecord(targetName)||{};
  const prof=rec.profile||{};
  const created=rec.created?fmt(rec.created):'—';
  let postsCount=0,topicsCount=0;
  S.threads.forEach(th=>{ if(th.author===targetName) topicsCount++; const ps=th.posts?Object.values(th.posts):[]; ps.forEach(p=>{ if(p.author===targetName) postsCount++; }); });
  Object.values(S.chats||{}).forEach(c=>{ const ms=c.messages?Object.values(c.messages):[]; ms.forEach(m=>{ if(m.author===targetName) postsCount++; }); });
  const out=[];

  if(bannerUrl) banner.appendChild(el('img',{src:bannerUrl,alt:''}));
  const avatarBox=el('div',{class:'profile-avatar'});
  const avatar=safeMediaUrl(prof.avatar);
  if(avatar) avatarBox.appendChild(el('img',{src:avatar,alt:''}));
  else avatarBox.textContent=String(targetName).charAt(0);
  out.push(el('div',{class:'profile-head anim-fadeup'},[
    banner,
    el('div',{class:'profile-head-inner'},[
      avatarBox,
      el('div',{class:'profile-info'},[
        el('div',{class:'profile-name'},[nickDisplay(targetName)]),
        el('div',{class:'profile-meta',text:t('memberSince')+': '+created}),
        el('div',{class:'profile-tags'},[
          el('span',{class:'badge',text:t('topicsCount')+': '+topicsCount}),
          el('span',{class:'badge',text:t('postsCount')+': '+postsCount}),
          isPremium(targetName)?el('span',{class:'sub-badge'},[icon('crown'),t('premium')]):null
        ].filter(Boolean))
      ])
    ])
  ]));
  if(isMe){
    const tabs=el('div',{class:'tabs'},[
      el('button',{type:'button','aria-selected':S.profileTab==='profile'?'true':'false',text:t('tabProfile'),onclick:()=>{S.profileTab='profile';render();}}),
      el('button',{type:'button','aria-selected':S.profileTab==='account'?'true':'false',text:t('tabAccount'),onclick:()=>{S.profileTab='account';render();}}),
      el('button',{type:'button','aria-selected':S.profileTab==='sessions'?'true':'false',text:t('tabSessions'),onclick:()=>{S.profileTab='sessions';render();}})
    ]);
    out.push(tabs);
    if(S.profileTab==='profile'){
      out.push(el('div',{class:'actions'},[
        el('button',{class:'btn primary',type:'button',onclick:()=>{
          S.profileEdit=!S.profileEdit;
          S.profileDraft={avatar:prof.avatar||'',banner:prof.banner||'',color:prof.color||'',prefix:prof.prefix||'',prefixColor:prof.prefixColor||'',emojis:Array.isArray(prof.emojis)?prof.emojis.slice(0,1):[],mediaUrl:prof.mediaUrl||''};
          render();
        }},[icon('edit'),S.profileEdit?t('cancel'):t('editProfile')])
      ]));
      if(S.profileEdit) out.push(profileEditor());
    } else if(S.profileTab==='account'){
      out.push(accountSettings());
    } else if(S.profileTab==='sessions'){
      out.push(sessionsView());
    }
  }
  return out;
}

function profileEditor(){
  const draft=S.profileDraft;
  const err=el('div',{class:'err'});
  const avPreview=el('div',{class:'avatar-preview'});
  function renderAvPreview(){ avPreview.replaceChildren(); if(draft.avatar) avPreview.appendChild(el('img',{src:draft.avatar,alt:''})); else avPreview.textContent=String(S.user.nick).charAt(0); }
  renderAvPreview();
  const fileInput=el('input',{type:'file',accept:'image/*',style:'display:none'});
  fileInput.addEventListener('change',async()=>{ if(!fileInput.files[0]) return; try{ const dataUrl=await compressImage(fileInput.files[0],AVATAR_MAX_SIDE,AVATAR_MAX_BYTES); draft.avatar=dataUrl; renderAvPreview(); err.textContent=''; }catch(ex){ err.textContent=ex.message||t('avatarTooBig'); } });

  const remBtn=el('button',{class:'btn small',type:'button',onclick:()=>{ draft.avatar=''; renderAvPreview(); }},[icon('trash'),t('removeAvatar')]);
  const uploadWrap=el('div',{class:'avatar-upload'},[avPreview,el('div',{class:'actions'},[upBtn,remBtn]),fileInput]);

  function renderBannerPreview(){ bannerPreview.replaceChildren(); if(draft.banner) bannerPreview.appendChild(el('img',{src:draft.banner,alt:'',style:'width:100%;height:100%;object-fit:cover'})); }
  renderBannerPreview();
  bannerInput.addEventListener('change',async()=>{ if(!bannerInput.files[0]) return; try{ const dataUrl=await compressImage(bannerInput.files[0],BANNER_MAX_SIDE,BANNER_MAX_BYTES); draft.banner=dataUrl; renderBannerPreview(); err.textContent=''; }catch(ex){ err.textContent=ex.message||t('avatarTooBig'); } });

    const opt=el('div',{class:'color-opt'+(draft.color===c.id?' selected':'')},[el('div',{class:'color-dot',style:'background:'+c.dot}),el('span',{text:S.lang==='en'?c.en:c.ru})]);
    opt.addEventListener('click',()=>{ if(!hasPrivilege(S.user.nick)&&c.id!==''){ err.textContent=t('needPremium'); return; } draft.color=c.id; err.textContent=''; render(); });
    colorGrid.appendChild(opt);

  prefixColorInput.addEventListener('input',()=>{ draft.prefixColor=prefixColorInput.value; renderPrefixPreview(); });
  const prefixPreview=el('div',{class:'nick-preview-box',style:'min-height:44px;font-size:16px'});
  function renderPrefixPreview(){
    prefixPreview.replaceChildren();
    const v=String(draft.prefix||'').trim();
    if(!v){ prefixPreview.appendChild(el('span',{class:'muted',style:'font-size:13px',text:t('prefixNone')})); }
    else {
      const isAdminUser=canSetPrefix(S.user.nick);
      const bad=!isAdminUser&&isForbiddenPrefix(v);
      const span=el('span',{class:'nick-prefix '+(bad?'':'prefix-custom'),text:'['+v+']'});
      if(bad) span.style.color='#e05a5a';
      else if(draft.prefixColor) span.style.color=safeColor(draft.prefixColor);
      prefixPreview.appendChild(span);
      prefixPreview.appendChild(document.createTextNode(' '));

    if(em){ const s=document.createElement('span'); s.className='nick-emoji'; s.textContent=em; nickEl.appendChild(s); }
    prefixPreview.appendChild(nickEl);

        avatar:draft.avatar||'',

        color:draft.color||'',
        prefix:draft.prefix||'',
        prefixColor:safeColor(draft.prefixColor)||'',

        mediaUrl:safeMediaUrl(draft.mediaUrl)||''

function filtered(){
  const q=S.q.trim().toLowerCase();
  return S.threads.filter(th=>{
    if(S.board&&th.board!==S.board) return false;
    if(!q) return true;
    if(S.mode==='title') return (th.title||'').toLowerCase().includes(q);
    const posts=th.posts?Object.values(th.posts):[];
    return posts.some(p=>(p.text||'').toLowerCase().includes(q));
  });
}

function mediaNode(p){
  const nodes=[];
  if(p.media){ if(p.mediaType==='video'){ nodes.push(el('video',{src:p.media,controls:'',preload:'metadata'})); } else { const img=el('img',{src:p.media,alt:'',loading:'lazy'}); img.addEventListener('click',()=>openLightbox(el('img',{src:p.media,alt:''}))); nodes.push(img); } }
  const safeLink=safeMediaUrl(p.link);
  if(safeLink){ const isV=/\.(mp4|webm|ogg|mov)(\?|$)/i.test(safeLink); if(isV){ nodes.push(el('video',{src:safeLink,controls:'',preload:'metadata'})); } else { const img=el('img',{src:safeLink,alt:'',loading:'lazy'}); img.addEventListener('click',()=>openLightbox(el('img',{src:safeLink,alt:''}))); nodes.push(img); } }
  return nodes.length?el('div',{class:'attach'},nodes):null;
}
function canEditPost(p){
  if(!S.user) return false;
  const isAuthor=p.author===S.user.nick;
  const isStaff=isOwner(S.user.nick)||isAdmin(S.user.nick)||isModerator(S.user.nick);
  const withinWindow=Date.now()-(p.date||0)<EDIT_WINDOW_MS;
  return (isAuthor&&withinWindow)||isStaff;
}
function canDeletePost(p,isFirst){
  if(!S.user) return false;
  const isAuthor=p.author===S.user.nick;
  const isStaff=isOwner(S.user.nick)||isAdmin(S.user.nick)||isModerator(S.user.nick);
  const withinWindow=Date.now()-(p.date||0)<EDIT_WINDOW_MS;
  if(isFirst&&!isStaff) return false;
  return (isAuthor&&withinWindow)||isStaff;
}

  const err=el('div',{class:'err'});
  const sendBtn=el('button',{class:'btn primary',type:'submit'},[icon('send'),t('send')]);
  out.push(el('form',{class:'compose',onsubmit:async e=>{
    e.preventDefault(); err.textContent='';
    const text=txt.value.trim();
    const data=attach.getData();
    if(!text&&!data.imageData&&!data.videoData&&!data.linkUrl){ err.textContent=t('errMsgEmpty'); return; }
    if(text.length>MSG_MAX){ err.textContent=t('errMsgLong'); return; }
    sendBtn.disabled=true; setBusy(sendBtn,t('sending'));
    try{ await postChatMessage(S.chatId,text,data); txt.value=''; }
    catch(ex){ err.textContent=ex.message||t('errGeneric'); }
    finally{ sendBtn.disabled=false; sendBtn.replaceChildren(icon('send'),document.createTextNode(t('send'))); }
  }},[
    el('label',null,[t('message'),txt]),
    el('label',null,[t('attachments'),attach]),
    err,
    el('div',{class:'actions'},[sendBtn])
  ]));
  return out;
}
function canEditMsg(m){
  if(!S.user) return false;
  const isAuthor=m.author===S.user.nick;
  const isStaff=isOwner(S.user.nick)||isAdmin(S.user.nick)||isModerator(S.user.nick);
  const withinWindow=Date.now()-(m.date||0)<EDIT_WINDOW_MS;
  return (isAuthor&&withinWindow)||isStaff;
}
function chatMsgEl(m,i,chatId,msgKey){
  const av=el('div',{class:'av'});
  const rec=userRecord(m.author);
  const avatar=rec&&rec.profile?safeMediaUrl(rec.profile.avatar):'';
  if(avatar) av.appendChild(el('img',{src:avatar,alt:''}));
  else av.textContent=(m.author||'?').charAt(0);
  av.addEventListener('click',()=>{ S.profileUser=m.author; S.view='profile'; S.profileEdit=false; S.profileTab='profile'; render(); window.scrollTo(0,0); });
  const top=el('div',{class:'top'},[
    nickDisplay(m.author,{clickable:true}),
    el('span',{class:'time',text:fmtTime(m.date)}),
    m.edited?el('span',{class:'time',text:'· '+t('edited')}):null,
    el('span',{class:'post-actions'},[
      canEditMsg(m)?el('button',{type:'button',title:t('editMsg'),text:'✎',onclick:()=>{ S.editing['c_'+chatId+'_'+msgKey]=true; render(); }}):null,
      canEditMsg(m)?el('button',{type:'button',title:t('deleteMsg'),text:'✕',onclick:async()=>{ if(!confirm(t('confirmDeleteMsg'))) return; try{ await deleteChatMessage(chatId,msgKey); }catch(ex){ alert(ex.message||t('errGeneric')); } }}):null
    ].filter(Boolean))
  ].filter(Boolean));
  const bub=el('div',{class:'bub'});
  if(S.editing['c_'+chatId+'_'+msgKey]){
    const ta=el('textarea',{id:'edit-'+chatId+'-'+msgKey,style:'background:var(--bg);border:1px solid var(--accent-dim);border-radius:3px;padding:6px 8px;color:var(--fg);width:100%;min-height:60px;resize:vertical'},[document.createTextNode(m.text||'')]);
    const err=el('div',{class:'err'});
    const save=el('button',{class:'btn primary small',type:'button',text:t('saveEdit'),onclick:async()=>{ err.textContent=''; try{ await editChatMessage(chatId,msgKey,ta.value.trim()); delete S.editing['c_'+chatId+'_'+msgKey]; render(); }catch(ex){ err.textContent=ex.message||t('errGeneric'); } }});
    const cancel=el('button',{class:'btn small',type:'button',text:t('cancelEdit'),onclick:()=>{ delete S.editing['c_'+chatId+'_'+msgKey]; render(); }});
    bub.appendChild(top);
    bub.appendChild(el('div',{class:'edit-row'},[ta,el('div',{class:'actions'},[save,cancel]),err]));
    bub.appendChild(mediaNode(m));
  } else {
    bub.appendChild(top);
    if(m.text) bub.appendChild(el('p',{class:'txt',text:m.text}));
    bub.appendChild(mediaNode(m));
  }
  return el('div',{class:'chatmsg'+(S.user&&m.author===S.user.nick?' self':''),style:'animation-delay:'+Math.min(i*15,200)+'ms'},[av,bub]);
}
function membersView(){
  const m={};
  Object.keys(S.users||{}).forEach(k=>{
    const u=S.users[k];
    if(u&&u.nick){ m[u.nick]=m[u.nick]||{n:u.nick,topics:0,msgs:0,last:0}; }
  });
  S.threads.forEach(th=>{
    m[th.author]=m[th.author]||{n:th.author,topics:0,msgs:0,last:0};
    m[th.author].topics++;
    m[th.author].last=Math.max(m[th.author].last,th.date||0);
    const posts=th.posts?Object.values(th.posts):[];
    posts.forEach(p=>{ m[p.author]=m[p.author]||{n:p.author,topics:0,msgs:0,last:0}; m[p.author].msgs++; m[p.author].last=Math.max(m[p.author].last,p.date||0); });
  });
  Object.values(S.chats||{}).forEach(c=>{ const msgs=c.messages?Object.values(c.messages):[]; msgs.forEach(p=>{ m[p.author]=m[p.author]||{n:p.author,topics:0,msgs:0,last:0}; m[p.author].msgs++; m[p.author].last=Math.max(m[p.author].last,p.date||0); }); });
  const rows=Object.keys(m).map(k=>m[k]).sort((a,b)=>b.msgs-a.msgs);
  const head=el('thead',null,[el('tr',null,[el('th',{text:t('member')}),el('th',{class:'num',text:t('topicsWord')}),el('th',{class:'num',text:t('messages')}),el('th',{class:'date',text:t('last')})])]);
  const body=el('tbody');
  if(!rows.length) body.appendChild(el('tr',null,[el('td',{class:'empty',colspan:'4',text:t('noMembers')})]));
  rows.forEach((r,i)=>{
    const tr=el('tr',{class:'anim-fadeup',style:'animation-delay:'+Math.min(i*25,300)+'ms'});
    const td=el('td'); td.appendChild(nickDisplay(r.n,{clickable:true})); tr.appendChild(td);
    tr.appendChild(el('td',{class:'num mono',text:String(r.topics)}));
    tr.appendChild(el('td',{class:'num mono',text:String(r.msgs)}));
    tr.appendChild(el('td',{class:'date mono',text:r.last?fmt(r.last):'—'}));
    body.appendChild(tr);
  });
  return [el('div',{class:'sechead'},[el('h2',{text:t('members')}),el('span',{class:'count mono',text:rows.length+' '+t('total')})]),el('div',{class:'tablebox'},[el('table',null,[head,body])])];
}
function authView(){
  const isLogin=S.authMode==='login';
  const nick=el('input',{id:'a-nick',type:'text',autocomplete:'username',required:'required',placeholder:t('nick'),maxlength:'20',spellcheck:'false',autocapitalize:'off'});
  const pass=el('input',{id:'a-pass',type:'password',autocomplete:isLogin?'current-password':'new-password',required:'required',placeholder:t('password'),maxlength:'128'});
  const err=el('div',{class:'err'});
  const hint=el('div',{class:'hintline'}); hint.textContent=isLogin?t('hintLogin'):t('hintRegister');
  const submitBtn=el('button',{class:'btn primary',type:'submit',text:isLogin?t('enter'):t('register')});
  const statusBox=el('div',{class:'hintline',style:'color:var(--accent);font-family:var(--font-mono)'});
  return [el('form',{class:'auth',onsubmit:async e=>{
    e.preventDefault(); if(S._busy) return;
    err.textContent=''; statusBox.textContent='';
    S._busy=true; submitBtn.disabled=true;
    try{
      if(isLogin) await login(nick.value,pass.value);
      else await register(nick.value,pass.value);
      S.view='list'; S.open=null; S.authMode='login';
      render(); window.scrollTo(0,0); heartbeat(); registerSession();
    }catch(ex){
      err.textContent=(ex&&ex.message)?ex.message:t('loginFailed');
    }
    finally{ S._busy=false; submitBtn.disabled=false; }
  }},[
    el('h2',{text:isLogin?t('signIn'):t('signUp')}),
    el('label',null,[t('nick'),nick]),
    el('label',null,[t('password'),pass]),
    hint, err, statusBox,
    el('div',{class:'actions'},[submitBtn]),
    el('div',{class:'switch'},[isLogin?t('noAccount')+' ':t('hasAccount')+' ',el('button',{type:'button',text:isLogin?t('create'):t('enter'),onclick:()=>{S.authMode=isLogin?'register':'login';render();}})])
  ])];
}

async function openThread(id){ if(!isSafeKey(id)) return; S.view='thread'; S.open=id; render(); window.scrollTo(0,0); bumpViews(id).catch(()=>{}); }
function openChat(id){ if(!isSafeKey(id)) return; S.view='chat'; S.chatId=id; render(); window.scrollTo(0,0); }

/* RENDER */
function captureFormState(){
  const state={focusId:null,selStart:null,selEnd:null,values:{}};
  const a=document.activeElement;
  if(a){
    if(a.id) state.focusId=a.id;
    if(a.selectionStart!=null){ state.selStart=a.selectionStart; state.selEnd=a.selectionEnd; }
  }
  appEl.querySelectorAll('input,textarea,select').forEach(elx=>{
    let key=elx.id;
    if(!key) key='__'+elx.tagName+'_'+(elx.getAttribute('placeholder')||'')+'_'+(elx.getAttribute('type')||'')+'_'+(elx.name||'');
    state.values[key]=elx.value;
  });
  return state;
}
function restoreFormState(state){
  if(!state) return;
  appEl.querySelectorAll('input,textarea,select').forEach(elx=>{
    let key=elx.id;
    if(!key) key='__'+elx.tagName+'_'+(elx.getAttribute('placeholder')||'')+'_'+(elx.getAttribute('type')||'')+'_'+(elx.name||'');
    if(Object.prototype.hasOwnProperty.call(state.values,key)){
      if(elx.value!==state.values[key]) elx.value=state.values[key];
    }
  });
  if(state.focusId){
    const elx=document.getElementById(state.focusId);
    if(elx&&typeof elx.focus==='function'){
      try{ elx.focus({preventScroll:true}); if(state.selStart!=null&&elx.setSelectionRange) elx.setSelectionRange(state.selStart,state.selEnd); }catch(e){}
    }
  }
}
function render(){
  try{
    const formState=captureFormState();
    const oldWin=document.getElementById('chat-win');
    const wasAtBottom=oldWin?(oldWin.scrollHeight-oldWin.scrollTop-oldWin.clientHeight<50):true;
    appEl.replaceChildren();
    let nodes=[];
    if(S.view==='auth') nodes=authView();
    else if(S.view==='thread') nodes=threadView();
    else if(S.view==='members') nodes=membersView();
    else if(S.view==='chatList') nodes=chatListView();
    else if(S.view==='chat') nodes=chatView();
    else if(S.view==='profile') nodes=profileView();
    else if(PAGES.some(p=>p.id===S.view)) nodes=pageView();
    else nodes=listView();
    nodes.forEach(n=>{ if(n) appEl.appendChild(n); });
    setNav();
    restoreFormState(formState);
    if(S.view==='chat'){
      const nw=document.getElementById('chat-win');
      if(nw&&wasAtBottom) nw.scrollTop=nw.scrollHeight;
    }
  }catch(e){
    console.error('Render error:',e);
    appEl.replaceChildren();
    appEl.appendChild(el('div',{class:'empty',style:'color:#e05a5a;padding:40px;text-align:center'},[
      el('div',{text:'Render error'}),
      el('div',{class:'mono',style:'font-size:12px;margin-top:8px;opacity:.7',text:String(e&&e.message||e)})
    ]));
  }
}
let _pendingRender=false, _renderTimer=null;
function isUserTyping(){
  const a=document.activeElement;
  if(!a) return false;
  const tag=a.tagName;
  if(tag!=='INPUT'&&tag!=='TEXTAREA') return false;
  if(a.type==='checkbox'||a.type==='radio'||a.type==='file'||a.type==='color') return false;
  return true;
}
function scheduleRender(){
  if(isUserTyping()){
    _pendingRender=true;
    if(_renderTimer) clearTimeout(_renderTimer);
    _renderTimer=setTimeout(()=>{ if(_pendingRender&&!isUserTyping()){ _pendingRender=false; render(); } },800);
    return;
  }
  render();
}
document.addEventListener('focusout',()=>{ setTimeout(()=>{ if(_pendingRender&&!isUserTyping()){ _pendingRender=false; render(); } },200); });

function home(){ S.view='list'; S.open=null; S.board=null; S.q=''; S.page=1; S.compose=false; S.pageEdit=null; S.chatId=null; S.chatCreating=false; S.profileUser=null; S.profileEdit=false; render(); window.scrollTo(0,0); }
function goPage(id){ S.view=id; S.open=null; S.compose=false; S.pageEdit=null; S.chatId=null; S.profileUser=null; S.profileEdit=false; render(); window.scrollTo(0,0); }
function goChats(){ S.view='chatList'; S.open=null; S.compose=false; S.pageEdit=null; S.chatId=null; S.profileUser=null; S.profileEdit=false; render(); window.scrollTo(0,0); }

const savedLang=storeGet('f60_lang');
if(savedLang==='en'||savedLang==='ru') S.lang=savedLang;
else S.lang=(navigator.language||'ru').toLowerCase().startsWith('en')?'en':'ru';

storeRemove('f60_user');

/* Firebase listeners */
let _lastUsersHash='',_lastThreadsHash='',_lastChatsHash='',_lastPagesHash='',_lastOnlineHash='',_lastSessionsHash='';
function quickHash(obj){ try{ const s=JSON.stringify(obj); return s.length+':'+s.slice(0,120); }catch(e){ return String(Date.now()); } }

onValue(ref(db,'threads'),snap=>{
  const data=snap.val()||{};
  const arr=Object.keys(data).map(k=>({id:k,...data[k]})).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||(b.date||0)-(a.date||0));
  const h=quickHash(arr);
  if(h===_lastThreadsHash) return;
  _lastThreadsHash=h;
  S.threads=arr;
  scheduleRender();
});
onValue(ref(db,'users'),snap=>{
  const data=snap.val()||{};
  const h=quickHash(data);
  if(h===_lastUsersHash) return;
  _lastUsersHash=h;
  S.users=data;
  scheduleRender();
});
onValue(ref(db,'online'),snap=>{
  const data=snap.val()||{};
  const h=quickHash(data);
  if(h===_lastOnlineHash) return;
  _lastOnlineHash=h;
  S.online=data;
  if(S.view==='list'||S.view==='members') scheduleRender();
});
onValue(ref(db,'pages'),snap=>{
  const data=snap.val()||{};
  const h=quickHash(data);
  if(h===_lastPagesHash) return;
  _lastPagesHash=h;
  S.pages=data;
  if(PAGES.some(p=>p.id===S.view)) scheduleRender();
});
onValue(ref(db,'chats'),snap=>{
  const data=snap.val()||{};
  const h=quickHash(data);
  if(h===_lastChatsHash) return;
  _lastChatsHash=h;
  S.chats=data;
  if(S.view==='chatList'||S.view==='chat') scheduleRender();
});
onValue(ref(db,'sessions'),snap=>{
  const data=snap.val()||{};
  const h=quickHash(data);
  if(h===_lastSessionsHash) return;
  _lastSessionsHash=h;
  S.sessions=data;
  if(S.view==='profile'&&S.profileTab==='sessions') scheduleRender();
});
onAuthStateChanged(auth,u=>{ restoreFromAuth(u).catch(()=>{}); });
