        .catch(function(ex){ alert(ex.message || t('errGeneric')); });
    }}, [icon('trash'), t('dmDeleteSelf')]),
    el('button', {class:'btn danger', type:'button', onclick:function(){
      if(!confirm(t('dmConfirmDeleteBoth'))) return;
      deleteDmForBoth(S.dmId).then(function(){ S.view = 'dmList'; S.dmId = null; render(); })
        .catch(function(ex){ alert(ex.message || t('errGeneric')); });
    }}, [icon('trash'), t('dmDeleteBoth')])
  ]));
  var head = el('div', {class:'chat-head'});
  var avH = el('div', {class:'av'});
  var avUrl2 = rec && rec.profile ? safeMediaUrl(rec.profile.avatar) : '';
  if(avUrl2){ var img2 = el('img', {src:avUrl2}); avH.appendChild(img2); }
  else avH.textContent = name.charAt(0).toUpperCase();
  avH.addEventListener('click', function(){ openProfileOf(name); });
  head.appendChild(avH);
  var infoH = el('div', {class:'info'});
  infoH.appendChild(el('h1', null, [nickDisplay(name, {clickable:true})]));
  infoH.appendChild(el('div', {class:'desc', text:'@' + (rec && rec.username ? rec.username : '—')}));
  head.appendChild(infoH);
  var profBtn = el('button', {class:'btn small', type:'button', onclick:function(){ openProfileOf(name); }}, [icon('user'), t('profile')]);
  head.appendChild(profBtn);
  out.push(head);
  var win = el('div', {class:'chatwin', id:'chat-win'});
  var keys = d.messages ? Object.keys(d.messages).sort(function(a,b){ return (d.messages[a].date||0) - (d.messages[b].date||0); }) : [];
  if(!keys.length) win.appendChild(el('div', {class:'chat-empty', text:'—'}));
  else keys.forEach(function(k, i){
    var m = d.messages[k];
    var av = el('div', {class:'av'});
    var mrec = userRecord(m.author);
    var avatar = mrec && mrec.profile ? safeMediaUrl(mrec.profile.avatar) : '';
    var setL = function(){ var n = (mrec && mrec.nick) || m.author || '?'; av.textContent = String(n).charAt(0).toUpperCase(); };
    if(avatar){
      setL();
      var im = new Image();
      im.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
      im.onload = function(){ av.replaceChildren(im); };
      im.onerror = setL;
      im.src = avatar;
    } else setL();
    av.addEventListener('click', function(){ openProfileOf(m.author); });
    var top = el('div', {class:'top'}, [nickDisplay(m.author, {clickable:true}), el('span', {class:'time', text:fmtTime(m.date)})]);
    var bub = el('div', {class:'bub'});
    bub.appendChild(top);
    if(m.text) bub.appendChild(el('p', {class:'txt', text:m.text}));
    win.appendChild(el('div', {class:'chatmsg' + (m.author === S.user.nick ? ' self' : ''), style:'animation-delay:' + Math.min(i*20, 250) + 'ms'}, [av, bub]));
  });
  out.push(win);
  var txt = el('textarea', {id:'dm-text', 'data-k':'dm-text', required:'required', maxlength:String(MSG_MAX), placeholder:t('yourMsg'), style:'min-height:70px'});
  txt.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); e.target.form.requestSubmit(); }
  });
  var err = el('div', {class:'err'});
  var sendBtn = el('button', {class:'btn primary', type:'submit'}, [icon('send'), t('send')]);
  out.push(el('form', {class:'compose', onsubmit:function(e){
    e.preventDefault(); err.textContent = '';
    var text = txt.value.trim();
    if(!text){ err.textContent = t('errMsgEmpty'); return; }
    sendBtn.disabled = true; setBusy(sendBtn, t('sending'));
    sendDm(text).then(function(){ txt.value = ''; })
      .catch(function(ex){ err.textContent = ex.message || t('errGeneric'); })
      .then(function(){ sendBtn.disabled = false; sendBtn.replaceChildren(icon('send'), document.createTextNode(t('send'))); });
  }}, [
    el('label', null, [t('message'), txt]),
    el('div', {class:'hint', text:'Медиа в личных сообщениях отключено'}),
    err,
    el('div', {class:'actions'}, [sendBtn])
  ]));
  return out;
}

/* ================= PROFILE ================= */
function profileView(){
  if(!S.user) return [el('section', {class:'auth'}, [
    el('h2', {text:t('profile')}),
    el('div', {class:'hintline', text:t('notLoggedIn')}),
    el('div', {class:'actions'}, [el('button', {class:'btn primary', type:'button', text:t('signIn'), onclick:function(){ S.view = 'auth'; S.authMode = 'login'; render(); }})])
  ])];
  var targetId = S.profileUser || S.user.nick;
  var rec = userRecord(targetId) || {};
  var targetNick = rec.nick || targetId;
  var targetUsername = rec.username || usernameToKey(targetId);
  var isMe = targetUsername === S.user.username;
  var prof = rec.profile || {};
  var created = rec.created ? fmt(rec.created) : '—';
  var postsCount = 0, topicsCount = 0;
  S.threads.forEach(function(th){
    if(th.author === targetNick || th.author === targetUsername) topicsCount++;
    var ps = th.posts ? Object.values(th.posts) : [];
    ps.forEach(function(p){ if(p.author === targetNick || p.author === targetUsername) postsCount++; });
  });
  Object.values(S.chats || {}).forEach(function(c){
    var ms = c.messages ? Object.values(c.messages) : [];
    ms.forEach(function(m){ if(m.author === targetNick || m.author === targetUsername) postsCount++; });
  });
  var out = [];
  var bannerUrl = safeMediaUrl(prof.banner);
  var banner = el('div', {class:'profile-banner'});
  if(bannerUrl){ var bimg = el('img', {src:bannerUrl, alt:''}); banner.appendChild(bimg); }
  var avatarBox = el('div', {class:'profile-avatar'});
  var avatar = safeMediaUrl(prof.avatar);
  var setLetterP = function(){ avatarBox.textContent = String(targetNick).charAt(0).toUpperCase(); };
  if(avatar){
    setLetterP();
    var ai = new Image();
    ai.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
    ai.onload = function(){ avatarBox.replaceChildren(ai); };
    ai.onerror = setLetterP;
    ai.src = avatar;
  } else setLetterP();

  var infoBlock = el('div', {class:'profile-info'}, [
    el('div', {class:'profile-name'}, [nickDisplay(targetNick)]),
    el('div', {class:'profile-meta', text:'@' + targetUsername}),
    el('div', {class:'profile-meta', text:t('memberSince') + ': ' + created}),
    prof.bio ? el('div', {class:'profile-meta', text:prof.bio, style:'margin-top:8px;color:var(--fg-dim);font-family:var(--font-body);font-size:13px;max-width:540px'}) : null,
    el('div', {class:'profile-tags'}, [
      el('span', {class:'badge', text:t('topicsCount') + ': ' + topicsCount}),
      el('span', {class:'badge', text:t('postsCount') + ': ' + postsCount}),
      isPremiumUser(targetNick) ? el('span', {class:'sub-badge'}, [icon('crown'), t('premium')]) : null
    ].filter(Boolean))
  ].filter(Boolean));

  out.push(el('div', {class:'profile-head'}, [banner, el('div', {class:'profile-head-inner'}, [avatarBox, infoBlock])]));

  var profileActions = [];
  if(!isMe){
    var writeBtn = el('button', {class:'btn primary', type:'button'}, [icon('mailSend'), t('writeMessage')]);
    writeBtn.title = t('writeMessageHint');
    writeBtn.addEventListener('click', function(){
      if(!S.user){ S.view = 'auth'; S.authMode = 'login'; render(); return; }
      openDmWith(targetUsername).catch(function(ex){ alert(ex.message || t('errGeneric')); });
    });
    profileActions.push(writeBtn);
  }
  if(profileActions.length) out.push(el('div', {class:'profile-actions'}, profileActions));

  if(isMe){
    out.push(el('div', {class:'tabs'}, [
      el('button', {type:'button', 'aria-selected': S.profileTab === 'profile' ? 'true' : 'false', text:t('tabProfile'), onclick:function(){ S.profileTab = 'profile'; render(); }}),
      el('button', {type:'button', 'aria-selected': S.profileTab === 'account' ? 'true' : 'false', text:t('tabAccount'), onclick:function(){ S.profileTab = 'account'; render(); }}),
      el('button', {type:'button', 'aria-selected': S.profileTab === 'sessions' ? 'true' : 'false', text:t('tabSessions'), onclick:function(){ S.profileTab = 'sessions'; render(); }})
    ]));
    if(S.profileTab === 'profile'){
      out.push(el('div', {class:'actions'}, [
        el('button', {class:'btn primary', type:'button', onclick:function(){
          S.profileEdit = !S.profileEdit;
          S.profileDraft = {
            nick: rec.nick || S.user.nick,
            username: rec.username || usernameToKey(S.user.nick),
            avatar: prof.avatar || '', banner: prof.banner || '',
            color: prof.color || '', prefix: prof.prefix || '', prefixColor: prof.prefixColor || '',
            emojis: Array.isArray(prof.emojis) ? prof.emojis.slice(0,1) : [],
            mediaUrl: prof.mediaUrl || '', bio: prof.bio || ''
          };
          render();
        }}, [icon('edit'), S.profileEdit ? t('cancel') : t('editProfile')])
      ]));
      if(S.profileEdit) out.push(profileEditor());
    } else if(S.profileTab === 'account') out.push(accountSettings());
    else if(S.profileTab === 'sessions') out.push(sessionsView());
  }
  return out;
}

function profileEditor(){
  var draft = S.profileDraft;
  var err = el('div', {class:'err'});
  var okBox = el('div', {class:'badge ok'});
  var isPrem = hasPrivilege(S.user.nick);
  var isAdm = isAdminUser(S.user.nick);

  function makeImageField(key, maxSide, maxBytes, previewClass){
    var wrap = el('div', {class:'avatar-upload'});
    var preview = el('div', {class: previewClass || 'avatar-preview'});
    function render(){
      preview.replaceChildren();
      var safe = safeMediaUrl(draft[key]);
      var setLetter = function(){ preview.textContent = String(draft.nick || S.user.nick || '?').charAt(0).toUpperCase(); };
      if(safe){
        setLetter();
        var im = new Image();
        im.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
        im.onload = function(){ preview.replaceChildren(im); };
        im.onerror = setLetter;
        im.src = safe;
      } else setLetter();
    }
    render();
    var fileInput = el('input', {type:'file', accept:'image/*', style:'display:none'});
    fileInput.addEventListener('change', function(){
      if(!fileInput.files[0]) return;
      err.textContent = '';
      compressImage(fileInput.files[0], maxSide, maxBytes)
        .then(function(dataUrl){ draft[key] = dataUrl; render(); })
        .catch(function(ex){ err.textContent = ex.message; });
    });
    var upBtn = el('button', {class:'btn small', type:'button', onclick:function(){ fileInput.click(); }}, [icon('image'), 'Из галереи']);
    var remBtn = el('button', {class:'btn small', type:'button', onclick:function(){ draft[key] = ''; render(); }}, [icon('trash'), 'Убрать']);
    var urlInput = el('input', {type:'url', 'data-k':'url-' + key, placeholder:'https://… (ссылка)', value: /^https?:\/\//i.test(draft[key] || '') ? draft[key] : ''});
    urlInput.addEventListener('input', function(){
      var v = urlInput.value.trim();
      if(!v) return;
      draft[key] = safeMediaUrl(v);
      render();
    });
    wrap.appendChild(preview);
    wrap.appendChild(el('div', {class:'actions'}, [upBtn, remBtn]));
    wrap.appendChild(fileInput);
    wrap.appendChild(urlInput);
    return wrap;
  }

  var colorGrid = el('div', {class:'color-grid'});
  COLORS.forEach(function(c){
    var opt = el('div', {class:'color-opt' + (draft.color === c.id ? ' selected' : '')}, [
      el('div', {class:'color-dot', style:'background:' + c.dot}),
      el('span', {text: S.lang === 'en' ? c.en : c.ru})
    ]);
    opt.addEventListener('click', function(){
      if(!isPrem && c.id !== ''){ err.textContent = t('needPremium'); return; }
      draft.color = c.id; err.textContent = ''; render();
    });
    colorGrid.appendChild(opt);
  });

  var prefixInput = el('input', {type:'text', 'data-k':'prefix', maxlength:'12', placeholder:'Префикс', value:draft.prefix || ''});
  var prefixColorInput = el('input', {type:'color', value:draft.prefixColor || '#ff5a5a', style:'width:64px;height:40px;padding:2px;background:var(--bg-2);border:1px solid var(--line);border-radius:4px;cursor:pointer'});
  prefixColorInput.addEventListener('input', function(){ draft.prefixColor = prefixColorInput.value; renderPrefixPreview(); });
  var prefixPreview = el('div', {class:'nick-preview-box', style:'min-height:48px;font-size:17px'});
  function renderPrefixPreview(){
    prefixPreview.replaceChildren();
    var v = String(draft.prefix || '').trim();
    if(!v){ prefixPreview.appendChild(el('span', {class:'muted', style:'font-size:13px', text:t('prefixNone')})); }
    else {
      var bad = !isAdm && isForbiddenPrefix(v);
      var span = el('span', {class:'nick-prefix ' + (bad ? '' : 'prefix-custom'), text:'[' + v + ']'});
      if(bad) span.style.color = '#ff5a5a';
      else if(draft.prefixColor) span.style.color = safeColor(draft.prefixColor);
      prefixPreview.appendChild(span);
      prefixPreview.appendChild(document.createTextNode(' '));
    }
    var nickEl = document.createElement('span');
    var cc = COLORS.filter(function(x){ return x.id === draft.color; })[0] || {};
    nickEl.className = 'nick-glow ' + (cc.cls || '');
    nickEl.textContent = draft.nick || S.user.nick;
    var em = draft.emojis[0];
    if(em){ var s = document.createElement('span'); s.className = 'nick-emoji'; s.textContent = em; nickEl.appendChild(s); }
    prefixPreview.appendChild(nickEl);
  }
  prefixInput.addEventListener('input', function(){
    var v = prefixInput.value;
    if(!isPrem){ err.textContent = t('needPremium'); prefixInput.value = ''; draft.prefix = ''; renderPrefixPreview(); return; }
    if(!isAdm && isForbiddenPrefix(v)){ err.textContent = t('prefixForbidden'); prefixInput.style.borderColor = '#ff5a5a'; draft.prefix = ''; }
    else { err.textContent = ''; prefixInput.style.borderColor = ''; draft.prefix = v; }
    renderPrefixPreview();
  });
  renderPrefixPreview();

  var emojiGrid = el('div', {class:'emoji-picker'});
  EMOJIS.forEach(function(em){
    var b = el('button', {type:'button', class:'emoji-btn' + (draft.emojis[0] === em ? ' selected' : ''), text:em});
    b.addEventListener('click', function(){
      if(!isPrem){ err.textContent = t('needPremium'); return; }
      draft.emojis = draft.emojis[0] === em ? [] : [em];
      err.textContent = ''; render();
    });
    emojiGrid.appendChild(b);
  });

  var mediaWrap = el('div', {class:'avatar-upload'});
  var mediaPreview = el('div', {class:'avatar-preview', style:'border-radius:8px'});
  function renderMediaPreview(){
    mediaPreview.replaceChildren();
    var safe = safeMediaUrl(draft.mediaUrl);
    if(safe){
      var isVid = /\.(mp4|webm|ogg|mov)(\?|$)/i.test(safe) || /^data:video\//i.test(safe);
      if(isVid){
        mediaPreview.appendChild(el('video', {src:safe, controls:'', preload:'metadata', style:'width:100%;height:100%;object-fit:cover'}));
      } else {
        var im = new Image();
        im.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
        im.onload = function(){ mediaPreview.replaceChildren(im); };
        im.src = safe;
      }
    } else { mediaPreview.textContent = '—'; }
  }
  renderMediaPreview();
  var mediaInput = el('input', {type:'file', accept:'image/*,video/*', style:'display:none'});
  mediaInput.addEventListener('change', function(){
    if(!mediaInput.files[0]) return;
    var f = mediaInput.files[0];
    if(f.type.indexOf('video/') === 0){
      err.textContent = t('videoChecking');
      videoDuration(f).then(function(dur){
        if(dur > VIDEO_MAX_SEC + 0.3){ err.textContent = t('videoTooLong') + dur.toFixed(1) + t('videoTooLongTail'); return; }
        if(f.size > VIDEO_MAX_BYTES){ err.textContent = t('videoToBaseTooBig'); return; }
        return readAsDataURL(f);
      }).then(function(dataUrl){
        if(!dataUrl) return;
        draft.mediaUrl = dataUrl; err.textContent = ''; renderMediaPreview();
      }).catch(function(ex){ err.textContent = ex.message; });
    } else {
      compressImage(f, AVATAR_MAX_SIDE, AVATAR_MAX_BYTES)
        .then(function(dataUrl){ draft.mediaUrl = dataUrl; err.textContent = ''; renderMediaPreview(); })
        .catch(function(ex){ err.textContent = ex.message; });
    }
  });
  var mediaGalleryBtn = el('button', {class:'btn small', type:'button', onclick:function(){ mediaInput.click(); }}, [icon('image'), 'Из галереи']);
  var mediaRemBtn = el('button', {class:'btn small', type:'button', onclick:function(){ draft.mediaUrl = ''; renderMediaPreview(); }}, [icon('trash'), 'Убрать']);
  var mediaUrlInput = el('input', {type:'url', 'data-k':'media-url', placeholder:'https://… (ссылка на фото/видео)', value: /^https?:\/\//i.test(draft.mediaUrl || '') ? draft.mediaUrl : ''});
  mediaUrlInput.addEventListener('input', function(){
    var v = mediaUrlInput.value.trim();
    if(!v) return;
    draft.mediaUrl = safeMediaUrl(v);
    renderMediaPreview();
  });
  mediaWrap.appendChild(mediaPreview);
  mediaWrap.appendChild(el('div', {class:'actions'}, [mediaGalleryBtn, mediaRemBtn]));
  mediaWrap.appendChild(mediaInput);
  mediaWrap.appendChild(mediaUrlInput);

  /* НИК */
  var nickInput = el('input', {type:'text', 'data-k':'p-nick', maxlength:String(NICK_MAX), placeholder:'Отображаемое имя', value: draft.nick || ''});
  nickInput.addEventListener('input', function(){ draft.nick = nickInput.value; renderPrefixPreview(); });
  var nickErr = el('div', {class:'err'});
  var nickOk = el('div', {class:'badge ok'});
  var saveNickBtn = el('button', {class:'btn primary', type:'button'}, [icon('save'), t('changeNick')]);
  saveNickBtn.addEventListener('click', function(){
    nickErr.textContent = ''; nickOk.textContent = '';
    var newNick = String(nickInput.value || '').trim().slice(0, NICK_MAX);
    if(!newNick){ nickErr.textContent = 'Ник не может быть пустым'; return; }
    var key = safePathKey(usernameToKey(S.user.nick));
    saveNickBtn.disabled = true;
    fbUpdate('users/' + key, {nick: newNick})
      .then(function(){ S.user.nick = newNick; if(S.profileDraft) S.profileDraft.nick = newNick; nickOk.textContent = t('nickChanged'); render(); })
      .catch(function(ex){ nickErr.textContent = ex.message || t('errGeneric'); })
      .then(function(){ saveNickBtn.disabled = false; });
  });

  /* ЮЗЕРНЕЙМ */
  var usernameInput = el('input', {type:'text', 'data-k':'p-username', maxlength:'15', placeholder:'username (3–15: A-Za-z0-9_)', value: draft.username || '', style:'background:var(--bg-2);border:1px solid var(--line);border-radius:4px;padding:11px 13px;color:var(--fg);width:100%;font-family:var(--font-mono)'});
  var uErr = el('div', {class:'err'});
  var uOk = el('div', {class:'badge ok'});
  var saveUsernameBtn = el('button', {class:'btn primary', type:'button'}, [icon('save'), t('changeUsername')]);
  saveUsernameBtn.addEventListener('click', function(){
    uErr.textContent = ''; uOk.textContent = '';
    var newU = normalizeUsername(usernameInput.value);
    var oldU = draft.username || usernameToKey(S.user.nick);
    if(newU === oldU){ uErr.textContent = 'Это ваш текущий юзернейм'; return; }
    if(!isValidUsername(newU)){ uErr.textContent = t('errUsernameFormat'); return; }
    var newKey = usernameToKey(newU);
    var oldKey = usernameToKey(S.user.nick);
    if(!isSafeKey(newKey)){ uErr.textContent = t('errUsernameFormat'); return; }
    if(OWNERS.indexOf(newKey) >= 0){ uErr.textContent = t('errUsernameTaken'); return; }
    saveUsernameBtn.disabled = true;
    uErr.textContent = 'Проверяю…';
    usernameTaken(newU).then(function(taken){
      if(taken) throw new Error(t('errUsernameTaken'));
      var oldRec = S.users[oldKey] || {};
      var myAuthEmail = oldRec.authEmail || (auth.currentUser && auth.currentUser.email) || authEmail(oldKey);
      var newRec = Object.assign({}, oldRec, {nick: oldRec.nick || S.user.nick, username: newU, authEmail: myAuthEmail, uid: myUid()});
      return fbSet('users/' + newKey, newRec)
        .then(function(){ return fbSet('usernames/' + newKey, {username: newU, uid: myUid(), authEmail: myAuthEmail}); })
        .then(function(){ return fbRemove('users/' + oldKey); })
        .then(function(){ return fbRemove('usernames/' + oldKey); });
    }).then(function(){
      var freshRec = S.users[usernameToKey(newU)];
      S.user.username = newU;
      S.user.nick = (freshRec && freshRec.nick) || S.user.nick;
      draft.username = newU;
      uOk.textContent = t('usernameChanged') + newU;
      uErr.textContent = '';
      render();
    }).catch(function(ex){ uErr.textContent = (ex && ex.message) || t('errGeneric'); })
      .then(function(){ saveUsernameBtn.disabled = false; });
  });

  var bioInput = el('textarea', {'data-k':'p-bio', maxlength:String(BIO_MAX), placeholder:t('bioPlaceholder'), style:'background:var(--bg-2);border:1px solid var(--line);border-radius:4px;padding:11px;color:var(--fg);width:100%;min-height:90px;resize:vertical;font-family:inherit'});
  bioInput.value = draft.bio || '';
  bioInput.addEventListener('input', function(){ draft.bio = bioInput.value; });

  var saveBtn = el('button', {class:'btn primary', type:'button'}, [icon('save'), t('saveProfile')]);
  saveBtn.addEventListener('click', function(){
    saveBtn.disabled = true; err.textContent = ''; okBox.textContent = '';
    var key = safePathKey(usernameToKey(S.user.username));
    var oldRec = S.users[key] || {};
    var oldProf = oldRec.profile || {};
    var profile = Object.assign({}, oldProf, {
      avatar: draft.avatar || '', banner: draft.banner || '',
      color: draft.color || '', prefix: draft.prefix || '',
      prefixColor: safeColor(draft.prefixColor) || '',
      emojis: Array.isArray(draft.emojis) ? draft.emojis.slice(0,1) : [],
      mediaUrl: safeMediaUrl(draft.mediaUrl) || '',
      bio: String(draft.bio || '').slice(0, BIO_MAX)
    });
    fbUpdate('users/' + key, {nick: draft.nick || oldRec.nick || S.user.nick, profile: profile})
      .then(function(){ okBox.textContent = t('saved'); S.profileEdit = false; render(); })
      .catch(function(ex){ err.textContent = ex.message || t('errGeneric'); })
      .then(function(){ saveBtn.disabled = false; });
  });
  var cancelBtn = el('button', {class:'btn', type:'button', text:t('cancel'), onclick:function(){ S.profileEdit = false; render(); }});

  return el('section', {class:'profile-edit'}, [
    el('h2', {text:t('editProfile')}),
    el('label', null, [t('displayName'), nickInput]),
    el('div', {class:'actions'}, [saveNickBtn]),
    el('span', {class:'hint', text:t('displayNameHint')}),
    nickErr, nickOk,
    el('label', null, [t('usernameLabel'), usernameInput]),
    el('div', {class:'actions'}, [saveUsernameBtn]),
    el('span', {class:'hint', text:t('usernameHint')}),
    uErr, uOk,
    el('label', null, ['Аватар', makeImageField('avatar', AVATAR_MAX_SIDE, AVATAR_MAX_BYTES, 'avatar-preview')]),
    el('label', null, ['Баннер', makeImageField('banner', BANNER_MAX_SIDE, BANNER_MAX_BYTES, 'profile-banner')]),
    el('label', null, [t('profileBio'), bioInput]),
    el('label', null, [t('nickColor') + (isPrem ? '' : ' (премиум)'), colorGrid]),
    el('label', null, [
      t('nickPrefix') + (isPrem ? '' : ' (премиум)'),
      prefixInput,
      el('div', {style:'display:flex;gap:10px;align-items:center;margin-top:8px'}, [prefixColorInput, el('span', {class:'hint', text:t('prefixColor')})]),
      prefixPreview,
      el('span', {class:'hint', text:t('prefixHint')})

/* ================= RENDER ================= */
function captureFormState(){
  var state = {focus:null, start:null, end:null, values:{}};
  var a = document.activeElement;
  if(a){
    if(a.dataset && a.dataset.k) state.focus = a.dataset.k;
    if(a.selectionStart != null){ state.start = a.selectionStart; state.end = a.selectionEnd; }
  }
  appEl.querySelectorAll('input,textarea,select').forEach(function(elx){
    var key = (elx.dataset && elx.dataset.k) || elx.id;
    if(!key) return;
    if(elx.type === 'file' || elx.type === 'color') return;
    state.values[key] = elx.value;
  });
  return state;
}
function restoreFormState(state){
  if(!state) return;
  appEl.querySelectorAll('input,textarea,select').forEach(function(elx){
    var key = (elx.dataset && elx.dataset.k) || elx.id;
    if(!key) return;
    if(Object.prototype.hasOwnProperty.call(state.values, key)){
      if(elx.value !== state.values[key] && elx.type !== 'file' && elx.type !== 'color') elx.value = state.values[key];
    }
  });
  if(state.focus){
    var elx = appEl.querySelector('[data-k="' + CSS.escape(state.focus) + '"]');
    if(elx && elx.focus){
      try { elx.focus({preventScroll:true}); if(state.start != null) elx.setSelectionRange(state.start, state.end); } catch(e){}
    }
  }
}
function render(){
  try {
    var formState = captureFormState();
    var oldWin = document.getElementById('chat-win');
    var wasAtBottom = oldWin ? (oldWin.scrollHeight - oldWin.scrollTop - oldWin.clientHeight < 50) : true;
    appEl.replaceChildren();
    var nodes = [];
    if(S.view === 'auth') nodes = authView();
    else if(S.view === 'thread') nodes = threadView();
    else if(S.view === 'members') nodes = membersView();
    else if(S.view === 'chatList') nodes = chatListView();
    else if(S.view === 'chat') nodes = chatView();
    else if(S.view === 'dmList') nodes = dmListView();
    else if(S.view === 'dm') nodes = dmView();
    else if(S.view === 'profile') nodes = profileView();
    else if(S.view === 'admin') nodes = adminView();
    else if(PAGES.some(function(p){ return p.id === S.view; })) nodes = pageView();
    else nodes = listView();
    nodes.filter(function(n){ return n instanceof Node; }).forEach(function(n){ appEl.appendChild(n); });
    setNav();
    restoreFormState(formState);
    if(S.view === 'chat' || S.view === 'dm'){
      var nw = document.getElementById('chat-win');
      if(nw && wasAtBottom) nw.scrollTop = nw.scrollHeight;
    }
  } catch(e){
    console.error('Render error:', e);
    appEl.replaceChildren();
    appEl.appendChild(el('div', {class:'empty', style:'color:#ff5a5a;padding:40px;text-align:center'}, [
      el('div', {text:'Render error'}),
      el('div', {class:'mono', style:'font-size:12px;margin-top:8px;opacity:.7', text:String(e && e.message || e)})
    ]));
  }
}
var _renderQueued = false;
function isUserTyping(){
  var a = document.activeElement;
  if(!a) return false;
  var tag = a.tagName;
  if(tag !== 'INPUT' && tag !== 'TEXTAREA') return false;
  if(a.type === 'checkbox' || a.type === 'radio' || a.type === 'file' || a.type === 'color') return false;
  return true;
}
function scheduleRender(){
  if(_renderQueued) return;
  _renderQueued = true;
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      _renderQueued = false;
      if(!isUserTyping()) render();
      else setTimeout(function(){ if(!isUserTyping()) render(); else _renderQueued = true; }, 1200);
    });
  });
}
document.addEventListener('focusout', function(){
  setTimeout(function(){ if(!isUserTyping()) render(); }, 200);
});

/* ================= GLOBAL SEARCH ================= */
(function(){
  var input = document.getElementById('global-search');
  var box = document.getElementById('global-search-results');
  if(!input || !box) return;
  function closeBox(){ box.hidden = true; box.replaceChildren(); }
  function openBox(){ box.hidden = false; }
  function renderResults(q){
    q = q.trim().toLowerCase();
    box.replaceChildren();
    if(!q){ closeBox(); return; }
    openBox();
    var threads = S.threads.filter(function(th){ return (th.title || '').toLowerCase().indexOf(q) >= 0; }).slice(0,5);
    var chats = Object.keys(S.chats || {}).map(function(id){
      var c = S.chats[id]; if(!c) return null;
      return {id:id, name:c.name || '', description:c.description || '', author:c.author || ''};
    }).filter(function(c){
      if(!c) return false;
      return c.name.toLowerCase().indexOf(q) >= 0 || c.description.toLowerCase().indexOf(q) >= 0;
    }).slice(0,5);
    var users = Object.keys(S.users || {}).map(function(k){
      var u = S.users[k] || {};
      return { key:k, nick: u.nick || k, username: u.username || k };
    }).filter(function(u){
      return u.nick.toLowerCase().indexOf(q) >= 0 || u.username.toLowerCase().indexOf(q) >= 0;
    }).slice(0,5);
    if(!threads.length && !chats.length && !users.length){ box.appendChild(el('div', {class:'gs-empty', text:'Ничего не найдено'})); return; }
    if(threads.length){
      box.appendChild(el('div', {class:'gs-sec', text:'Темы'}));
      threads.forEach(function(th){
        box.appendChild(el('div', {class:'gs-item', onclick:function(){ S.view = 'thread'; S.open = th.id; closeBox(); input.value = ''; render(); window.scrollTo(0,0); }}, [
          el('div', {class:'gs-ico', text:'T'}),
          el('div', {class:'gs-txt'}, [el('div', {text:th.title}), el('div', {class:'gs-sub', text: boardName(th.board) + ' · ' + (th.author || '—')})])
        ]));
      });
    }
    if(chats.length){
      box.appendChild(el('div', {class:'gs-sec', text:'Чаты'}));
      chats.forEach(function(c){
        box.appendChild(el('div', {class:'gs-item', onclick:function(){ S.view = 'chat'; S.chatId = c.id; closeBox(); input.value = ''; render(); window.scrollTo(0,0); }}, [
          el('div', {class:'gs-ico', text:'#'}),
          el('div', {class:'gs-txt'}, [el('div', {text:c.name || '—'}), el('div', {class:'gs-sub', text: c.author || '—'})])
        ]));
      });
    }
    if(users.length){
      box.appendChild(el('div', {class:'gs-sec', text:'Люди'}));
      users.forEach(function(u){
        box.appendChild(el('div', {class:'gs-item', onclick:function(){
          S.profileUser = u.username; S.view = 'profile'; S.profileEdit = false; S.profileTab = 'profile';
          closeBox(); input.value = ''; render(); window.scrollTo(0,0);
        }}, [
          el('div', {class:'gs-ico', text:(u.nick || '?').charAt(0).toUpperCase()}),
          el('div', {class:'gs-txt'}, [el('div', {text:u.nick}), el('div', {class:'gs-sub', text:'@' + u.username})])
        ]));
      });
    }
  }
  input.addEventListener('input', function(){ renderResults(input.value); });
  input.addEventListener('focus', function(){ if(input.value.trim()) renderResults(input.value); });
  document.addEventListener('click', function(e){ if(!box.contains(e.target) && e.target !== input) closeBox(); });
  input.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ closeBox(); input.blur(); } });
})();

/* ================= REALTIME ================= */
function quickHash(obj){
  try {
    var s = JSON.stringify(obj);
    var h = 2166136261;
    for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(36) + ':' + s.length;
  } catch(e){ return 'x:' + Date.now(); }
}

db.ref('threads').on('value', function(snap){
  var data = snap.val() || {};
  var arr = Object.keys(data).map(function(k){ var o = {id:k}; var v = data[k]; for(var kk in v) o[kk] = v[kk]; return o; })
    .sort(function(a,b){ return (b.pin?1:0) - (a.pin?1:0) || (b.date||0) - (a.date||0); });
  var h = quickHash(arr);
  if(S._lastHash.threads === h) return;
  S._lastHash.threads = h;
  S.threads = arr;
  scheduleRender();
}, function(err){ console.error('threads:', err); });

db.ref('users').on('value', function(snap){
  var data = snap.val() || {};
  var h = quickHash(data);

  function dismiss(){
    if(intro.classList.contains('done')) return;
    intro.classList.add('done');
    setTimeout(function(){ if(intro.parentNode) intro.parentNode.removeChild(intro); }, 700);
  }
  var tId = setTimeout(dismiss, 2200);
  intro.addEventListener('click', function(){ clearTimeout(tId); dismiss(); });
})();
