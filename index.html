<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>60TDEL</title>
<style>
:root{
  --bg:#0a0a0a; --surface:#141414; --surface-2:#1c1c1c; --pin:#1f0505;
  --line:#3a1a1a; --fg:#f4f4f4; --muted:#9a8a8a; --link:#ff4d4d;
  --btn-bg:#c81e1e; --btn-fg:#fff; --nav-bg:#0a0a0a; --nav-fg:#f4f4f4;
  --nav-line:#4a0f0f; --accent:#e11d1d; --accent-dim:#8a1414;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;margin:0}
a{color:var(--link)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.92);opacity:0}60%{transform:scale(1.03);opacity:1}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes windRustle1{0%{transform:rotate(0deg) translateY(0) scale(1);}20%{transform:rotate(-2deg) translateY(-2px) scale(1.01);}40%{transform:rotate(1.5deg) translateY(1px) scale(0.99);}60%{transform:rotate(-1deg) translateY(-1px) scale(1.005);}80%{transform:rotate(0.8deg) translateY(0.5px) scale(1.002);}100%{transform:rotate(0deg) translateY(0) scale(1);}}
@keyframes windRustle2{0%{transform:rotate(0deg) translateX(0) translateY(0);}15%{transform:rotate(1.2deg) translateX(1px) translateY(-1px);}35%{transform:rotate(-1.8deg) translateX(-1px) translateY(1px);}55%{transform:rotate(0.8deg) translateX(0.5px) translateY(-0.5px);}75%{transform:rotate(-0.6deg) translateX(-0.5px) translateY(0.5px);}100%{transform:rotate(0deg) translateX(0) translateY(0);}}
@keyframes windRustle3{0%{transform:rotate(0deg) translateY(0) skewX(0deg);}25%{transform:rotate(-1.5deg) translateY(-1.5px) skewX(0.5deg);}50%{transform:rotate(1.8deg) translateY(1px) skewX(-0.8deg);}75%{transform:rotate(-0.8deg) translateY(-0.5px) skewX(0.3deg);}100%{transform:rotate(0deg) translateY(0) skewX(0deg);}}
@keyframes windRustle4{0%{transform:rotate(0deg) translateX(0) scale(1);}30%{transform:rotate(1.5deg) translateX(-1px) scale(1.008);}60%{transform:rotate(-1.2deg) translateX(1px) scale(0.995);}100%{transform:rotate(0deg) translateX(0) scale(1);}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 4px currentColor)}50%{filter:drop-shadow(0 0 12px currentColor)}}
@keyframes nickShimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes avatarFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.04)}}
@keyframes ringSpin{to{transform:rotate(360deg)}}
@keyframes emojiBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.15)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes scaleIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes borderFlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

.anim-fadeup{animation:fadeUp .45s cubic-bezier(.22,.7,.3,1) both}
.anim-fadein{animation:fadeIn .4s ease both}
.anim-pop{animation:pop .45s cubic-bezier(.22,.8,.3,1.1) both}
.anim-float{animation:floaty 4s ease-in-out infinite}
.anim-slidein{animation:slideInRight .4s cubic-bezier(.22,.7,.3,1) both}
.anim-scalein{animation:scaleIn .35s cubic-bezier(.22,.8,.3,1.1) both}
.spinner{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:-3px;margin-right:6px}

.logo-wind .paper1{animation:windRustle1 3.2s ease-in-out infinite;transform-origin:60px 52px}
.logo-wind .paper2{animation:windRustle2 3.6s ease-in-out infinite;transform-origin:62px 50px}
.logo-wind .paper3{animation:windRustle3 3.0s ease-in-out infinite;transform-origin:64px 48px}
.logo-wind .paper4{animation:windRustle4 3.4s ease-in-out infinite;transform-origin:66px 48px}
.logo-wind-big .paper1{animation:windRustle1 4.2s ease-in-out infinite;transform-origin:110px 98px}
.logo-wind-big .paper2{animation:windRustle2 4.6s ease-in-out infinite;transform-origin:114px 94px}
.logo-wind-big .paper3{animation:windRustle3 4.0s ease-in-out infinite;transform-origin:118px 90px}
.logo-wind-big .paper4{animation:windRustle4 4.4s ease-in-out infinite;transform-origin:122px 90px}

.ico{display:inline-flex;vertical-align:-3px;margin-right:6px;flex:none}
.ico svg{display:block;width:16px;height:16px}

.nav{background:var(--nav-bg);border-bottom:1px solid var(--nav-line);padding-inline:16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px rgba(225,29,29,.08)}
.nav-in{max-width:1200px;margin-inline:auto;display:flex;align-items:center;gap:6px;min-height:60px;flex-wrap:wrap;padding-block:4px}
.brand{display:flex;align-items:center;background:none;border:0;padding:4px 8px 4px 0;cursor:pointer;margin-right:4px}
.brand svg{height:46px;width:auto;display:block;overflow:visible}
.nav button.link{background:none;border:0;color:var(--nav-fg);opacity:.62;padding:8px 10px;cursor:pointer;font-size:15px;position:relative;transition:opacity .25s ease,transform .25s ease,color .25s ease;white-space:nowrap}
.nav button.link:hover{opacity:1;transform:translateY(-1px);color:var(--accent)}
.nav button.link[aria-current="page"]{opacity:1;color:var(--accent)}
.nav button.link[aria-current="page"]::after{content:"";position:absolute;left:8px;right:8px;bottom:2px;height:2px;background:var(--accent);border-radius:2px;animation:fadeIn .3s ease both}
.nav .who{margin-left:auto;color:var(--nav-fg);opacity:.62;font-family:var(--font-mono);font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav .who b{color:var(--accent);opacity:1}
.nav .who button{margin-left:4px;background:none;border:1px solid var(--nav-line);color:var(--nav-fg);padding:3px 8px;border-radius:3px;cursor:pointer;font-size:12px;transition:background .25s ease,color .25s ease,border-color .25s ease}
.nav .who button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.lang{display:inline-flex;border:1px solid var(--nav-line);border-radius:3px;overflow:hidden;margin-left:6px}
.lang button{background:none;border:0;color:var(--nav-fg);padding:3px 8px;font-size:12px;font-family:var(--font-mono);cursor:pointer;opacity:.6;transition:background .2s ease,opacity .2s ease,color .2s ease}
.lang button:hover{opacity:1;color:var(--accent)}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff;opacity:1}

.wrap{max-width:1200px;margin-inline:auto;padding-inline:16px;padding-block:28px 56px;display:flex;flex-direction:column;gap:28px}
h1,h2{margin:0;font-weight:500;letter-spacing:-.01em}
h2{font-size:21px;position:relative;padding-left:12px}
h2::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--accent);border-radius:2px}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

.welcome{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:20px 0 6px}
.welcome .mark{width:180px;height:auto;display:block;filter:drop-shadow(0 0 22px rgba(225,29,29,.35))}
.welcome h1{font-size:34px;letter-spacing:-.02em;background:linear-gradient(180deg,#fff 0%,var(--accent) 120%);-webkit-background-clip:text;background-clip:text;color:transparent}

.stats{border:1px solid var(--line);border-radius:3px;background:var(--surface);overflow:hidden;animation:fadeUp .5s cubic-bezier(.22,.7,.3,1) both}
.stats h2{padding:14px 16px;margin:0;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:18px;color:var(--accent)}
.stats h2::before{display:none}
.stats .grid{display:grid;grid-template-columns:repeat(4,1fr)}
.stats .cell{padding:14px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;transition:background .2s ease}
.stats .cell:last-child{border-right:0}
.stats .cell:hover{background:var(--surface-2)}
.stats .cell .k{font-size:13px;color:var(--muted)}
.stats .cell .v{font-size:22px;font-weight:600;font-family:var(--font-mono);color:var(--fg);transition:color .25s ease}
.stats .cell:hover .v{color:var(--accent)}
@media (max-width:700px){
  .stats .grid{grid-template-columns:repeat(2,1fr)}
  .stats .cell:nth-child(2){border-right:0}
  .stats .cell:nth-child(1),.stats .cell:nth-child(2){border-bottom:1px solid var(--line)}
}

.search{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.search .cap{font-weight:600;color:var(--muted);font-size:14px}
.modes{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;color:var(--muted);font-size:14px}
.modes label{display:flex;align-items:center;gap:6px;cursor:pointer;transition:color .25s ease}
.modes label:hover{color:var(--accent)}
.modes input{accent-color:var(--accent)}
.sf{display:flex;gap:8px;width:100%;max-width:440px}
.sf input[type=search]{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);padding:9px 12px;border-radius:3px;transition:border-color .25s ease,box-shadow .25s ease}
.sf input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(225,29,29,.15)}
.sf input::placeholder{color:var(--muted)}
.btn{background:var(--surface-2);border:1px solid var(--line);padding:9px 16px;border-radius:3px;cursor:pointer;transition:transform .2s ease,border-color .25s ease,background .25s ease,color .25s ease,box-shadow .25s ease,filter .25s ease;display:inline-flex;align-items:center;text-decoration:none}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg);font-weight:500}
.btn.primary:hover{filter:brightness(1.15);color:var(--btn-fg);box-shadow:0 0 14px rgba(225,29,29,.35)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.count{font-size:14px;color:var(--muted)}

.pager{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.pager button{background:none;border:0;border-right:1px solid var(--line);padding:5px 12px;min-width:36px;cursor:pointer;font-size:13px;transition:background .2s ease,color .2s ease}
.pager button:last-child{border-right:0}
.pager button:hover{background:var(--surface-2);color:var(--accent)}
.pager button[aria-current="true"]{background:var(--accent);color:#fff}
.pager button:disabled{opacity:.35;cursor:default}

.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:3px;animation:fadeUp .45s cubic-bezier(.22,.7,.3,1) both}
table{width:100%;border-collapse:collapse;min-width:0}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
thead th{font-weight:600;background:var(--surface-2);font-size:14px;white-space:nowrap;color:var(--accent)}
tbody tr{background:var(--surface);transition:background .2s ease}
tbody tr:nth-child(even){background:var(--bg)}
tbody tr.pin{background:var(--pin)}
td.num,th.num{text-align:center;width:1%;white-space:nowrap}
td.date,th.date{text-align:right;white-space:nowrap;width:1%}
td.title{width:100%;min-width:0}
td.title .t{display:block;overflow-wrap:anywhere}
tr.row{cursor:pointer}
tr.row:hover{background:var(--surface-2)}
.rowbtn{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--fg);font-weight:500;transition:color .2s ease}
.rowbtn:hover{text-decoration:underline;color:var(--accent)}
.sub{display:block;font-size:13px;color:var(--muted)}
.board-tag{font-size:12px;color:var(--accent);border:1px solid var(--accent-dim);border-radius:2px;padding:0 6px;margin-right:8px;white-space:nowrap;font-family:var(--font-mono)}

.v-badge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;flex:none;margin-right:6px;vertical-align:-3px;animation:vGlow 3.4s ease-in-out infinite}
.v-badge svg{display:block;width:100%;height:100%}
.v-badge.green svg{stroke:#22c55e}
.v-badge.red svg{stroke:#ef4444}
.v-badge.white svg{stroke:#ffffff}
@keyframes vGlow{0%,100%{filter:drop-shadow(0 0 1px currentColor)}50%{filter:drop-shadow(0 0 4px currentColor)}}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}

.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}

.compose{border:1px solid var(--line);border-radius:3px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px;animation:fadeUp .45s cubic-bezier(.22,.7,.3,1) both}
.compose:focus-within{border-color:var(--accent-dim);box-shadow:0 0 18px rgba(225,29,29,.08)}
.compose label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.compose input,.compose select,.compose textarea{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:9px 12px;color:var(--fg);width:100%;transition:border-color .25s ease,box-shadow .25s ease}
.compose input:focus,.compose select:focus,.compose textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(225,29,29,.12)}
.compose textarea{min-height:110px;resize:vertical}
.compose .row2{display:grid;grid-template-columns:1fr 220px;gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:12px;color:var(--muted)}

.drop{border:1px dashed var(--line);border-radius:3px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:8px;align-items:flex-start;transition:border-color .25s ease,background .25s ease}
.drop.dragover{border-color:var(--accent);background:rgba(225,29,29,.06)}
.drop .droprow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drop .thumb{width:72px;height:72px;border:1px solid var(--line);border-radius:3px;object-fit:cover;background:var(--surface-2)}
.drop .thumb-v{width:110px;height:72px;border:1px solid var(--line);border-radius:3px;object-fit:cover;background:#000}
.badge{font-size:11px;font-family:var(--font-mono);color:var(--muted);border:1px solid var(--line);border-radius:2px;padding:0 5px}
.badge.warn{color:#ffb84d;border-color:#664400}
.badge.err{color:#ff6b6b;border-color:#662222}
.badge.ok{color:#7fdd7f;border-color:#225522}
.progress{height:6px;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0%;transition:width .2s ease}

.auth{max-width:420px;margin:0 auto;border:1px solid var(--line);border-radius:3px;background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:12px;animation:pop .45s cubic-bezier(.22,.8,.3,1.1) both}
.auth h2{font-size:20px;padding-left:12px}
.auth label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.auth input{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:9px 12px;color:var(--fg);width:100%;transition:border-color .25s ease,box-shadow .25s ease}
.auth input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(225,29,29,.12)}
.auth .switch{font-size:13px;color:var(--muted);text-align:center}
.auth .switch button{background:none;border:0;color:var(--link);cursor:pointer;text-decoration:underline;padding:0}
.auth .switch button:hover{color:var(--accent)}
.auth .hintline{font-size:12px;color:var(--muted);line-height:1.4}
.err{color:#ff6b6b;font-size:13px;min-height:18px}

.post{display:grid;grid-template-columns:150px minmax(0,1fr);border:1px solid var(--line);border-radius:3px;background:var(--surface);animation:fadeUp .45s cubic-bezier(.22,.7,.3,1) both;transition:border-color .25s ease}
.post:hover{border-color:var(--accent-dim)}
.post+.post{margin-top:10px}
.post .who{padding:14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--surface-2)}
.avatar{width:44px;height:44px;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:18px;text-transform:uppercase;transition:transform .3s ease,background .3s ease,color .3s ease;overflow:hidden;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.post:hover .avatar{transform:scale(1.06) rotate(-3deg);background:var(--accent);color:#fff}
.post .name{font-weight:600;overflow-wrap:anywhere;display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.post .body{padding:14px 16px;min-width:0}
.post .meta{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--font-mono)}
.post .text{white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 8px}
.post .attach{margin-top:8px;animation:fadeIn .5s ease both}
.post .attach img{max-width:100%;max-height:500px;border:1px solid var(--line);border-radius:3px;display:block;transition:transform .35s ease;cursor:zoom-in}
.post .attach img:hover{transform:scale(1.01);border-color:var(--accent-dim)}
.post .attach video{max-width:100%;max-height:500px;border:1px solid var(--line);border-radius:3px;display:block;background:#000}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:grid;place-items:center;z-index:50;animation:fadeIn .25s ease both;cursor:zoom-out}
.lightbox img,.lightbox video{max-width:92vw;max-height:92vh;border:1px solid var(--accent-dim);border-radius:3px}

.back{align-self:flex-start}
.titlebar{display:flex;flex-direction:column;gap:6px;animation:fadeUp .4s ease both}
.titlebar h1{font-size:26px;text-wrap:balance;overflow-wrap:anywhere}

.page{border:1px solid var(--line);border-radius:3px;background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:14px;animation:fadeUp .45s cubic-bezier(.22,.7,.3,1) both}
.page h1{font-size:28px;letter-spacing:-.02em;color:var(--accent)}
.page .body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65;font-size:15px}
.page .body:empty::before{content:attr(data-empty);color:var(--muted);font-style:italic}
.page .meta{font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.page .tools{display:flex;gap:8px;flex-wrap:wrap}
.page textarea{min-height:280px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:12px;color:var(--fg);font-family:var(--font-mono);font-size:13px}
.page input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:9px 12px;color:var(--fg);font-size:18px;font-weight:500}
.page input[type=text]:focus,.page textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(225,29,29,.12);outline:none}

.footer{border-top:1px solid var(--nav-line);padding:20px 16px;text-align:center;color:var(--muted);font-family:var(--font-mono);font-size:13px;background:var(--nav-bg)}
.footer b{color:var(--accent);font-weight:600}
.footer .sep{opacity:.4;margin:0 8px}

.chatbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chatform{border:1px solid var(--line);border-radius:3px;background:var(--surface);padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;animation:fadeUp .4s ease both}
.chatform input{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:9px 12px;color:var(--fg);width:100%;transition:border-color .25s ease,box-shadow .25s ease}
.chatform input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(225,29,29,.12);outline:none}
.chatwin{
  border:1px solid var(--line);border-radius:3px;background:var(--surface);
  min-height:320px;max-height:65vh;overflow-y:auto;padding:14px;
  display:flex;flex-direction:column;gap:10px;
  animation:fadeUp .45s cubic-bezier(.22,.7,.3,1) both;
}
.chatmsg{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;animation:fadeIn .3s ease both}
.chatmsg .av{width:38px;height:38px;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:15px;text-transform:uppercase;transition:transform .25s ease,background .25s ease,color .25s ease;overflow:hidden;cursor:pointer}
.chatmsg .av img{width:100%;height:100%;object-fit:cover;display:block}
.chatmsg:hover .av{transform:scale(1.06) rotate(-3deg);background:var(--accent);color:#fff}
.chatmsg .bub{background:var(--surface-2);border:1px solid var(--line);border-radius:3px;padding:8px 10px;min-width:0;transition:border-color .25s ease}

const FORBIDDEN_PREFIX_WORDS=[
  'admin','administrator','админ','администратор',
  'mod','moder','moderator','мод','модер','модератор',
  'owner','владелец','влад','хозяин',
  'root','system','sys','support','саппорт','хелп','help',
  'official','официальный','60tdel','60t','del'
];
function isForbiddenPrefix(v){
  if(!v) return false;
  let s=String(v).toLowerCase();
  s=s.replace(/[^a-zа-яё0-9]/gi,'');
  const map={'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'c','ч':'ch','ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
  s=s.split('').map(c=>map[c]||c).join('');
  const sNoDigits=s.replace(/[0-9]/g,'');
  for(const w of FORBIDDEN_PREFIX_WORDS){ if(s.includes(w)||sNoDigits.includes(w)) return true; }
  const l33t=s.replace(/4/g,'a').replace(/3/g,'e').replace(/1/g,'i').replace(/0/g,'o');
  for(const w of FORBIDDEN_PREFIX_WORDS){ if(l33t.includes(w)) return true; }
  const compact=s.replace(/[^a-z]/g,'');
  for(const w of ['adm','mod','own','root']){ if(compact.startsWith(w)) return true; }
  return false;
}

function el(tag,attrs,kids){
  const e=document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(k=>{
    if(k==='class') e.className=attrs[k];
    else if(k==='text') e.textContent=attrs[k];
    else if(k==='html') e.innerHTML=attrs[k];
    else if(k.indexOf('on')===0) e.addEventListener(k.slice(2),attrs[k]);
    else if(k==='disabled'){ if(attrs[k]) e.setAttribute('disabled',''); }
    else e.setAttribute(k,attrs[k]);
  });
  (kids||[]).forEach(c=>{ if(c==null) return; e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}

function fmtTime(ts){ if(!ts) return '—'; return new Date(ts).toLocaleString(S.lang==='en'?'en-GB':'ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
function num(n){ return (n||0).toLocaleString(S.lang==='en'?'en-US':'ru-RU'); }
function fmtBytes(b){ if(!b) return '0 B'; if(b>1024*1024*1024) return (b/1024/1024/1024).toFixed(2)+' GB'; if(b>1024*1024) return (b/1024/1024).toFixed(2)+' MB'; if(b>1024) return Math.round(b/1024)+' KB'; return Math.round(b)+' B'; }

async function fbGet(p){ const s=await get(ref(db,p)); return s.exists()?s.val():null; }
async function fbSet(p,v){ await set(ref(db,p),v); }
async function fbUpdate(p,v){ await update(ref(db,p),v); }
async function fbRemove(p){ await remove(ref(db,p)); }

/* ---------- Авторизация (Firebase Auth) ---------- */
const AUTH_SUFFIX='@60tdel.local';
function authEmail(nick){ return nickToKey(nick)+AUTH_SUFFIX; }
function authPass(p){ return String(p)+'#60tdel'; } /* Firebase требует минимум 6 символов */
function myUid(){ return auth.currentUser?auth.currentUser.uid:null; }
function authErr(ex){
  const c=String((ex&&ex.code)||'');
  if(c.includes('wrong-password')||c.includes('invalid-credential')||c.includes('invalid-login')) return new Error(t('errWrongPass'));
  if(c.includes('user-not-found')) return new Error(t('errUserNotFound'));
  if(c.includes('email-already-in-use')) return new Error(t('errNickTaken'));
  if(c.includes('too-many-requests')) return new Error('Слишком много попыток, попробуйте позже / Too many attempts, try later');
  if(c.includes('operation-not-allowed')) return new Error('Firebase: включите Authentication → Email/Password');
  return ex;
}
async function findUserRecord(nick){
  const raw=String(nick||'').trim();
  if(!raw) return {key:null,rec:null};
  const variants=new Set([raw,raw.toLowerCase(),nickToKey(raw)]);
  for(const v of variants){
    if(!v||!isSafeKey(v)) continue;
    try{ const r=await fbGet('users/'+v); if(r) return {key:v,rec:r}; }catch(e){}
  }
  try{
    const all=await fbGet('users');
    if(all&&typeof all==='object'){
      const wanted=raw.toLowerCase();
      for(const k of Object.keys(all)){
        const u=all[k]; if(!u) continue;
        const un=String(u.nick||'').toLowerCase();
        if(k.toLowerCase()===wanted||un===wanted) return {key:k,rec:u};
      }
    }
  }catch(e){}
  return {key:nickToKey(raw),rec:null};
}
async function register(nick,pass){
  nick=String(nick||'').trim();
  if(!NICK_RE.test(nick)) throw new Error(t('errNickFormat'));
  if(String(pass||'').length<4) throw new Error(t('errPassShort'));
  const key=nickToKey(nick);
  if(!isSafeKey(key)) throw new Error(t('errNickFormat'));
  if(OWNERS.includes(key)||OWNERS.includes(nick.toLowerCase())) throw new Error(t('errNickTaken'));
  const found=await findUserRecord(nick);
  if(found.rec) throw new Error(t('errNickTaken'));
  try{ await createUserWithEmailAndPassword(auth,authEmail(nick),authPass(pass)); }catch(ex){ throw authErr(ex); }
  await fbSet('users/'+key,{nick,uid:auth.currentUser.uid,owner:false,role:'user',created:Date.now(),profile:{color:'',prefix:'',emojis:[],mediaUrl:'',avatar:''}});
  S.user={nick,owner:false};
}
async function login(nick,pass){
  nick=String(nick||'').trim();
  if(!nick) throw new Error(t('errUserNotFound'));
  const key=nickToKey(nick);
  if(!isSafeKey(key)) throw new Error(t('errUserNotFound'));
  const email=authEmail(nick);
  try{
    await signInWithEmailAndPassword(auth,email,authPass(pass));
  }catch(ex){
    const c=String((ex&&ex.code)||'');
    if(!(c.includes('invalid-credential')||c.includes('user-not-found')||c.includes('invalid-login'))) throw authErr(ex);
    /* Старый аккаунт (пароль хранился хешем в базе) — переносим в Firebase Auth при первом входе */
    const found=await findUserRecord(nick);
    const u=found.rec;
    if(!u) throw new Error(t('errUserNotFound'));
    if(!u.salt||!u.hash) throw new Error(t('errWrongPass'));
    if(u.owner===true||u.role==='owner'||u.role==='admin'||u.role==='moderator'||isOwner(u.nick||nick))
      throw new Error('Для этого аккаунта нужен новый пароль — его создаёт владелец в Firebase / A new password is required for this account');
    if(found.key!==key) throw new Error(t('errWrongPass'));
    if((await hashPass(pass,u.salt))!==u.hash) throw new Error(t('errWrongPass'));
    try{ await createUserWithEmailAndPassword(auth,email,authPass(pass)); }
    catch(e2){ const c2=String((e2&&e2.code)||''); throw c2.includes('email-already-in-use')?new Error(t('errWrongPass')):authErr(e2); }
    await fbUpdate('users/'+safePathKey(key),{uid:auth.currentUser.uid,salt:null,hash:null});
  }
  let rec=null; try{ rec=await fbGet('users/'+key); }catch(e){}
  const rn=(rec&&rec.nick)||nick;
  S.user={nick:rn,owner:isOwner(rn)||isOwner(key)};
}
function logout(){
  if(S.user) fbSet('online/'+S.user.nick.toLowerCase(),null).catch(()=>{});
  S.user=null; storeRemove('f60_user');
  signOut(auth).catch(()=>{}); render();
}
async function restoreFromAuth(u){
  if(S._busy) return; /* идёт вход/регистрация — S.user выставит сама функция */
  if(!u||!u.email||!u.email.endsWith(AUTH_SUFFIX)){ if(S.user){ S.user=null; render(); } return; }
  const key=u.email.slice(0,-AUTH_SUFFIX.length);
  let rec=null; try{ rec=await fbGet('users/'+key); }catch(e){}
  if(S._busy) return;
  const rn=(rec&&rec.nick)||key;
  S.user={nick:rn,owner:isOwner(rn)||isOwner(key)};
  render(); heartbeat();
}
async function heartbeat(){
  if(!S.user) return;
  const key=String(S.user.nick||'').toLowerCase();
  if(!isSafeKey(key)) return;
  try{ await fbSet('online/'+key,{nick:S.user.nick,ts:Date.now()}); }catch(e){}
}
setInterval(heartbeat,25000);
window.addEventListener('beforeunload',()=>{
  if(S.user){ const key=String(S.user.nick||'').toLowerCase(); if(isSafeKey(key)) fbSet('online/'+key,null).catch(()=>{}); }
});

/* ---------- Фото/видео ---------- */
function compressImage(file,maxSide,maxBytes){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        const scale=Math.min(1,maxSide/Math.max(w,h));
        w=Math.round(w*scale); h=Math.round(h*scale);
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        let q=0.85,url=c.toDataURL('image/jpeg',q);
        while(url.length*0.75>maxBytes&&q>0.3){ q-=0.08; url=c.toDataURL('image/jpeg',q); }
        if(url.length*0.75>maxBytes){ reject(new Error(t('photoFail')+fmtBytes(maxBytes))); return; }
        resolve(url);
      };
      img.onerror=()=>reject(new Error(t('notImage')));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error(t('fileReadFail')));
    reader.readAsDataURL(file);
  });
}
function videoDuration(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const v=document.createElement('video');
    v.preload='metadata';
    v.onloadedmetadata=()=>{ URL.revokeObjectURL(url); resolve(v.duration); };
    v.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error(t('videoReadFail'))); };
    v.src=url;
  });
}
async function reencodeVideo(file,targetBytes,onProgress){
  const url=URL.createObjectURL(file);
  const v=document.createElement('video');
  v.src=url; v.muted=true; v.playsInline=true;
  await new Promise((res,rej)=>{ v.onloadedmetadata=()=>res(); v.onerror=()=>rej(new Error(t('videoReadFail'))); });
  const dur=v.duration;
  const scale=Math.min(1,480/Math.max(v.videoWidth,v.videoHeight));
  const w=Math.max(2,Math.round(v.videoWidth*scale));
  const h=Math.max(2,Math.round(v.videoHeight*scale));
  const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
  const ctx=canvas.getContext('2d');
  const stream=canvas.captureStream(24);
  const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp8')?'video/webm;codecs=vp8':(MediaRecorder.isTypeSupported('video/webm')?'video/webm':'');
  if(!mime){ URL.revokeObjectURL(url); throw new Error(t('videoNoRecorder')); }
  const chunks=[];
  const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:700000});
  rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  const done=new Promise(res=>{ rec.onstop=()=>res(); });
  rec.start(200);
  v.currentTime=0; await v.play();
  let raf;
  const draw=()=>{ if(v.paused||v.ended) return; ctx.drawImage(v,0,0,w,h); if(onProgress) onProgress(Math.min(1,v.currentTime/dur)); raf=requestAnimationFrame(draw); };
  raf=requestAnimationFrame(draw);
  await new Promise(res=>{ const stop=()=>{ cancelAnimationFrame(raf); res(); }; v.onended=stop; setTimeout(stop,(dur+0.5)*1000); });
  rec.stop(); await done; URL.revokeObjectURL(url);
  const blob=new Blob(chunks,{type:'video/webm'});
  if(blob.size>targetBytes) throw new Error(t('videoTooBig')+fmtBytes(blob.size));
  const reader=new FileReader();
  return await new Promise((res,rej)=>{ reader.onload=()=>res(reader.result); reader.onerror=()=>rej(new Error(t('fileReadFail'))); reader.readAsDataURL(blob); });
}
function readAsDataURL(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error(t('fileReadFail'))); r.readAsDataURL(file); });
}
function packMedia(a){
  const p={};
  if(a.imageData){ p.media=a.imageData; p.mediaType='image'; }
  else if(a.videoData){ p.media=a.videoData; p.mediaType='video'; }
  if(a.linkUrl) p.link=a.linkUrl;
  return p;
}
async function publishThread({board,title,text,att}){
  if(!S.user){ S.view='auth'; S.authMode='login'; render(); return; }
  const id=safeRandomId('t');
  const now=Date.now();
  const post=Object.assign({author:S.user.nick,text,date:now},packMedia(att));
  await fbSet('threads/'+safePathKey(id),{board,title,author:S.user.nick,uid:myUid(),date:now,views:0,pin:false,posts:{p0:post}});
  S.compose=false; S.board=null; S.q=''; S.page=1; S.view='list'; S.open=id;
  render(); window.scrollTo(0,0);
}
async function replyThread(threadId,text,att){
  if(!S.user){ S.view='auth'; S.authMode='login'; render(); return; }
  if(!isSafeKey(threadId)) throw new Error(t('errGeneric'));
  const now=Date.now();
  const post=Object.assign({author:S.user.nick,text,date:now},packMedia(att));
  const th=S.threads.find(x=>x.id===threadId);
  const count=th&&th.posts?Object.keys(th.posts).length:0;
  await fbSet(`threads/${threadId}/posts/p${count}`,post);
  render();
}
async function bumpViews(id){
  if(!isSafeKey(id)) return;
  const th=S.threads.find(x=>x.id===id);
  if(!th) return;
  const v=(th.views||0)+1;
  th.views=v;
  await fbUpdate(`threads/${id}`,{views:v});
}

/* ---------- Чаты ---------- */
async function createChat(name){
  if(!S.user) throw new Error(t('needLoginToSend'));
  name=String(name||'').trim();
  if(name.length<1||name.length>CHAT_NAME_MAX) throw new Error(t('errChatName'));
  const id=safeRandomId('c');
  await fbSet('chats/'+safePathKey(id),{name,author:S.user.nick,uid:myUid(),date:Date.now(),messages:{}});
  return id;
}
async function deleteChat(chatId){
  if(!S.user) throw new Error(t('needLoginToSend'));
  if(!isSafeKey(chatId)) throw new Error(t('errGeneric'));
  const c=S.chats[chatId];
  if(!c) throw new Error(t('chatNotFound'));
  if(!(isOwner(S.user.nick)||(c.uid&&c.uid===myUid()))) throw new Error(t('errNoPerm'));
  await fbRemove('chats/'+chatId);
}
async function postChatMessage(chatId,text,att){
  if(!S.user) throw new Error(t('needLoginToSend'));
  if(!isSafeKey(chatId)) throw new Error(t('errGeneric'));
  const now=Date.now();
  const msg=Object.assign({author:S.user.nick,text,date:now},packMedia(att));
  const c=S.chats[chatId];
  const count=c&&c.messages?Object.keys(c.messages).length:0;
  await fbSet(`chats/${chatId}/messages/m${count}`,msg);
}

async function savePage(id,title,body){
  if(!canEdit()) throw new Error(t('onlyOwners'));
  const payload={id,title:title||'',body:body||'',updated:Date.now(),author:S.user?S.user.nick:'—'};
  await fbSet('pages/'+safePathKey(id),payload);
  S.pages[id]=payload;
  S.pageEdit=null;
  render();
}
function pageView(){
  const meta=PAGES.find(p=>p.id===S.view);
  if(!meta) return [el('div',{class:'empty',text:'—'})];
  if(meta.id==='privilege') return [privilegePage()];
  const rec=S.pages[meta.id]||null;
  const editing=S.pageEdit===meta.id&&canEdit();
  const title=(rec&&rec.title)||pageLabel(meta);
  const body=(rec&&rec.body)||'';
  const out=[];
  if(editing){
    const tInput=el('input',{type:'text',value:title,maxlength:'80',id:'page-edit-title'});
    const bArea=el('textarea',{value:body,placeholder:t('editBody'),id:'page-edit-body'});
    const errBox=el('div',{class:'err'});
    const saveBtn=el('button',{class:'btn primary',type:'button'},[icon('save'),t('save')]);
    saveBtn.addEventListener('click',async()=>{ saveBtn.disabled=true; try{ await savePage(meta.id,tInput.value.trim(),bArea.value); }catch(ex){ errBox.textContent=ex.message||t('errGeneric'); } finally{ saveBtn.disabled=false; } });
    const cancelBtn=el('button',{class:'btn',type:'button',text:t('cancel'),onclick:()=>{S.pageEdit=null;render();}});
    out.push(el('section',{class:'page'},[
      el('h1',{text:pageLabel(meta)}),
      el('div',{class:'tools'},[el('label',{style:'flex:1'},[t('editTitle'),tInput])]),
      el('label',null,[t('editBody'),bArea]),
      errBox,
      el('div',{class:'actions'},[saveBtn,cancelBtn])
    ]));
    return out;
  }
  out.push(el('section',{class:'page'},[
    el('h1',{text:title}),
    el('div',{class:'body','data-empty':t('pageEmpty'),text:body}),
    rec?el('div',{class:'meta',text:t('lastEdited')+' '+fmt(rec.updated)+' · '+t('by')+' '+(rec.author||'—')}):null,
    canEdit()?el('div',{class:'tools'},[el('button',{class:'btn',type:'button',onclick:()=>{S.pageEdit=meta.id;render();}},[icon('edit'),t('edit')])]):el('div',{class:'meta',text:t('onlyOwners')})
  ]));
  return out;
}

/* ---------- Вложения ---------- */
function attachmentsBlock(){
  const wrap=el('div',{class:'drop'});
  const state={imageData:null,videoData:null,linkUrl:''};
  const preview=el('div',{class:'droprow'});
  const info=el('div',{class:'badge',text:t('limitInfo')});
  const progWrap=el('div',{class:'progress'},[el('i')]);
  progWrap.style.display='none';
  const imgInput=el('input',{type:'file',accept:'image/*',style:'display:none'});
  imgInput.addEventListener('change',()=>{ if(imgInput.files[0]) handleImage(imgInput.files[0]); });
  const vidInput=el('input',{type:'file',accept:'video/*',style:'display:none'});
  vidInput.addEventListener('change',()=>{ if(vidInput.files[0]) handleVideo(vidInput.files[0]); });
  const imgBtn=el('button',{type:'button',class:'btn'},[icon('image'),t('photo')]);
  imgBtn.addEventListener('click',()=>imgInput.click());
  const vidBtn=el('button',{type:'button',class:'btn'},[icon('video'),t('video')+' ≤ '+VIDEO_MAX_SEC+'s']);
  vidBtn.addEventListener('click',()=>vidInput.click());
  const pasteBtn=el('button',{type:'button',class:'btn'},[icon('clipboard'),t('fromClipboard')]);
  pasteBtn.addEventListener('click',async()=>{
    if(!(navigator.clipboard&&navigator.clipboard.read)){ setInfo(t('clipboardDenied'),'warn'); return; }
    try{ const items=await navigator.clipboard.read(); for(const it of items){ const t2=it.types.find(x=>x.startsWith('image/')); if(t2){ const blob=await it.getType(t2); handleImage(new File([blob],'paste.png',{type:t2})); return; } } setInfo(t('clipboardEmpty'),'warn'); }catch(e){ setInfo(t('clipboardDenied'),'warn'); }
  });
  const clearBtn=el('button',{type:'button',class:'btn'},[icon('trash'),t('clear')]);
  clearBtn.addEventListener('click',()=>{ state.imageData=null; state.videoData=null; state.linkUrl=''; imgInput.value=''; vidInput.value=''; linkInput.value=''; renderPreview(); setInfo(t('cleared'),''); progWrap.style.display='none'; });
  const linkInput=el('input',{type:'url',placeholder:t('linkPlaceholder')});
  linkInput.addEventListener('input',()=>{ state.linkUrl=linkInput.value.trim(); renderPreview(); });
  wrap.appendChild(el('div',{class:'droprow'},[imgBtn,vidBtn,pasteBtn,clearBtn]));
  wrap.appendChild(linkInput);
  wrap.appendChild(progWrap);
  wrap.appendChild(info);
  wrap.appendChild(preview);
  wrap.appendChild(imgInput); wrap.appendChild(vidInput);
  ['dragenter','dragover'].forEach(ev=>wrap.addEventListener(ev,e=>{e.preventDefault();wrap.classList.add('dragover');}));
  ['dragleave','drop'].forEach(ev=>wrap.addEventListener(ev,e=>{e.preventDefault();wrap.classList.remove('dragover');}));
  wrap.addEventListener('drop',e=>{ const f=e.dataTransfer.files&&e.dataTransfer.files[0]; if(!f) return; if(f.type.startsWith('video/')) handleVideo(f); else if(f.type.startsWith('image/')) handleImage(f); });
  function setInfo(text,kind){ info.textContent=text; info.className='badge'+(kind==='err'?' err':kind==='warn'?' warn':kind==='ok'?' ok':''); }
  async function handleImage(file){ setInfo(t('photoCompressing'),''); try{ const dataUrl=await compressImage(file,IMG_MAX_SIDE,IMG_MAX_BYTES); state.imageData=dataUrl; state.videoData=null; renderPreview(); setInfo(t('photoDone')+fmtBytes(dataUrl.length*0.75),'ok'); }catch(ex){ setInfo(ex.message,'err'); } }
  async function handleVideo(file){
    progWrap.style.display=''; progWrap.firstChild.style.width='0%'; setInfo(t('videoChecking'),'');
    try{
      const dur=await videoDuration(file);
      if(!isFinite(dur)||dur>VIDEO_MAX_SEC+0.3){ setInfo(t('videoTooLong')+dur.toFixed(1)+t('videoTooLongTail'),'err'); progWrap.style.display='none'; return; }
      if(file.size<=VIDEO_MAX_BYTES){ const dataUrl=await readAsDataURL(file); if(dataUrl.length*0.75>8*1024*1024){ setInfo(t('videoToBaseTooBig'),'err'); progWrap.style.display='none'; return; } state.videoData=dataUrl; state.imageData=null; renderPreview(); setInfo(t('videoDone')+fmtBytes(dataUrl.length*0.75),'ok'); progWrap.style.display='none'; return; }
      setInfo(t('videoReencoding'),'');
      const dataUrl=await reencodeVideo(file,VIDEO_TARGET,p=>{ progWrap.firstChild.style.width=Math.round(p*100)+'%'; });
      state.videoData=dataUrl; state.imageData=null; renderPreview(); setInfo(t('videoReencDone')+fmtBytes(dataUrl.length*0.75),'ok'); progWrap.style.display='none';
    }catch(ex){ setInfo(ex.message,'err'); progWrap.style.display='none'; }
  }
  function renderPreview(){
    preview.replaceChildren();
    if(state.imageData) preview.appendChild(el('img',{class:'thumb',src:state.imageData,alt:''}));

/* ---------- Статистика ---------- */
function computeStats(){
  let posts=0,threads=0,bytes=0;
  S.threads.forEach(th=>{ threads++; const ps=th.posts?Object.values(th.posts):[]; posts+=ps.length; ps.forEach(p=>{ if(p.media) bytes+=Math.round((p.media.length||0)*0.75); if(p.link) bytes+=p.link.length; }); });
  Object.values(S.chats||{}).forEach(c=>{ const ms=c.messages?Object.values(c.messages):[]; posts+=ms.length; ms.forEach(p=>{ if(p.media) bytes+=Math.round((p.media.length||0)*0.75); if(p.link) bytes+=p.link.length; }); });
  const users=Object.keys(S.users||{}).length;
  const now=Date.now();
  const online=Object.values(S.online||{}).filter(o=>o&&o.ts&&(now-o.ts)<90000).length;
  S.stats={posts,threads,bytes,users,online};
}

/* ---------- Роли ---------- */
function userRecord(nick){
  if(!nick||!S.users) return null;
  const k1=nickToKey(nick);
  const k2=String(nick).toLowerCase();
  return S.users[k1]||S.users[k2]||null;
}
function isAdmin(nick){
  if(isOwner(nick)) return true;
  const r=userRecord(nick);
  return !!(r&&(r.role==='admin'||r.owner===true));
}
function isModerator(nick){
  const r=userRecord(nick);
  return !!(r&&r.role==='moderator');
}
function isPremium(nick){
  const r=userRecord(nick);
  return !!(r&&r.premium===true);
}
function hasPrivilege(nick){ return isAdmin(nick)||isPremium(nick); }
function canSetPrefix(nick){ return isAdmin(nick)||isOwner(nick); }

/* ---------- Nick display ---------- */
function nickDisplay(name,opts){
  opts=opts||{};
  const rec=userRecord(name);
  const prof=(rec&&rec.profile)||{};
  const colorCls=(COLORS.find(c=>c.id===prof.color)||{}).cls||'';
  let prefixLabel=prof.prefix||'';
  let prefixCls='prefix-custom';
  if(!prefixLabel){
    if(isOwner(name)){ prefixLabel='OWNER'; prefixCls='prefix-owner'; }
    else if(isAdmin(name)){ prefixLabel='ADMIN'; prefixCls='prefix-admin'; }
    else if(isModerator(name)){ prefixLabel='MOD'; prefixCls='prefix-moderator'; }
  } else {
    if(isOwner(name)) prefixCls='prefix-owner';
    else if(isAdmin(name)) prefixCls='prefix-admin';
    else if(isModerator(name)) prefixCls='prefix-moderator';
  }
  const emojis=Array.isArray(prof.emojis)?prof.emojis.slice(0,1):[];
  const mediaUrl=safeMediaUrl(prof.mediaUrl);
  const wrap=document.createElement('span');
  wrap.className='nick-wrap';
  if(opts.clickable&&S.user){
    wrap.style.cursor='pointer';
    wrap.addEventListener('click',e=>{ e.stopPropagation(); S.profileUser=name; S.profileEdit=false; S.view='profile'; render(); window.scrollTo(0,0); });
  }
  if(mediaUrl){
    const isVid=/\.(mp4|webm|ogg|mov)(\?|$)/i.test(mediaUrl)||/^data:video\//i.test(mediaUrl);
    if(isVid){
      const v=el('span',{class:'nick-media-video'});
      v.appendChild(el('video',{class:'nick-media',src:mediaUrl,autoplay:'',loop:'',muted:'',playsinline:'',preload:'metadata'}));
      wrap.appendChild(v);
    } else {
      const img=el('img',{class:'nick-media',src:mediaUrl,alt:''});
      img.addEventListener('click',()=>openLightbox(el('img',{src:mediaUrl,alt:''})));
      wrap.appendChild(img);
    }
  }
  const vb=verifiedBadge(name);
  if(vb) wrap.appendChild(vb);
  const nickEl=document.createElement('span');
  nickEl.className='nick-glow '+colorCls;
  if(prefixLabel){
    const pref=document.createElement('span');
    pref.className='nick-prefix '+prefixCls;
    pref.textContent='['+prefixLabel+']';
    nickEl.appendChild(pref);
  }
  nickEl.appendChild(document.createTextNode(name));
  emojis.forEach(em=>{ const s=document.createElement('span'); s.className='nick-emoji'; s.textContent=em; nickEl.appendChild(s); });
  wrap.appendChild(nickEl);
  return wrap;
}
function authorCell(name){ const td=el('td'); td.appendChild(nickDisplay(name,{clickable:true})); return td; }

/* ============================================================
   RENDER — сохраняет фокус, позицию курсора и текст в полях
   ============================================================ */
function captureFormState(){
  const state={focusId:null,selStart:null,selEnd:null,values:{}};
  const a=document.activeElement;
  if(a){
    if(a.id) state.focusId=a.id;
    if(a.selectionStart!=null){ state.selStart=a.selectionStart; state.selEnd=a.selectionEnd; }
  }
  appEl.querySelectorAll('input,textarea,select').forEach(elx=>{
    let key=elx.id;
    if(!key){
      key='__'+elx.tagName+'_'+(elx.getAttribute('placeholder')||'')+'_'+(elx.getAttribute('type')||'')+'_'+(elx.name||'');
    }
    state.values[key]=elx.value;
  });
  return state;
}
function restoreFormState(state){
  if(!state) return;
  appEl.querySelectorAll('input,textarea,select').forEach(elx=>{
    let key=elx.id;
    if(!key){
      key='__'+elx.tagName+'_'+(elx.getAttribute('placeholder')||'')+'_'+(elx.getAttribute('type')||'')+'_'+(elx.name||'');
    }
    if(Object.prototype.hasOwnProperty.call(state.values,key)){
      if(elx.value!==state.values[key]) elx.value=state.values[key];
    }
  });
  if(state.focusId){
    const elx=document.getElementById(state.focusId);
    if(elx&&typeof elx.focus==='function'){
      try{
        elx.focus({preventScroll:true});
        if(state.selStart!=null&&elx.setSelectionRange){
          elx.setSelectionRange(state.selStart,state.selEnd);
        }
      }catch(e){}
    }
  }
}
function render(){
  try{
    const formState=captureFormState();
    const oldWin=document.getElementById('chat-win');
    const wasAtBottom=oldWin?(oldWin.scrollHeight-oldWin.scrollTop-oldWin.clientHeight<50):true;

    appEl.replaceChildren();
    let nodes=[];
    if(S.view==='auth') nodes=authView();
    else if(S.view==='thread') nodes=threadView();
    else if(S.view==='members') nodes=membersView();
    else if(S.view==='chatList') nodes=chatListView();
    else if(S.view==='chat') nodes=chatView();
    else if(S.view==='profile') nodes=profileView();
    else if(PAGES.some(p=>p.id===S.view)) nodes=pageView();
    else nodes=listView();
    nodes.forEach(n=>{ if(n) appEl.appendChild(n); });
    setNav();

    restoreFormState(formState);

    if(S.view==='chat'){
      const nw=document.getElementById('chat-win');
      if(nw&&wasAtBottom) nw.scrollTop=nw.scrollHeight;
    }
  }catch(e){
    console.error('Render error:',e);
    appEl.replaceChildren();
    appEl.appendChild(el('div',{class:'empty',style:'color:#ff6b6b;padding:40px;text-align:center'},[
      el('div',{text:'Ошибка рендера'}),
      el('div',{class:'mono',style:'font-size:12px;margin-top:8px;opacity:.7',text:String(e&&e.message||e)})
    ]));
  }
}

/* Отложенный рендер — если пользователь печатает, не сбиваем ввод */
let _pendingRender=false;
let _renderTimer=null;
function isUserTyping(){
  const a=document.activeElement;
  if(!a) return false;
  const tag=a.tagName;
  if(tag!=='INPUT'&&tag!=='TEXTAREA') return false;
  if(a.type==='checkbox'||a.type==='radio'||a.type==='file') return false;
  return true;
}
function scheduleRender(){
  if(isUserTyping()){
    _pendingRender=true;
    if(_renderTimer) clearTimeout(_renderTimer);
    _renderTimer=setTimeout(()=>{
      if(_pendingRender&&!isUserTyping()){ _pendingRender=false; render(); }
    },800);
    return;
  }
  render();
}
document.addEventListener('focusout',()=>{
  setTimeout(()=>{
    if(_pendingRender&&!isUserTyping()){ _pendingRender=false; render(); }
  },200);
});

$('nav-privilege').addEventListener('click',()=>goPage('privilege'));
$('nav-new').addEventListener('click',()=>{ if(!S.user){ S.view='auth'; S.authMode='login'; render(); return; } S.view='list'; S.open=null; S.compose=true; render(); window.scrollTo(0,0); });
$('nav-members').addEventListener('click',()=>{S.view='members';S.open=null;S.compose=false;S.profileUser=null;render();window.scrollTo(0,0);});

$('lang-ru').addEventListener('click',()=>{ S.lang='ru'; storeSet('f60_lang','ru'); render(); });
$('lang-en').addEventListener('click',()=>{ S.lang='en'; storeSet('f60_lang','en'); render(); });

const savedLang=storeGet('f60_lang');
if(savedLang==='en'||savedLang==='ru') S.lang=savedLang;
else S.lang=(navigator.language||'ru').toLowerCase().startsWith('en')?'en':'ru';

storeRemove('f60_user');
render();

/* ---------- Firebase listeners — каждая ветка рендерит только свои экраны ---------- */
let _lastUsersHash='',_lastThreadsHash='',_lastChatsHash='',_lastPagesHash='',_lastOnlineHash='';
function quickHash(obj){ try{ const s=JSON.stringify(obj); return s.length+':'+s.slice(0,120); }catch(e){ return String(Date.now()); } }

onValue(ref(db,'threads'),snap=>{
  const data=snap.val()||{};
  const arr=Object.keys(data).map(k=>({id:k,...data[k]})).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||(b.date||0)-(a.date||0));
  const h=quickHash(arr);
  if(h===_lastThreadsHash) return;
  _lastThreadsHash=h;
  S.threads=arr;
  /* threads влияют на: list, thread, members */
  if(S.view==='list'||S.view==='thread'||S.view==='members') scheduleRender();
  else render(); /* nav обновить, но без сбивания ввода — render сам сохраняет фокус */
});
onValue(ref(db,'users'),snap=>{
  const data=snap.val()||{};
  const h=quickHash(data);
  if(h===_lastUsersHash) return;
  _lastUsersHash=h;
  S.users=data;
  /* users влияют на отображение ников везде */
  scheduleRender();
});
onValue(ref(db,'online'),snap=>{
  const data=snap.val()||{};
  const h=quickHash(data);
  if(h===_lastOnlineHash) return;
  _lastOnlineHash=h;
  S.online=data;
  /* online влияет только на главную (статистика) и участников */
  if(S.view==='list'||S.view==='members') scheduleRender();
});
onValue(ref(db,'pages'),snap=>{
  const data=snap.val()||{};
  const h=quickHash(data);
  if(h===_lastPagesHash) return;
  _lastPagesHash=h;
  S.pages=data;
  /* pages влияют только на статические страницы */
  if(PAGES.some(p=>p.id===S.view)) scheduleRender();
});
onValue(ref(db,'chats'),snap=>{
  const data=snap.val()||{};
  const h=quickHash(data);
  if(h===_lastChatsHash) return;
  _lastChatsHash=h;
  S.chats=data;
  /* chats влияют только на список чатов и окно чата */
  if(S.view==='chatList'||S.view==='chat') scheduleRender();
});

onAuthStateChanged(auth,u=>{ restoreFromAuth(u).catch(()=>{}); });
</script>

</body>
</html>
