<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>60TDEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#08080a; --bg-2:#0d0d11; --surface:#121218; --surface-2:#181820; --surface-3:#1f1f29;
  --pin:#1e0f0f;
  --line:#23232c; --line-2:#2f2f3a; --line-3:#42424f;
  --fg:#f0f0f4; --fg-dim:#c4c4ce; --muted:#7a7a88; --muted-2:#565664;
  --link:#ff5a5a; --accent:#e0453f; --accent-2:#ff5f57; --accent-dim:#7a2424;
  --btn-bg:#c0392b; --btn-fg:#fff;
  --nav-bg:rgba(8,8,10,.78); --nav-fg:#f0f0f4; --nav-line:#1c1c24;
  --ok:#3fd47a; --warn:#e8a840; --err:#ff5a5a;
  --radius:8px; --radius-sm:5px; --radius-lg:14px;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 12px 32px rgba(0,0,0,.35);
  --shadow-lg:0 24px 64px rgba(0,0,0,.55);
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{
  background:
    radial-gradient(1400px 700px at 85% -15%, rgba(224,69,63,.09), transparent 55%),
    radial-gradient(1000px 600px at -15% 105%, rgba(90,120,255,.05), transparent 55%),
    var(--bg);
  color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;margin:0;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
}
a{color:var(--link);text-decoration:none;transition:color .2s var(--ease)}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:rgba(224,69,63,.4);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-2)}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:5px;border:2px solid var(--bg-2)}
::-webkit-scrollbar-thumb:hover{background:var(--line-3)}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes slideRight{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes emojiPulse{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.18) rotate(6deg)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes introPaper{0%{opacity:0;transform:translateY(40px) rotateX(50deg) scale(.85)}60%{opacity:1}100%{opacity:1;transform:translateY(0) rotateX(0) scale(1)}}
@keyframes introText{0%{opacity:0;letter-spacing:.4em;filter:blur(8px)}100%{opacity:1;letter-spacing:.06em;filter:blur(0)}}
@keyframes introOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.08);visibility:hidden}}
@keyframes barLoad{0%{width:0%}100%{width:100%}}
@keyframes popIn{0%{opacity:0;transform:scale(.8) translateY(10px)}70%{transform:scale(1.03)}100%{opacity:1;transform:scale(1) translateY(0)}}

.spinner{width:15px;height:15px;border:2px solid var(--line-2);border-top-color:var(--accent-2);border-radius:50%;animation:spin .65s linear infinite;display:inline-block;vertical-align:-2px;margin-right:7px}
.ico{display:inline-flex;align-items:center;justify-content:center;vertical-align:-3px;margin-right:6px;flex:none;transition:transform .25s var(--ease)}
.ico svg{display:block;width:16px;height:16px}
.btn:hover .ico,.nav button.link:hover .ico{transform:scale(1.12)}

#intro{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 45%,#141418 0%,#08080a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;perspective:800px;overflow:hidden}
#intro::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%, rgba(224,69,63,.14), transparent 45%);animation:fadeIn 1s var(--ease-out) both}
#intro .intro-logo{transform-style:preserve-3d;animation:introPaper .9s var(--ease-out) both}
#intro .intro-logo svg{width:130px;height:auto;filter:drop-shadow(0 20px 40px rgba(0,0,0,.7))}
#intro .intro-title{font-size:34px;font-weight:800;letter-spacing:.06em;color:var(--fg);animation:introText 1s var(--ease-out) .3s both;font-family:var(--font-mono)}
#intro .intro-title span{color:var(--accent-2);text-shadow:0 0 24px rgba(255,95,87,.5)}
#intro .intro-sub{font-size:12px;color:var(--muted);font-family:var(--font-mono);letter-spacing:.14em;text-transform:uppercase;animation:introText 1s var(--ease-out) .55s both}
#intro .intro-bar{width:200px;height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px;animation:fadeIn .5s var(--ease-out) .7s both}
#intro .intro-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));animation:barLoad 1.3s var(--ease-out) .7s both;box-shadow:0 0 12px rgba(255,95,87,.6)}
#intro.done{animation:introOut .6s var(--ease-out) forwards;pointer-events:none}
#intro.done .intro-logo,#intro.done .intro-title,#intro.done .intro-sub,#intro.done .intro-bar{opacity:0;transition:opacity .3s}

.nav{background:var(--nav-bg);border-bottom:1px solid var(--nav-line);padding-inline:16px;position:sticky;top:0;z-index:20;backdrop-filter:saturate(180%) blur(16px);transition:box-shadow .3s var(--ease)}
.nav.scrolled{box-shadow:0 8px 32px rgba(0,0,0,.4)}
.nav-in{max-width:1280px;margin-inline:auto;display:flex;align-items:center;gap:2px;min-height:64px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:center;background:none;border:0;padding:4px 14px 4px 0;cursor:pointer;margin-right:8px;transition:transform .35s var(--ease)}
.brand:hover{transform:scale(1.06) rotate(-3deg)}
.brand svg{height:40px;width:auto;display:block;filter:drop-shadow(0 3px 8px rgba(0,0,0,.55))}
.nav button.link{background:none;border:0;color:var(--nav-fg);opacity:.62;padding:9px 12px;cursor:pointer;font-size:13.5px;position:relative;white-space:nowrap;border-radius:var(--radius-sm);font-weight:500;transition:all .25s var(--ease)}
.nav button.link:hover{opacity:1;color:var(--accent-2);background:rgba(224,69,63,.08);transform:translateY(-1px)}
.nav button.link[aria-current="page"]{opacity:1;color:var(--accent-2)}
.nav button.link[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:2px;animation:scaleIn .3s var(--ease)}
.nav .who{margin-left:auto;color:var(--nav-fg);opacity:.92;font-family:var(--font-mono);font-size:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nav .who button{margin-left:4px;background:none;border:1px solid var(--nav-line);color:var(--nav-fg);padding:6px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;transition:all .25s var(--ease)}
.nav .who button:hover{background:var(--accent);color:#fff;border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 14px rgba(224,69,63,.35)}
.lang{display:inline-flex;border:1px solid var(--nav-line);border-radius:var(--radius-sm);overflow:hidden;margin-left:8px}
.lang button{background:none;border:0;color:var(--nav-fg);padding:6px 10px;font-size:11px;font-family:var(--font-mono);cursor:pointer;opacity:.55;transition:all .2s var(--ease)}
.lang button:hover{opacity:.9}
.lang button[aria-pressed="true"]{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#fff;opacity:1}

.nav-search{position:relative;margin-left:8px;margin-right:8px;min-width:220px;max-width:340px;flex:1}
.nav-search input{width:100%;background:var(--bg-2);border:1px solid var(--nav-line);border-radius:var(--radius-sm);padding:8px 14px;color:var(--fg);font-size:13px;transition:all .25s var(--ease)}
.nav-search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(224,69,63,.15)}
.nav-search-results{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:30;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:var(--shadow-lg);max-height:440px;overflow-y:auto;padding:6px;animation:popIn .25s var(--ease-out)}
.nav-search-results .gs-sec{font-size:10.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.08em;padding:8px 10px 3px;font-family:var(--font-mono)}
.nav-search-results .gs-item{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;color:var(--fg);text-decoration:none;transition:background .18s var(--ease)}
.nav-search-results .gs-item:hover{background:var(--surface-2);text-decoration:none;transform:translateX(3px)}
.nav-search-results .gs-item .gs-ico{width:26px;height:26px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--accent-2);font-size:11px;font-family:var(--font-mono);font-weight:600}
.nav-search-results .gs-item .gs-txt{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.nav-search-results .gs-item .gs-sub{font-size:11px;color:var(--muted);font-family:var(--font-mono)}
.nav-search-results .gs-empty{padding:16px;color:var(--muted);text-align:center;font-size:13px}

.wrap{max-width:1220px;margin-inline:auto;padding-inline:16px;padding-block:32px 72px;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.02em}
h2{font-size:17px;position:relative;padding-left:14px}
h2::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;background:linear-gradient(180deg,var(--accent-2),var(--accent-dim));border-radius:3px;box-shadow:0 0 12px rgba(224,69,63,.4)}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

.hero{padding:26px 0 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);padding-bottom:20px;animation:fadeUp .6s var(--ease-out) both}
.hero h1{font-size:32px;font-weight:800;background:linear-gradient(180deg,#fff,#a8a8b8);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.03em}
.hero .sub{font-size:12.5px;color:var(--muted);font-family:var(--font-mono);letter-spacing:.08em;text-transform:uppercase}

.stats{border:1px solid var(--line);border-radius:var(--radius-lg);background:linear-gradient(180deg,var(--surface),var(--bg-2));overflow:hidden;box-shadow:var(--shadow);animation:fadeUp .6s var(--ease-out) .1s both}
.stats .grid{display:grid;grid-template-columns:repeat(4,1fr)}
.stats .cell{padding:18px 20px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:5px;transition:background .25s var(--ease)}
.stats .cell:hover{background:var(--surface-2)}
.stats .cell:last-child{border-right:0}
.stats .cell .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.stats .cell .v{font-size:26px;font-weight:700;font-family:var(--font-mono);letter-spacing:-.02em}
.stats .cell .v.accent{background:linear-gradient(180deg,var(--accent-2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}

.search{display:flex;flex-direction:column;gap:14px;padding:18px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow);animation:fadeUp .6s var(--ease-out) .15s both}
.search .cap{font-weight:700;color:var(--fg-dim);font-size:11px;text-transform:uppercase;letter-spacing:.12em}
.modes{display:flex;gap:20px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.modes label{display:flex;align-items:center;gap:8px;cursor:pointer;transition:color .2s var(--ease)}
.modes label:hover{color:var(--fg)}
.modes input[type=radio]{accent-color:var(--accent)}
.sf{display:flex;gap:8px;width:100%;max-width:580px}
.sf input[type=search]{flex:1;min-width:0;background:var(--bg-2);border:1px solid var(--line);padding:11px 14px;border-radius:var(--radius-sm);transition:all .25s var(--ease)}
.sf input[type=search]:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(224,69,63,.12)}
.btn{background:var(--surface-2);border:1px solid var(--line);padding:10px 16px;border-radius:var(--radius-sm);cursor:pointer;display:inline-flex;align-items:center;text-decoration:none;font-size:13.5px;line-height:1.2;font-weight:500;transition:all .25s var(--ease);position:relative;overflow:hidden}
.btn::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.08),transparent 60%);opacity:0;transition:opacity .3s}
.btn:hover::before{opacity:1}
.btn:hover{border-color:var(--line-3);background:var(--surface-3);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.35)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(180deg,var(--accent-2),var(--btn-bg));color:var(--btn-fg);border-color:var(--btn-bg);font-weight:600;box-shadow:0 4px 16px rgba(224,69,63,.3)}
.btn.primary:hover{background:linear-gradient(180deg,#ff6f67,#d0483a);border-color:#d0483a;color:#fff;box-shadow:0 8px 28px rgba(224,69,63,.45)}
.btn.danger{background:transparent;color:var(--err);border-color:#5a2020}
.btn.danger:hover{background:#3a1414;border-color:#8a2a2a;box-shadow:0 6px 20px rgba(255,90,90,.2)}
.btn.small{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
.count{font-size:12.5px;color:var(--muted);font-family:var(--font-mono)}

.pager{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.pager button{background:none;border:0;border-right:1px solid var(--line);padding:7px 14px;min-width:38px;cursor:pointer;font-size:13px;color:var(--fg);font-family:var(--font-mono);transition:all .2s var(--ease)}
.pager button:last-child{border-right:0}
.pager button:hover:not(:disabled){background:var(--surface-2);color:var(--accent-2)}
.pager button[aria-current="true"]{background:linear-gradient(180deg,var(--accent-2),var(--accent));color:#fff}
.pager button:disabled{opacity:.3;cursor:default}

.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow);animation:fadeUp .5s var(--ease-out) both}
table{width:100%;border-collapse:collapse;min-width:0}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
thead th{font-weight:600;background:var(--surface-2);font-size:11px;white-space:nowrap;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
tbody tr{background:var(--surface);transition:background .2s var(--ease)}
tbody tr:nth-child(even){background:var(--bg-2)}
tbody tr.pin{background:linear-gradient(90deg,var(--pin),var(--surface))}
td.num,th.num{text-align:center;width:1%;white-space:nowrap}
td.date,th.date{text-align:right;white-space:nowrap;width:1%}
td.title{width:100%;min-width:0}
tr.row{cursor:pointer;animation:fadeUp .4s var(--ease-out) both}
tr.row:hover{background:var(--surface-2)}
tr.row:hover .rowbtn{color:var(--accent-2)}
.rowbtn{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--fg);font-weight:500;font-size:14.5px;transition:color .2s var(--ease)}
.rowbtn:hover{text-decoration:underline}
.sub{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.board-tag{font-size:10.5px;color:var(--accent-2);border:1px solid var(--accent-dim);border-radius:4px;padding:2px 7px;margin-right:8px;white-space:nowrap;font-family:var(--font-mono);text-transform:uppercase;background:rgba(224,69,63,.08);letter-spacing:.04em}
.empty{padding:48px 12px;text-align:center;color:var(--muted);font-size:14px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}

.compose{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);animation:scaleIn .4s var(--ease-out) both}
.compose label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);font-weight:500}
.compose input,.compose select,.compose textarea{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 13px;color:var(--fg);width:100%;transition:all .25s var(--ease)}
.compose input:focus,.compose select:focus,.compose textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(224,69,63,.12)}
.compose textarea{min-height:130px;resize:vertical;font-family:inherit;line-height:1.6}
.compose .row2{display:grid;grid-template-columns:1fr 220px;gap:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:11.5px;color:var(--muted-2)}

.drop{border:1px dashed var(--line-2);border-radius:var(--radius);padding:14px;background:var(--bg-2);display:flex;flex-direction:column;gap:11px;align-items:flex-start;transition:all .25s var(--ease)}
.drop.dragover{border-color:var(--accent);background:rgba(224,69,63,.08);transform:scale(1.01)}
.drop .droprow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drop .thumb{width:80px;height:80px;border:1px solid var(--line);border-radius:var(--radius-sm);object-fit:cover;background:var(--surface-2);animation:popIn .3s var(--ease-out);display:block;line-height:0}
.drop .thumb-v{width:120px;height:80px;border:1px solid var(--line);border-radius:var(--radius-sm);object-fit:cover;background:#000;animation:popIn .3s var(--ease-out);display:block;line-height:0}
.badge{font-size:11px;font-family:var(--font-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:3px 9px;transition:all .2s var(--ease)}
.badge.warn{color:var(--warn);border-color:#5a4400;background:rgba(232,168,64,.06)}
.badge.err{color:var(--err);border-color:#5a2020;background:rgba(255,90,90,.06)}
.badge.ok{color:var(--ok);border-color:#1f4a1f;background:rgba(63,212,122,.06)}
.progress{height:4px;width:100%;background:var(--surface-2);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:0%;transition:width .2s var(--ease);box-shadow:0 0 8px rgba(255,95,87,.5)}

.auth{max-width:460px;margin:0 auto;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);padding:28px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow-lg);animation:scaleIn .5s var(--ease-out) both}
.auth h2{font-size:21px;padding-left:14px}
.auth label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);font-weight:500}
.auth input{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 13px;color:var(--fg);width:100%;transition:all .25s var(--ease)}
.auth input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(224,69,63,.12)}
.auth .switch{font-size:12.5px;color:var(--muted);text-align:center}
.auth .switch button{background:none;border:0;color:var(--link);cursor:pointer;text-decoration:underline;padding:0;font-weight:500;transition:color .2s}
.auth .switch button:hover{color:var(--accent-2)}
.auth .hintline{font-size:12px;color:var(--muted-2);line-height:1.55}
.err{color:var(--err);font-size:12.5px;min-height:16px;font-weight:500}

.post{display:grid;grid-template-columns:160px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--shadow);overflow:hidden;transition:border-color .3s var(--ease),transform .3s var(--ease);animation:fadeUp .4s var(--ease-out) both}
.post:hover{border-color:var(--line-2)}
.post+.post{margin-top:12px}
.post .who{padding:16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:var(--surface-2)}
.avatar{width:48px;height:48px;border:1px solid var(--line-2);color:var(--fg);display:grid;place-items:center;font-family:var(--font-mono);font-weight:600;font-size:18px;text-transform:uppercase;overflow:hidden;cursor:pointer;border-radius:var(--radius);background:var(--surface);transition:transform .25s var(--ease),box-shadow .25s var(--ease);line-height:0;font-size:0}

.post .body{padding:16px 18px;min-width:0}
.post .meta{font-size:11.5px;color:var(--muted);margin-bottom:10px;font-family:var(--font-mono);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.post .text{white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 10px;line-height:1.65;font-size:14.5px}
.post .attach{margin-top:10px;line-height:0;font-size:0}

.post .attach video{max-width:100%;max-height:500px;border:1px solid var(--line);border-radius:var(--radius);display:block;background:#000}
.post-actions{margin-left:auto;display:inline-flex;gap:5px;opacity:0;transition:opacity .25s var(--ease)}
.post:hover .post-actions{opacity:1}
.post-actions button{background:none;border:1px solid var(--line);color:var(--muted);width:28px;height:28px;border-radius:var(--radius-sm);cursor:pointer;display:grid;place-items:center;font-size:12px;padding:0;transition:all .2s var(--ease)}
.post-actions button:hover{color:var(--accent-2);border-color:var(--accent-dim);background:rgba(224,69,63,.1);transform:scale(1.1)}

.edit-row{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.edit-row textarea{background:var(--bg-2);border:1px solid var(--accent-dim);border-radius:var(--radius-sm);padding:11px 13px;color:var(--fg);width:100%;min-height:100px;resize:vertical;font-family:inherit;line-height:1.6;transition:all .25s var(--ease)}
.edit-row textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(224,69,63,.12)}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.95);display:grid;place-items:center;z-index:50;cursor:zoom-out;animation:fadeIn .25s var(--ease-out)}

.back{align-self:flex-start}
.titlebar{display:flex;flex-direction:column;gap:8px;animation:slideRight .4s var(--ease-out) both}

.page{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);padding:26px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);animation:fadeUp .5s var(--ease-out) both}

.page .body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75;font-size:15px;color:var(--fg-dim)}
.page .body:empty::before{content:attr(data-empty);color:var(--muted);font-style:italic}
.page .meta{font-size:11.5px;color:var(--muted-2);font-family:var(--font-mono)}
.page .tools{display:flex;gap:8px;flex-wrap:wrap}
.page textarea{min-height:300px;resize:vertical;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px;color:var(--fg);font-family:var(--font-mono);font-size:13px;line-height:1.65;transition:all .25s var(--ease)}
.page textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(224,69,63,.12)}
.page input[type=text]{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 13px;color:var(--fg);font-size:16px;font-weight:500;width:100%;transition:all .25s var(--ease)}

.footer{border-top:1px solid var(--nav-line);padding:26px 16px;text-align:center;color:var(--muted-2);font-family:var(--font-mono);font-size:12px;background:rgba(8,8,10,.7)}
.footer b{color:var(--accent-2);font-weight:700;letter-spacing:.08em}

.chatbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chatform{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:end;box-shadow:var(--shadow)}

.chatmsg .av img{width:100%;height:100%;object-fit:cover;display:block;border:0}

.chatmsg .top{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px;flex-wrap:wrap}
.chatmsg .top .time{color:var(--muted-2);font-family:var(--font-mono);font-size:11px;margin-left:auto;white-space:nowrap}
.chatmsg .txt{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;font-size:14px;line-height:1.6}
.chatmsg .attach{margin-top:10px;line-height:0;font-size:0}
.chatmsg .attach img,.chatmsg .attach video{max-width:100%;max-height:360px;border:1px solid var(--line);border-radius:var(--radius);display:block}
.chat-empty{color:var(--muted);text-align:center;padding:48px 12px;font-size:14px}
.chat-hint{font-size:12px;color:var(--muted);text-align:center}

.dm-list{display:flex;flex-direction:column;gap:8px}
.dm-item{border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;background:var(--bg-2);display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .25s var(--ease);animation:fadeUp .35s var(--ease-out) both}
.dm-item:hover{border-color:var(--accent-dim);background:var(--surface-2);transform:translateX(4px)}
.dm-item .av{width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;font-weight:600;font-family:var(--font-mono);color:var(--accent-2);flex:none;line-height:0;font-size:0}
.dm-item .av img{width:100%;height:100%;object-fit:cover;display:block}
.dm-item .info{flex:1;min-width:0}
.dm-item .name{font-weight:600;font-size:14px}
.dm-item .last{font-size:12px;color:var(--muted);white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.dm-item .meta{font-size:11px;color:var(--muted-2);font-family:var(--font-mono)}

.chat-head{display:flex;gap:16px;align-items:center;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);padding:16px;box-shadow:var(--shadow);animation:fadeUp .4s var(--ease-out) both}
.chat-head .av{width:60px;height:60px;border-radius:50%;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;font-weight:600;font-family:var(--font-mono);color:var(--accent-2);flex:none;font-size:24px;line-height:0}
.chat-head .av img{width:100%;height:100%;object-fit:cover;display:block}
.chat-head .info{flex:1;min-width:0}
.chat-head .info h1{font-size:22px;font-weight:700}
.chat-head .info .desc{font-size:13px;color:var(--muted);margin-top:4px}

.profile-head{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden;position:relative;box-shadow:var(--shadow);animation:fadeUp .5s var(--ease-out) both}

.profile-banner img{width:100%;height:100%;object-fit:cover;display:block;animation:fadeIn .5s var(--ease-out)}
.profile-head-inner{display:flex;align-items:flex-end;gap:20px;padding:0 26px 22px;margin-top:-48px;position:relative}
.profile-avatar{width:104px;height:104px;border:4px solid var(--surface);border-radius:50%;display:grid;place-items:center;overflow:hidden;background:var(--surface-2);font-family:var(--font-mono);font-weight:600;font-size:36px;color:var(--accent-2);text-transform:uppercase;flex:none;box-shadow:0 10px 30px rgba(0,0,0,.55);transition:transform .3s var(--ease);line-height:0}
.profile-avatar:hover{transform:scale(1.04)}
.profile-avatar img{width:100%;height:100%;object-fit:cover;display:block;border:0}
.profile-info{display:flex;flex-direction:column;gap:6px;min-width:0;padding-bottom:4px}
.profile-name{font-size:26px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap;letter-spacing:-.02em}
.profile-meta{font-size:12px;color:var(--muted);font-family:var(--font-mono)}
.profile-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.profile-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

.nick-wrap{display:inline-flex;align-items:center;flex-wrap:wrap;gap:3px;line-height:1.35}
.nick-glow{position:relative;display:inline-flex;align-items:center;gap:2px;font-weight:600;padding:0 2px;transition:filter .3s var(--ease)}
.nick-glow.glow-red{color:#ff5252;text-shadow:0 0 8px rgba(255,82,82,.8)}
.nick-glow.glow-blue{color:#5490ff;text-shadow:0 0 8px rgba(84,144,255,.8)}
.nick-glow.glow-green{color:#4dd47e;text-shadow:0 0 8px rgba(77,212,126,.8)}
.nick-glow.glow-purple{color:#b870ff;text-shadow:0 0 8px rgba(184,112,255,.8)}
.nick-glow.glow-gold{color:#f5b842;text-shadow:0 0 8px rgba(245,184,66,.8)}
.nick-glow.glow-pink{color:#ff70b8;text-shadow:0 0 8px rgba(255,112,184,.8)}
.nick-glow.shimmer{background:linear-gradient(90deg,#e8e8ec,#ff5a5a,#e8e8ec,#ff5a5a,#e8e8ec);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 3s linear infinite}
.nick-emoji{display:inline-block;font-size:1.05em;line-height:1;margin-left:3px;animation:emojiPulse 3.5s ease-in-out infinite}
.nick-prefix{font-size:.85em;font-weight:700;opacity:.95;margin-right:3px;letter-spacing:.02em}
.nick-prefix.prefix-admin{color:#ff5252}
.nick-prefix.prefix-moderator{color:#b870ff}
.nick-prefix.prefix-owner{color:#f5b842}
.nick-prefix.prefix-custom{color:inherit}
.nick-media{display:inline-block;width:22px;height:22px;border-radius:4px;object-fit:cover;vertical-align:middle;margin-right:5px;border:1px solid var(--line);cursor:pointer;transition:transform .25s var(--ease);line-height:0}
.nick-media:hover{transform:scale(1.15)}
.nick-media-video{position:relative;display:inline-block;vertical-align:middle;margin-right:5px;line-height:0;font-size:0}
.nick-media-video video{width:28px;height:22px;border-radius:4px;border:1px solid var(--line);object-fit:cover;display:block}

.profile-edit{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);padding:26px;display:flex;flex-direction:column;gap:20px;box-shadow:var(--shadow);animation:scaleIn .4s var(--ease-out) both}
.profile-edit h2{font-size:19px}
.profile-edit label{display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--muted);font-weight:500}
.profile-edit input[type=text],.profile-edit input[type=email],.profile-edit input[type=password],.profile-edit input[type=url],.profile-edit select{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 13px;color:var(--fg);width:100%;transition:all .25s var(--ease)}
.profile-edit input:focus,.profile-edit select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(224,69,63,.12)}
.avatar-upload{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border:1px dashed var(--line-2);border-radius:var(--radius);padding:16px;background:var(--bg-2);transition:border-color .25s var(--ease)}
.avatar-upload:hover{border-color:var(--line-3)}
.avatar-upload input[type=url]{margin-top:8px;font-family:var(--font-mono);font-size:12px}
.avatar-upload .profile-banner{width:100%;height:130px;border:1px solid var(--line-2);border-radius:var(--radius-sm);overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,#181820,#2a1818)}
.avatar-upload .profile-banner img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-preview{width:88px;height:88px;border-radius:50%;border:2px solid var(--line-2);overflow:hidden;display:grid;place-items:center;background:var(--surface-2);font-family:var(--font-mono);font-size:28px;color:var(--accent-2);text-transform:uppercase;transition:transform .25s var(--ease);line-height:0}
.avatar-preview:hover{transform:scale(1.06)}
.avatar-preview img{width:100%;height:100%;object-fit:cover;display:block;border:0}
.color-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px}
.color-opt{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px;border:1px solid var(--line);border-radius:var(--radius);cursor:pointer;background:var(--bg-2);font-size:12px;color:var(--muted);transition:all .25s var(--ease)}
.color-opt:hover{border-color:var(--line-3);transform:translateY(-2px)}
.color-opt.selected{border-color:var(--accent);background:rgba(224,69,63,.1);color:var(--fg);box-shadow:0 0 0 3px rgba(224,69,63,.1)}
.color-dot{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.12);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.emoji-picker{display:flex;flex-wrap:wrap;gap:5px;max-height:150px;overflow-y:auto;padding:10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-2)}
.emoji-btn{background:none;border:1px solid transparent;border-radius:var(--radius-sm);width:36px;height:36px;font-size:21px;cursor:pointer;display:grid;place-items:center;transition:all .2s var(--ease)}
.emoji-btn:hover{transform:scale(1.2) rotate(-5deg);background:var(--surface-2)}
.emoji-btn.selected{background:rgba(224,69,63,.18);border-color:var(--accent);box-shadow:0 0 0 3px rgba(224,69,63,.1)}
.nick-preview-box{padding:16px;border:1px solid var(--line-2);border-radius:var(--radius);background:var(--bg-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:17px;min-height:60px}
.sub-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:5px 11px;border-radius:4px;background:linear-gradient(135deg,#f59e0b,#e0453f);color:#fff;font-weight:700;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 4px 14px rgba(224,69,63,.3)}

.sessions-list{display:flex;flex-direction:column;gap:9px}
.session-item{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:var(--bg-2);display:flex;align-items:center;gap:16px;font-size:13px;transition:all .25s var(--ease);animation:fadeUp .35s var(--ease-out) both}
.session-item:hover{border-color:var(--line-3);transform:translateX(4px)}
.session-item .s-ico{width:40px;height:40px;border-radius:var(--radius);background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--accent-2)}
.session-item .s-body{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.session-item .s-body .s-name{font-weight:500}
.session-item .s-body .s-meta{font-size:11px;color:var(--muted-2);font-family:var(--font-mono)}
.session-item.current{border-color:var(--accent-dim);background:linear-gradient(180deg,var(--bg-2),#1c1212)}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:6px;flex-wrap:wrap}
.tabs button{background:none;border:0;color:var(--muted);padding:11px 18px;cursor:pointer;font-size:13.5px;border-bottom:2px solid transparent;font-weight:500;transition:all .25s var(--ease)}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--accent-2);border-bottom-color:var(--accent)}

.admin-panel{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);padding:26px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow);animation:fadeUp .4s var(--ease-out) both}
.admin-panel h2{font-size:20px}
.admin-tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:3px}
.admin-tabs button{background:none;border:0;color:var(--muted);padding:10px 16px;cursor:pointer;font-size:13px;border-bottom:2px solid transparent;font-weight:500;transition:all .25s var(--ease)}
.admin-tabs button:hover{color:var(--fg)}
.admin-tabs button.active{color:var(--accent-2);border-bottom-color:var(--accent)}
.admin-table{width:100%;border-collapse:collapse;font-size:13px}
.admin-table th,.admin-table td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left}
.admin-table th{color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:11px;background:var(--surface-2)}
.admin-table td{color:var(--fg-dim)}
.admin-table tr{transition:background .2s var(--ease)}
.admin-table tr:hover td{background:var(--surface-2)}

.boot{padding:80px 20px;text-align:center;color:var(--muted);font-family:var(--font-mono);font-size:13px}
.boot .err{color:var(--err);white-space:pre-wrap;text-align:left;max-width:760px;margin:16px auto 0;padding:14px;border:1px solid #5a2020;border-radius:var(--radius);background:#180a0a;font-size:12px;min-height:auto}

@media (max-width:980px){
  .nav-search{min-width:0;max-width:none;order:99;width:100%;margin:8px 0 0;flex:1 1 100%}
}
@media (max-width:700px){
  .hide-s{display:none}
  .btn,.pager button,.nav button.link{min-height:44px}
  .wrap{padding-inline:12px;padding-block:20px 48px;gap:20px}
  .tablebox table{min-width:480px}
  th,td{padding:10px 12px}
  .post{grid-template-columns:1fr}
  .post .who{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;align-items:center;gap:14px}
  .compose .row2{grid-template-columns:1fr}
  .brand svg{height:34px}
  .nav button.link{padding:9px 8px;font-size:13px}
  .nav .who{font-size:11px}
  .nav .who .who-name{display:none}
  .hero h1{font-size:24px}
  .chatform{grid-template-columns:1fr}
  .chatwin{max-height:60vh;padding:12px}
  .profile-head-inner{flex-direction:column;align-items:center;text-align:center}
  .profile-info{align-items:center}
  .profile-avatar{width:88px;height:88px;font-size:30px}
  #intro .intro-title{font-size:26px}
  #intro .intro-logo svg{width:100px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation-duration:.001ms!important;animation-iteration-count:1!important}
}

<body>

<div id="intro">
  <div class="intro-logo">

}

/* ================= FIREBASE HELPERS ================= */
function fbGet(p){ return db.ref(p).once('value').then(function(s){ return s.exists() ? s.val() : null; }); }
function fbSet(p,v){ return db.ref(p).set(v); }
function fbUpdate(p,v){ return db.ref(p).update(v); }

function authEmail(u){ return usernameToKey(u) + AUTH_DOMAIN; }

/* ================= USER HELPERS ================= */
function userRecord(id){
  if(!id || !S.users) return null;
  var k = usernameToKey(id);
  if(S.users[k]) return S.users[k];
  var keys = Object.keys(S.users);
  for(var i=0;i<keys.length;i++){
    var u = S.users[keys[i]];
    if(!u) continue;
    if(u.username && usernameToKey(u.username) === k) return u;
    if(u.nick && usernameToKey(u.nick) === k) return u;
    if(usernameToKey(keys[i]) === k) return u;
  }
  return null;
}
function isOwnerUser(nick){
  if(isOwnerLegacy(nick)) return true;
  var r = userRecord(nick);
  return !!(r && r.owner === true);
}
function isAdminUser(nick){
  var r = userRecord(nick);
  return isOwnerUser(nick) || !!(r && (r.role === 'admin' || r.role === 'moderator'));
}
function isPremiumUser(nick){
  var r = userRecord(nick);
  return !!(r && r.premium === true);
}
function hasPrivilege(nick){ return isAdminUser(nick) || isPremiumUser(nick) || isOwnerUser(nick); }

function authErr(ex){
  var c = String((ex && ex.code) || '');
  if(c.indexOf('wrong-password') >= 0 || c.indexOf('invalid-credential') >= 0) return new Error(t('errWrongPass'));
  if(c.indexOf('user-not-found') >= 0) return new Error(t('errUserNotFound'));
  if(c.indexOf('email-already-in-use') >= 0) return new Error(t('errUsernameTaken'));
  if(c.indexOf('weak-password') >= 0) return new Error(t('errPassShort'));
  if(c.indexOf('too-many-requests') >= 0) return new Error('Слишком много попыток');
  if(c.indexOf('operation-not-allowed') >= 0) return new Error('Включите Email/Password в Firebase Console');
  if(c.indexOf('network-request-failed') >= 0) return new Error('Проверьте интернет');
  return ex;
}
function usernameTaken(u){
  var key = usernameToKey(u);
  if(!isSafeKey(key)) return Promise.resolve(false);
  return fbGet('usernames/' + key).then(function(r){ return !!r; }).catch(function(){ return false; });
}

/* ===== Register ===== */
function register(username, pass, nick){
  username = normalizeUsername(username);
  pass = String(pass || '');
  nick = String(nick || '').trim().slice(0, NICK_MAX);
  if(!nick) nick = username;

  if(!isValidUsername(username)) return Promise.reject(new Error(t('errUsernameFormat')));
  if(pass.length < 6) return Promise.reject(new Error(t('errPassShort')));
  var key = usernameToKey(username);
  if(!isSafeKey(key)) return Promise.reject(new Error(t('errUsernameFormat')));
  if(OWNERS.indexOf(key) >= 0) return Promise.reject(new Error(t('errUsernameTaken')));

  var initialAuthEmail = authEmail(username);

  return usernameTaken(username).then(function(taken){
    if(taken) throw new Error(t('errUsernameTaken'));
    return auth.createUserWithEmailAndPassword(initialAuthEmail, pass);
  }).then(function(cred){
    var uid = cred.user.uid;
    var profile = {color:'',prefix:'',prefixColor:'',emojis:[],mediaUrl:'',avatar:'',banner:'',bio:''};
    var userRec = {
      nick: nick, username: username, authEmail: initialAuthEmail, uid: uid,
      owner: false, role:'user', premium:false, created: Date.now(),
      profile: profile, threadCooldown: DEFAULT_THREAD_COOLDOWN
    };
    return fbSet('users/' + key, userRec)
      .then(function(){ return fbSet('usernames/' + key, {username: username, uid: uid, authEmail: initialAuthEmail}); });
  }).catch(function(ex){ throw authErr(ex); });
}

/* ===== Login ===== */
function login(username, pass){
  username = normalizeUsername(username);
  pass = String(pass || '');
  if(!username) return Promise.reject(new Error(t('errUserNotFound')));
  if(pass.length < 6) return Promise.reject(new Error(t('errPassShort')));
  var key = usernameToKey(username);
  if(!isSafeKey(key)) return Promise.reject(new Error(t('errUserNotFound')));

  return fbGet('usernames/' + key).then(function(rec){
    var emailToUse = (rec && rec.authEmail) ? rec.authEmail : authEmail(username);
    return auth.signInWithEmailAndPassword(emailToUse, pass);
  }).catch(function(ex){ throw authErr(ex); });
}

function logout(){
  if(S.user){
    var rec = userRecord(S.user.nick);
    var key = rec && rec.uid ? rec.uid : usernameToKey(S.user.nick);
    if(isSafeKey(key)) fbRemove('online/' + key).catch(function(){});
    if(S._sessionId) fbRemove('sessions/' + usernameToKey(S.user.nick) + '/' + S._sessionId).catch(function(){});
  }
  S.user = null; S.myUid = null; S.isAdmin = false; S.isOwnerFlag = false; S._sessionId = null;
  S._restoredOnce = false;
  auth.signOut().catch(function(){});
  render();
}

/* ===== restore ===== */
function restoreFromAuth(u){
  if(!u){
    if(S.user){ S.user = null; S.myUid = null; S.isAdmin = false; S.isOwnerFlag = false; S._sessionId = null; render(); }
    return Promise.resolve();
  }
  var uid = u.uid;
  S.myUid = uid;
  return fbGet('users').then(function(all){
    if(!all) return null;
    var keys = Object.keys(all);
    for(var i=0;i<keys.length;i++){
      if(all[keys[i]] && all[keys[i]].uid === uid) return {key:keys[i], rec:all[keys[i]]};
    }
    return null;
  }).then(function(found){
    if(!found){ S.user = null; render(); return; }
    var rec = found.rec;
    var realUsername = rec.username || found.key;
    var realNick = rec.nick || realUsername;
    S.isOwnerFlag = isOwnerLegacy(realUsername) || rec.owner === true;
    S.isAdmin = rec.role === 'admin' || rec.role === 'moderator' || S.isOwnerFlag;
    S.user = {nick: realNick, username: realUsername, uid: uid, owner: S.isOwnerFlag, role: rec.role || 'user'};
    heartbeat();
    if(!S._restoredOnce){
      S._restoredOnce = true;
      registerSession();
    }
    render();
  });
}

/* ===== heartbeat ===== */
function heartbeat(){
  if(!S.user) return;
  var rec = userRecord(S.user.nick);
  var key = rec && rec.uid ? rec.uid : usernameToKey(S.user.nick);
  if(!isSafeKey(key)) return;
  fbSet('online/' + key, {nick: S.user.nick, ts: Date.now()}).catch(function(){});
  if(S._sessionId) fbUpdate('sessions/' + usernameToKey(S.user.nick) + '/' + S._sessionId, {ts: Date.now()}).catch(function(){});

/* ================= MEDIA ================= */
function compressImage(file, maxSide, maxBytes){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxSide/Math.max(w,h));
        w = Math.round(w*scale); h = Math.round(h*scale);
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        var q = 0.85, url = c.toDataURL('image/jpeg', q);
        while(url.length*0.75 > maxBytes && q > 0.3){ q -= 0.08; url = c.toDataURL('image/jpeg', q); }
        if(url.length*0.75 > maxBytes){ reject(new Error(t('photoFail') + fmtBytes(maxBytes))); return; }
        resolve(url);
      };
      img.onerror = function(){ reject(new Error(t('notImage'))); };
      img.src = reader.result;
    };
    reader.onerror = function(){ reject(new Error(t('fileReadFail'))); };
    reader.readAsDataURL(file);
  });
}
function videoDuration(file){
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file);
    var v = document.createElement('video');
    v.preload = 'metadata';
    v.onloadedmetadata = function(){ URL.revokeObjectURL(url); resolve(v.duration); };
    v.onerror = function(){ URL.revokeObjectURL(url); reject(new Error(t('videoReadFail'))); };
    v.src = url;
  });
}
function reencodeVideo(file, targetBytes, onProgress){
  var url = URL.createObjectURL(file);
  var v = document.createElement('video');
  v.src = url; v.muted = true; v.playsInline = true; v.preload = 'auto';
  return new Promise(function(res, rej){ v.onloadedmetadata = function(){res();}; v.onerror = function(){rej(new Error(t('videoReadFail')));}; })
    .then(function(){
      var dur = v.duration;
      var scale = Math.min(1, 480/Math.max(v.videoWidth, v.videoHeight));
      var w = Math.max(2, Math.round(v.videoWidth*scale));
      var h = Math.max(2, Math.round(v.videoHeight*scale));
      var canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      var stream = canvas.captureStream(24);
      var mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp8') ? 'video/webm;codecs=vp8' : (MediaRecorder.isTypeSupported('video/webm') ? 'video/webm' : '');
      if(!mime){ URL.revokeObjectURL(url); throw new Error(t('videoNoRecorder')); }
      var chunks = [];
      var rec = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond:700000});
      rec.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };
      var done = new Promise(function(res){ rec.onstop = function(){res();}; });
      rec.start(200);
      v.currentTime = 0;
      return v.play().catch(function(){}).then(function(){
        var raf;
        var draw = function(){ if(v.paused || v.ended) return; ctx.drawImage(v, 0, 0, w, h); if(onProgress) onProgress(Math.min(1, v.currentTime/dur)); raf = requestAnimationFrame(draw); };
        raf = requestAnimationFrame(draw);
        return new Promise(function(res){ var stop = function(){ cancelAnimationFrame(raf); res(); }; v.onended = stop; setTimeout(stop, (dur+0.5)*1000); });
      }).then(function(){
        rec.stop();
        return done;
      }).then(function(){
        URL.revokeObjectURL(url);
        var blob = new Blob(chunks, {type:'video/webm'});
        if(blob.size > targetBytes) throw new Error(t('videoTooBig') + fmtBytes(blob.size));
        var reader = new FileReader();
        return new Promise(function(res2, rej2){ reader.onload = function(){res2(reader.result);}; reader.onerror = function(){rej2(new Error(t('fileReadFail')));}; reader.readAsDataURL(blob); });
      });
    });
}
function readAsDataURL(file){
  return new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){res(r.result);}; r.onerror = function(){rej(new Error(t('fileReadFail')));}; r.readAsDataURL(file); });
}
function packMedia(a){
  var p = {};
  if(a.imageData){ p.media = a.imageData; p.mediaType = 'image'; }
  else if(a.videoData){ p.media = a.videoData; p.mediaType = 'video'; }
  if(a.linkUrl) p.link = a.linkUrl;
  return p;
}

/* ================= COOLDOWN / MUTE ================= */
function getCooldown(nick){
  var r = userRecord(nick);
  var c = r && typeof r.threadCooldown === 'number' ? r.threadCooldown : DEFAULT_THREAD_COOLDOWN;
  return Math.max(0, c | 0);
}
function lastThreadTime(nick){
  var rec = userRecord(nick);
  var name = rec ? rec.nick : nick;
  return S.threads.filter(function(th){ return th.author === name || th.author === nick; }).reduce(function(m,th){ return Math.max(m, th.date || 0); }, 0);
}
function cooldownRemaining(nick){
  var cd = getCooldown(nick) * 1000;
  if(!cd) return 0;
  var last = lastThreadTime(nick);
  return Math.max(0, cd - (Date.now() - last));
}
function parseMuteDuration(str){
  if(!str) return 0;
  var m = String(str).trim().toLowerCase().match(/^(\d+)\s*(s|m|h|d)?$/);
  if(!m) return 0;
  var n = parseInt(m[1], 10);
  var u = m[2] || 'm';
  var mult = u === 's' ? 1000 : u === 'm' ? 60000 : u === 'h' ? 3600000 : 86400000;
  return n * mult;
}
function isMuted(chat, c){
  if(!chat || !chat.mutes || !c) return 0;
  var rec = userRecord(c);
  var key = rec && rec.username ? usernameToKey(rec.username) : usernameToKey(c);
  var until = chat.mutes[key] || 0;
  return until > Date.now() ? until : 0;
}

  var usernameInput = el('input', {id:'a-username', 'data-k':'a-username', type:'text', autocomplete:'username', required:'required', placeholder:'username (3–15: A-Za-z0-9_)', maxlength:'15', spellcheck:'false', autocapitalize:'off', style:'font-family:var(--font-mono)'});

  usernameInput.addEventListener('input', function(){
    var v = normalizeUsername(usernameInput.value);

      usernameStatus.style.color = 'var(--err)';

      return;
    }
    usernameStatus.style.color = 'var(--muted)';
    usernameStatus.textContent = t('usernameChecking');
    if(checkTimer) clearTimeout(checkTimer);
    checkTimer = setTimeout(function(){
      usernameTaken(v).then(function(taken){
        if(usernameInput.value.trim() !== v) return;
        if(taken){ usernameStatus.style.color = 'var(--err)'; usernameStatus.textContent = '✗ ' + t('usernameBusy'); }
        else { usernameStatus.style.color = 'var(--ok)'; usernameStatus.textContent = '✓ ' + t('usernameFree'); }
      }).catch(function(){});
    }, 400);
  });

  var switchBtn = el('button', {type:'button', text: isLogin ? t('create') : t('enter'), onclick: function(){
    S.authMode = isLogin ? 'register' : 'login'; render();
  }});
  hint.textContent = isLogin ? t('hintLogin') : t('hintRegister');

  var fields = [];

    err.textContent = ''; S._busy = true; submitBtn.disabled = true;
    var timeout = setTimeout(function(){ S._busy = false; submitBtn.disabled = false; }, 15000);
    var p;

    else p = register(normalizeUsername(usernameInput.value), passInput.value, String(nickInput.value || '').trim().slice(0, NICK_MAX));
    p.then(function(){
      S.view = 'list'; S.open = null; S.authMode = 'login';
      render(); window.scrollTo(0,0);
    }).catch(function(ex){
      err.textContent = (ex && ex.message) ? ex.message : t('loginFailed');
    }).then(function(){
      clearTimeout(timeout);
      S._busy = false; submitBtn.disabled = false;
    });
  }}, [
    el('h2', {text: isLogin ? t('signIn') : t('signUp')}),
    ...fields, hint, err,
    el('div', {class:'actions'}, [submitBtn]),
    el('div', {class:'switch'}, [ isLogin ? t('noAccount') + ' ' : t('hasAccount') + ' ', switchBtn ])
  ]);
  return [form];
}

function attachmentsBlock(opts){
  opts = opts || {};
  var allowMedia = opts.allowMedia !== false;
  var wrap = el('div', {class:'drop'});
  var state = {imageData:null, videoData:null, linkUrl:''};
  var preview = el('div', {class:'droprow'});
  var info = el('div', {class:'badge', text: allowMedia ? t('limitInfo') : ''});
  var progWrap = el('div', {class:'progress'}, [el('i')]); progWrap.style.display = 'none';
  var imgInput = el('input', {type:'file', accept:'image/*', style:'display:none'});
  imgInput.addEventListener('change', function(){ if(imgInput.files[0]) handleImage(imgInput.files[0]); });
  var vidInput = el('input', {type:'file', accept:'video/*', style:'display:none'});
  vidInput.addEventListener('change', function(){ if(vidInput.files[0]) handleVideo(vidInput.files[0]); });
  if(allowMedia){
    var imgBtn = el('button', {type:'button', class:'btn small'}, [icon('image'), t('photo')]);
    imgBtn.addEventListener('click', function(){ imgInput.click(); });
    var vidBtn = el('button', {type:'button', class:'btn small'}, [icon('video'), t('video') + ' ≤ ' + VIDEO_MAX_SEC + 's']);
    vidBtn.addEventListener('click', function(){ vidInput.click(); });
    var pasteBtn = el('button', {type:'button', class:'btn small'}, [icon('clipboard'), t('fromClipboard')]);
    pasteBtn.addEventListener('click', function(){
      if(!(navigator.clipboard && navigator.clipboard.read)){ setInfo(t('clipboardDenied'), 'warn'); return; }
      navigator.clipboard.read().then(function(items){
        for(var i=0;i<items.length;i++){
          var t2 = null;
          for(var j=0;j<items[i].types.length;j++){ if(items[i].types[j].indexOf('image/') === 0){ t2 = items[i].types[j]; break; } }
          if(t2){ return items[i].getType(t2).then(function(blob){ handleImage(new File([blob], 'paste.png', {type:t2})); }); }
        }
        setInfo(t('clipboardEmpty'), 'warn');
      }).catch(function(){ setInfo(t('clipboardDenied'), 'warn'); });
    });
    var clearBtn = el('button', {type:'button', class:'btn small'}, [icon('trash'), t('clear')]);
    clearBtn.addEventListener('click', function(){
      state.imageData = null; state.videoData = null; state.linkUrl = '';
      imgInput.value = ''; vidInput.value = ''; if(linkInput) linkInput.value = '';
      renderPreview(); setInfo(t('cleared'), ''); progWrap.style.display = 'none';
    });
    wrap.appendChild(el('div', {class:'droprow'}, [imgBtn, vidBtn, pasteBtn, clearBtn]));
    wrap.appendChild(imgInput); wrap.appendChild(vidInput);
  } else {
    wrap.appendChild(el('div', {class:'hint', text:'⚠ Медиа в личных сообщениях отключено'}));
  }
  var linkInput = el('input', {type:'url', 'data-k':'link', placeholder:t('linkPlaceholder')});
  linkInput.addEventListener('input', function(){ state.linkUrl = linkInput.value.trim(); renderPreview(); });
  wrap.appendChild(linkInput);
  wrap.appendChild(progWrap); wrap.appendChild(info); wrap.appendChild(preview);
  ['dragenter','dragover'].forEach(function(ev){ wrap.addEventListener(ev, function(e){ if(!allowMedia) return; e.preventDefault(); wrap.classList.add('dragover'); }); });
  ['dragleave','drop'].forEach(function(ev){ wrap.addEventListener(ev, function(e){ if(!allowMedia) return; e.preventDefault(); wrap.classList.remove('dragover'); }); });
  wrap.addEventListener('drop', function(e){
    if(!allowMedia) return;
    var f = e.dataTransfer.files && e.dataTransfer.files[0]; if(!f) return;
    if(f.type.indexOf('video/') === 0) handleVideo(f);
    else if(f.type.indexOf('image/') === 0) handleImage(f);
  });
  function setInfo(text, kind){
    info.textContent = text;
    info.className = 'badge' + (kind === 'err' ? ' err' : kind === 'warn' ? ' warn' : kind === 'ok' ? ' ok' : '');
  }
  function handleImage(file){
    setInfo(t('photoCompressing'), '');
    compressImage(file, IMG_MAX_SIDE, IMG_MAX_BYTES).then(function(dataUrl){
      state.imageData = dataUrl; state.videoData = null;
      renderPreview(); setInfo(t('photoDone') + fmtBytes(dataUrl.length * 0.75), 'ok');
    }).catch(function(ex){ setInfo(ex.message, 'err'); });
  }
  function handleVideo(file){
    progWrap.style.display = ''; progWrap.firstChild.style.width = '0%';
    setInfo(t('videoChecking'), '');
    videoDuration(file).then(function(dur){
      if(!isFinite(dur) || dur > VIDEO_MAX_SEC + 0.3){
        setInfo(t('videoTooLong') + dur.toFixed(1) + t('videoTooLongTail'), 'err');
        progWrap.style.display = 'none'; return;
      }
      if(file.size <= VIDEO_MAX_BYTES){
        return readAsDataURL(file).then(function(dataUrl){
          if(dataUrl.length * 0.75 > 8*1024*1024){ setInfo(t('videoToBaseTooBig'), 'err'); progWrap.style.display = 'none'; return; }
          state.videoData = dataUrl; state.imageData = null;
          renderPreview(); setInfo(t('videoDone') + fmtBytes(dataUrl.length * 0.75), 'ok');
          progWrap.style.display = 'none';
        });
      }
      setInfo(t('videoReencoding'), '');
      return reencodeVideo(file, VIDEO_TARGET, function(p){ progWrap.firstChild.style.width = Math.round(p*100) + '%'; })
        .then(function(dataUrl){
          state.videoData = dataUrl; state.imageData = null;
          renderPreview(); setInfo(t('videoReencDone') + fmtBytes(dataUrl.length * 0.75), 'ok');
          progWrap.style.display = 'none';
        });
    }).catch(function(ex){ setInfo(ex.message, 'err'); progWrap.style.display = 'none'; });
  }
  function renderPreview(){
    preview.replaceChildren();
    if(state.imageData){
      var i = el('img', {class:'thumb', src:state.imageData, alt:''});
      i.addEventListener('error', function(){ i.remove(); });
      preview.appendChild(i);
    }
    if(state.videoData){
      var v = el('video', {class:'thumb-v', src:state.videoData, controls:'', preload:'metadata'});
      v.addEventListener('error', function(){ v.remove(); });
      preview.appendChild(v);
    }
    var safeLink = safeMediaUrl(state.linkUrl);
    if(safeLink){
      var isV = /\.(mp4|webm|ogg|mov)(\?|$)/i.test(safeLink);
      if(isV){
        var v2 = el('video', {class:'thumb-v', src:safeLink, controls:'', preload:'metadata'});
        v2.addEventListener('error', function(){ v2.remove(); });
        preview.appendChild(v2);
      } else {
        var i2 = el('img', {class:'thumb', src:safeLink, alt:''});
        i2.addEventListener('error', function(){ i2.remove(); });
        preview.appendChild(i2);
      }
    }
  }
  wrap.getData = function(){ return {imageData:state.imageData, videoData:state.videoData, linkUrl:safeMediaUrl(state.linkUrl)}; };
  return wrap;
}

function mediaNode(p){
  var nodes = [];
  function addImage(src){
    var safe = safeMediaUrl(src); if(!safe) return;
    var img = el('img', {src:safe, alt:'', loading:'lazy'});
    img.addEventListener('error', function(){ img.remove(); });
    img.addEventListener('click', function(){ openLightbox(el('img', {src:safe, alt:''})); });
    nodes.push(el('div', {class:'attach'}, [img]));
  }
  function addVideo(src){
    var safe = safeMediaUrl(src); if(!safe) return;
    var v = el('video', {src:safe, controls:'', preload:'metadata'});
    v.addEventListener('error', function(){ v.remove(); });
    nodes.push(el('div', {class:'attach'}, [v]));
  }
  if(p.media){ if(p.mediaType === 'video') addVideo(p.media); else addImage(p.media); }
  if(p.link){
    var safeLink = safeMediaUrl(p.link);
    if(safeLink){
      var isV = /\.(mp4|webm|ogg|mov)(\?|$)/i.test(safeLink);
      if(isV) addVideo(safeLink); else addImage(safeLink);
    }
  }
  return nodes.length ? nodes[0] : null;
}
