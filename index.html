<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
/* ================= ANIMATIONS ================= */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
.anim-fade { animation: fadeIn 0.4s ease forwards; }
.anim-slide { animation: slideDown 0.3s ease forwards; }

/* ================= BASE ================= */
:root{
  --bg:#000; --bg-2:#0a0a0c; --surface:#121215; --surface-2:#1a1a1f;
  --line:#2a2a30; --line-2:#3a3a42; --line-3:#4a4a55;
  --fg:#e0e0e0; --fg-dim:#a0a0a5; --muted:#707075;
  --accent:#ff0000; --accent-2:#cc0000; --accent-dim:#440000;
  --link:#ff4444; --btn-bg:#aa0000;
  --ok:#3fd47a; --warn:#e8a840; --err:#ff5a5a;
  --radius:4px; --radius-lg:8px;
  --font-body:"Inter",system-ui,sans-serif; --font-mono:"IBM Plex Mono",monospace; --font-pixel:"VT323",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:14px; line-height:1.5; margin:0; min-height:100vh; -webkit-font-smoothing:antialiased;}
a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius)}
:focus-visible{outline:1px solid var(--accent)}
h1,h2,h3{margin:0;font-weight:600}
.muted{color:var(--muted)}
.err{color:var(--err);font-size:12px;min-height:16px;margin-top:4px}
.spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ================= LAYOUT ================= */
.nav{background:#000;border-bottom:1px solid #1a1a1a;padding:0 20px;position:sticky;top:0;z-index:20}
.nav-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;min-height:50px;flex-wrap:wrap}
.brand{font-family:var(--font-body);font-weight:800;font-size:20px;color:#fff;letter-spacing:0;cursor:pointer;display:flex;align-items:center}
.brand span{color:var(--accent)}
.nav button.link{background:none;border:0;color:#888;font-size:13px;cursor:pointer;padding:4px 0;transition:color .2s;position:relative}
.nav button.link:hover,.nav button.link[aria-current="page"]{color:var(--accent)}
.nav .who{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:#888;font-family:var(--font-mono)}
.nav .who button{background:none;border:0;color:var(--accent);cursor:pointer;font-weight:600}
.nav-search{position:relative;flex:1;max-width:300px}
.nav-search input{width:100%;padding:6px 10px;border-radius:2px;background:#111;border:1px solid #222;font-size:12px}
.lang-switch{display:flex;border:1px solid #333;border-radius:4px;overflow:hidden;margin-left:10px}
.lang-switch button{background:#111;color:#888;border:0;padding:2px 8px;font-size:11px;cursor:pointer;transition:all .2s}
.lang-switch button.active{background:var(--accent);color:#fff;font-weight:bold}
.wrap{max-width:1100px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:20px;min-height:70vh}
.footer{text-align:center;padding:30px;color:#444;font-size:12px;border-top:1px solid #1a1a1a;margin-top:40px}

/* ================= HERO & ASCII ART ================= */
.hero{text-align:center;padding:30px 0 20px; overflow:hidden;}
.hero-art {
  font-family: var(--font-mono);
  font-size: 10px;
  line-height: 1.05;
  color: var(--accent);
  white-space: pre;
  display: inline-block;
  text-align: left;
  margin-bottom: 20px;
  text-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
}
.hero .links{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px;margin-bottom:20px}
.hero .links a{color:var(--accent)}

/* ================= TABLES ================= */
.tablebox{background:#0a0a0c;border:1px solid #1a1a1a;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid #1a1a1a}
thead th{background:#111;color:#666;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
tbody tr:hover{background:#111}
td.title{width:100%}
td.num,th.num{text-align:center;width:1%;white-space:nowrap}
td.date,th.date{text-align:right;white-space:nowrap;width:1%}
.rowbtn{background:none;border:0;color:#e0e0e0;font-weight:500;cursor:pointer;padding:0;text-align:left}
.rowbtn:hover{color:var(--accent);text-decoration:none}
tbody tr.pin{background:linear-gradient(90deg,#1a0000,#0a0a0c)}
tbody tr.pin td{color:var(--accent);font-weight:600}

/* ================= UI ELEMENTS ================= */
.btn{background:#111;border:1px solid #333;padding:6px 12px;border-radius:2px;cursor:pointer;color:#ccc;font-size:12px;font-weight:500;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn:hover{background:#222;border-color:#555;color:#fff}
.btn.primary{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:700}
.btn.primary:hover{background:var(--accent);color:#fff}
.btn.danger{color:var(--err);border-color:#500}
.btn.small{padding:4px 8px;font-size:11px}
.btn:disabled{opacity:.5;cursor:default}
.search{text-align:center;margin:20px 0}
.sf{display:flex;justify-content:center;gap:8px}
.sf input{width:300px;padding:8px 12px;background:#111;border:1px solid #222}
.sf button{padding:8px 16px;background:#222;border:1px solid #333;color:#fff;cursor:pointer}
.count{font-size:12px;color:#666;margin-top:10px}
.pager{display:flex;justify-content:center;gap:6px;margin-top:20px}
.pager button{background:#111;border:1px solid #333;padding:6px 12px;cursor:pointer;color:#888;font-family:var(--font-mono)}
.pager button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Auth */
.auth{max-width:400px;margin:40px auto;background:#0a0a0c;border:1px solid #222;padding:24px;display:flex;flex-direction:column;gap:16px;animation:slideDown .4s ease}
.auth label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#888}
.auth input{padding:10px;background:#000;border:1px solid #333;border-radius:2px}
.auth .switch{text-align:center;font-size:12px;color:#666}
.auth .switch button{background:none;border:0;color:var(--accent);cursor:pointer}

/* ================= NEW PROFILE UI ================= */
.profile-container { background: #0d0d0d; border: 1px solid #222; border-radius: 6px; overflow: hidden; margin-bottom: 20px; }
.profile-banner { width: 100%; height: 220px; background: #1a1a1a; position: relative; }
.profile-banner img { width: 100%; height: 100%; object-fit: cover; }
.profile-main { display: flex; gap: 20px; padding: 0 20px; margin-top: -40px; position: relative; align-items: flex-start; }
.profile-avatar { width: 110px; height: 110px; border-radius: 4px; background: #222; border: 2px solid #0d0d0d; overflow: hidden; flex-shrink: 0; display: grid; place-items: center; font-size: 36px; font-weight: 700; color: var(--accent); }
.profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile-details { flex: 1; display: flex; flex-direction: column; gap: 6px; padding-top: 45px; }
.profile-name-row { display: flex; justify-content: space-between; align-items: center; }
.profile-username { font-size: 22px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 8px; }
.profile-stats-small { font-size: 13px; color: #888; }
.profile-stats-small b { color: #fff; font-weight: 600; }
.btn-follow { background: #222; border: 1px solid #333; color: #ccc; padding: 6px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: all .2s; }
.btn-follow:hover { background: #333; color: #fff; }

.profile-table { width: 100%; margin-top: 20px; background: #0d0d0d; border: 1px solid #222; border-radius: 6px; border-collapse: collapse; }
.profile-table td { padding: 16px 20px; border-bottom: 1px solid #222; font-size: 14px; color: #888; }
.profile-table td:last-child { text-align: right; color: #fff; font-weight: 500; }

.profile-private-box { background: #0d0d0d; border: 1px solid #222; border-radius: 6px; padding: 40px 20px; text-align: center; color: #ccc; margin-top: 20px; }
.profile-private-box b { color: #fff; }

/* Threads & Chats */
.post{display:grid;grid-template-columns:140px minmax(0,1fr);background:#0a0a0c;border:1px solid #1a1a1a;margin-bottom:10px;animation:fadeIn .3s ease}
.post .who{padding:16px;border-right:1px solid #1a1a1a;background:#111;display:flex;flex-direction:column;gap:8px}
.post .body{padding:16px;min-width:0}
.post .meta{font-size:11px;color:#555;margin-bottom:8px;font-family:var(--font-mono);display:flex;justify-content:space-between}
.post .text{white-space:pre-wrap;margin:0;line-height:1.6;overflow-wrap:anywhere}
.post .attach img{max-width:100%;border-radius:2px;margin-top:10px;border:1px solid #222;max-height:300px;object-fit:contain;cursor:pointer}
.avatar{width:40px;height:40px;background:#222;display:grid;place-items:center;font-weight:700;color:#aaa;border-radius:4px;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.chatwin{background:#0a0a0c;border:1px solid #222;min-height:300px;max-height:60vh;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:16px;animation:fadeIn .4s ease}
.chatmsg{display:grid;grid-template-columns:36px 1fr;gap:12px}
.chatmsg .bub{background:#111;border:1px solid #222;padding:10px 14px;border-radius:4px}
.chatmsg.self .bub{border-color:var(--accent-dim);background:linear-gradient(180deg,#111,#1a0000)}
.chatmsg .txt{white-space:pre-wrap;margin:0;font-size:13px;line-height:1.5}
.chatmsg .top{display:flex;gap:8px;font-size:11px;color:#666;margin-bottom:6px;font-family:var(--font-mono);align-items:center}
.compose{background:#0a0a0c;border:1px solid #222;padding:16px;display:flex;flex-direction:column;gap:12px}
.compose input,.compose textarea{padding:10px;background:#000;border:1px solid #333}
.compose textarea{min-height:100px;resize:vertical}

/* Nick Decors */
.nick-prefix{font-size:11px;font-weight:700;margin-right:4px}
.prefix-owner{color:#ff0} .prefix-admin{color:var(--accent)} .prefix-moderator{color:#0ff}
.nick-glow.glow-red{color:var(--accent);text-shadow:0 0 5px rgba(255,0,0,0.5)} 
.nick-glow.glow-gold{color:#f5b842;text-shadow:0 0 5px rgba(245,184,66,0.5)}
.nick-glow.glow-purple{color:#b870ff;text-shadow:0 0 5px rgba(184,112,255,0.5)}
.nick-media{width:16px;height:16px;vertical-align:-3px;margin-right:4px;border-radius:2px;object-fit:cover}

/* Lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:grid;place-items:center;z-index:999;cursor:zoom-out}
.lightbox img{max-width:90vw;max-height:90vh;border:1px solid #333}

@media (max-width:700px){
  .nav-in{gap:8px}.nav .who .who-name{display:none}
  .post{grid-template-columns:1fr}
  .profile-head-inner{flex-direction:column;align-items:center;text-align:center;margin-top:-50px}
  .profile-info{align-items:center}
  .hero-art{ font-size: 6px; text-shadow: 0 0 4px rgba(255, 0, 0, 0.6); }
  .profile-main { flex-direction: column; align-items: center; margin-top: -50px; }
  .profile-details { padding-top: 10px; align-items: center; }
  .profile-name-row { flex-direction: column; gap: 10px; }
  .profile-table td { padding: 12px; }
}
</style>

<script>
// ================= CONFIG & INIT =================
const firebaseConfig = {
  apiKey: "AIzaSyDEndaUeUIw_b7iPMvw63JLqz7oNl0-8Qg",
  authDomain: "tdel-45a78.firebaseapp.com",
  databaseURL: "https://tdel-45a78-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tdel-45a78",
  storageBucket: "tdel-45a78.firebasestorage.app",
  messagingSenderId: "246430149246",
  appId: "1:246430149246:web:a6a5802ff2f6166a70862f"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const fbGet = p => db.ref(p).once('value').then(s => s.exists() ? s.val() : null);
const fbSet = (p,v) => db.ref(p).set(v);
const fbUpdate = (p,v) => db.ref(p).update(v);
const fbRemove = (p) => db.ref(p).remove();

// ================= TRANSLATIONS =================
const I18N = {
  ru: {
    home:'Главная', chats:'Чаты', users:'Юзеры', admin:'Админка', new_topic:'Новая тема', rights:'Все права защищены',
    search_paste:'Search for by topics', title:'Заголовок', comments:'Комменты', views:'Просмотры', author:'Автор', date:'Дата',
    login:'Войти', reg:'Регистрация', logout:'Выйти', nick:'Никнейм', pass:'Пароль', create_acc:'Создать аккаунт', no_acc:'Нет аккаунта?', has_acc:'Есть аккаунт?',
    send:'Отправить', save:'Сохранить', cancel:'Отмена', msg:'Написать ЛС', edit_prof:'Редактировать профиль',
    bio:'О себе', avatar:'Аватар', banner:'Баннер', emoji:'Смайлик', write_msg:'Написать...', enter_to_write:'Войдите, чтобы писать', no_chats:'Нет чатов', new_chat:'Название нового чата', anonymous:'Аноним'
  },
  en: {
    home:'Home', chats:'Chats', users:'Users', admin:'Admin', new_topic:'New Topic', rights:'All rights reserved',
    search_paste:'Search for by topics', title:'Title', comments:'Comments', views:'Views', author:'Author', date:'Added',
    login:'Login', reg:'Register', logout:'Logout', nick:'Nickname', pass:'Password', create_acc:'Create account', no_acc:'No account?', has_acc:'Have an account?',
    send:'Send', save:'Save', cancel:'Cancel', msg:'Message', edit_prof:'Edit Profile',
    bio:'Bio', avatar:'Avatar', banner:'Banner', emoji:'Emoji', write_msg:'Write...', enter_to_write:'Login to write', no_chats:'No chats', new_chat:'New chat name', anonymous:'Anonymous'
  }
};
let currentLang = localStorage.getItem('60_lang') || 'ru';
function t(key) { return I18N[currentLang][key] || key; }
function setLang(l) {
  currentLang = l;
  localStorage.setItem('60_lang', l);
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if(I18N[l][key]) el.textContent = I18N[l][key];
  });
  document.getElementById('btn-ru').className = l === 'ru' ? 'active' : '';
  document.getElementById('btn-en').className = l === 'en' ? 'active' : '';
  document.getElementById('global-search').placeholder = l === 'ru' ? 'Поиск...' : 'Search...';
  render();
}

// ================= STATE =================
const state = {
  view: 'list', authMode: 'login', open: null, threads: [], user: null,
  users: {}, chats: {}, chatId: null, dms: {}, dmId: null, dmTarget: '',
  profileUser: null, profileEdit: false, profileDraft: null,
  isAdmin: false, isOwnerFlag: false, _busy: false,
  page: 1, itemsPerPage: 10
};

const OWNERS = ['m4lm0v','crollow','himical'];
const CUSTOM_EMOJIS = ['💀','🔥','⚡','🩸','⛧','🦇','🕷️','🕸️','☠️','🎯','🔪','🗡️','⚔️','🧨','💣','🦅','🐺','👁️','🔮','🧿'];

// ================= UTILS =================
function el(tag, attrs, kids) {
  const e = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k === 'class') e.className = attrs[k];
    else if(k === 'text') e.textContent = attrs[k];
    else if(k === 'html') e.innerHTML = attrs[k];
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for(const c of (kids||[])) if(c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  return e;
}
const fmtTime = ts => ts ? new Date(ts).toLocaleDateString(currentLang==='ru'?'ru-RU':'en-GB',{day:'numeric',month:'short',year:'numeric'}) : '—';
const safeMediaUrl = u => (!u || /^javascript:/i.test(u)) ? '' : u;
const currentIsAdmin = () => state.user && (state.user.owner || state.user.role === 'admin' || state.user.role === 'moderator');

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const scale = Math.min(1, 1000/Math.max(w,h));
        w = Math.round(w*scale); h = Math.round(h*scale);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        let q = 0.8, url = c.toDataURL('image/jpeg', q);
        while(url.length * 0.75 > 200000 && q > 0.1){ q -= 0.1; url = c.toDataURL('image/jpeg', q); }
        resolve(url);
      };
      img.onerror = () => reject(new Error('Ошибка картинки'));
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function openLightbox(url) {
  const lb = el('div', {class:'lightbox'}, [el('img', {src: url})]);
  lb.onclick = () => lb.remove();
  document.body.appendChild(lb);
}

// ================= USER HELPERS =================
// Если база хранит записи под ником (а не UID), эта функция найдет их
function getUserRecord(uidOrNick) {
  if (!uidOrNick) return null;
  if (state.users[uidOrNick]) return state.users[uidOrNick];
  // Ищем по нику, если uid не совпал
  return Object.values(state.users).find(u => u.nick && u.nick.toLowerCase() === String(uidOrNick).toLowerCase());
}

function getNickDisplay(uid, fallbackNick) {
  const u = getUserRecord(uid);
  
  // Выводим фолбек (сохраненное имя), если профиль не найден
  if(!u) {
    return el('span', {text: fallbackNick || 'User', style:'color:#aaa'});
  }

  let prefix = '';
  if(u.owner) prefix = el('span', {class:'nick-prefix prefix-owner', text:'[Founder]'});
  else if(u.role === 'admin') prefix = el('span', {class:'nick-prefix prefix-admin', text:'[Admin]'});
  else if(u.role === 'moderator') prefix = el('span', {class:'nick-prefix prefix-moderator', text:'[Mod]'});

  const color = u.profile?.color || '';
  const span = el('span', {class: `nick-glow glow-${color}`, text: u.nick || 'User'});
  
  const wrap = el('span', {style:'display:inline-flex;align-items:center;gap:4px'});
  if(prefix) wrap.appendChild(prefix);
  if(u.profile?.mediaUrl) wrap.appendChild(el('img', {class:'nick-media', src: safeMediaUrl(u.profile.mediaUrl)}));
  wrap.appendChild(span);
  if(u.profile?.emojis?.[0]) wrap.appendChild(el('span', {text: u.profile.emojis[0], style:'margin-left:2px'}));
  
  wrap.style.cursor = 'pointer';
  wrap.onclick = (e) => { e.stopPropagation(); state.view = 'profile'; state.profileUser = u.uid || uid; render(); };
  return wrap;
}

function getAvatar(uid, size=40) {
  const u = getUserRecord(uid);
  const av = el('div', {class:'avatar', style:`width:${size}px;height:${size}px;font-size:${size*0.4}px`});
  if(u && u.profile?.avatar) av.appendChild(el('img', {src: safeMediaUrl(u.profile.avatar)}));
  else av.textContent = (u?.nick || '?').charAt(0).toUpperCase();
  return av;
}

// ================= VIEW: AUTH =================
function authView() {
  const isLogin = state.authMode === 'login';
  const err = el('div', {class:'err'});
  const nickInp = el('input', {type:'text', placeholder:t('nick'), required:'required', maxlength:'15', style:'font-family:var(--font-mono)'});
  const passInp = el('input', {type:'password', placeholder:t('pass')+' (мин. 6)', required:'required', minlength:'6'});

  const fields = [ 
    el('label', null, [t('nick') + ' (логин)', nickInp]),
    el('label', null, [t('pass'), passInp])
  ];

  return [el('form', {class:'auth', onsubmit: async e => {
    e.preventDefault();
    if(state._busy) return; state._busy = true; err.textContent = '';
    
    const nick = nickInp.value.trim().replace(/[^a-zA-Z0-9_]/g, '');
    if(nick.length < 3) { err.textContent = 'Ник от 3 символов (A-Z, 0-9, _)'; state._busy = false; return; }
    
    const fakeEmail = nick.toLowerCase() + '@60tdel.local';

    try {
      if(isLogin) {
        await auth.signInWithEmailAndPassword(fakeEmail, passInp.value);
      } else {
        const cred = await auth.createUserWithEmailAndPassword(fakeEmail, passInp.value);
        const uid = cred.user.uid;
        // ВАЖНО: Сохраняем профиль по UID
        await fbSet('users/' + uid, {
          uid, email: fakeEmail, nick, role: 'user', owner: OWNERS.includes(nick.toLowerCase()), created: Date.now(),
          profile: { avatar: '', banner: '', bio: '', color: '', prefix: '', emojis: [], mediaUrl: '' }
        });
      }
      state.view = 'list'; render();
    } catch(ex) {
      let msg = ex.message;
      if(ex.code === 'auth/wrong-password' || ex.code === 'auth/user-not-found' || ex.code === 'auth/invalid-credential') msg = 'Неверный ник или пароль';
      if(ex.code === 'auth/email-already-in-use') msg = 'Этот ник уже занят';
      if(ex.code === 'auth/weak-password') msg = 'Пароль слишком простой';
      err.textContent = msg;
    } finally { state._busy = false; }
  }}, [
    el('h2', {text: isLogin ? t('login') : t('reg'), style:'color:#fff;text-align:center'}),
    ...fields, err,
    el('div', {style:'justify-content:center; display:flex'}, [el('button', {class:'btn primary', type:'submit', text: isLogin ? t('login') : t('create_acc'), style:'padding:10px 20px;width:100%'})]),
    el('div', {class:'switch'}, [isLogin ? t('no_acc')+' ' : t('has_acc')+' ', el('button', {type:'button', text: isLogin ? t('reg') : t('login'), onclick: () => { state.authMode = isLogin ? 'register' : 'login'; render(); }})])
  ])];
}

        }}),
        el('button', {class:'btn', text:t('cancel'), onclick:() => { state.profileEdit = false; render(); }})

// ================= ROUTER & RENDER =================
function render() {
  const app = document.getElementById('app');
  app.replaceChildren();
  
  const who = document.getElementById('who');
  who.replaceChildren();
  if(state.user) {
    who.appendChild(el('span', {text:(currentLang==='ru'?'Привет, ':'Hello, '), class:'who-name'}));
    who.appendChild(getNickDisplay(state.user.uid));
    who.appendChild(el('button', {text:t('logout'), onclick:() => auth.signOut()}));
  } else {
    who.appendChild(el('button', {text:t('login'), onclick:() => { state.view='auth'; state.authMode='login'; render(); }}));
  }

  document.getElementById('nav-admin').style.display = currentIsAdmin() ? '' : 'none';

  let nodes = [];
  try {
    if(state.view === 'auth') nodes = authView();
    else if(state.view === 'thread') nodes = threadView();
    else if(state.view === 'chatList') nodes = chatListView();
    else if(state.view === 'chat') nodes = chatView();
    else if(state.view === 'dm') nodes = dmView();
    else if(state.view === 'profile') nodes = profileView();
    else if(state.view === 'members') nodes = membersView();
    else nodes = listView(); 
  } catch(e) {
    console.error(e);
    nodes = [el('div', {style:'color:red;padding:20px', text:'Ошибка рендера: ' + e.message})];
  }

  nodes.forEach(n => { if(n) app.appendChild(n); });
}

window.router = {
  home: () => { state.view='list'; state.open=null; render(); },
  goAuth: () => { state.view='auth'; state.authMode='login'; render(); },
  goNew: () => { 
    if(!state.user) { state.view='auth'; state.authMode='login'; render(); return; } 
    const title = prompt(currentLang==='ru'?'Заголовок темы:':'Topic title:');
    if(!title) return;
    const content = prompt(currentLang==='ru'?'Текст темы:':'Topic text:');
    if(!content) return;
    fbSet('threads/t_' + Date.now(), {
      title, uid: state.user.uid, author: state.users[state.user.uid]?.nick, date: Date.now(), views: 0, pin: false,
      posts: { p0: { uid: state.user.uid, author: state.users[state.user.uid]?.nick, text: content, date: Date.now() } }
    }).then(() => render());
  },
  goChats: () => { state.view='chatList'; render(); },
  goMembers: () => { state.view='members'; render(); },
  goAdmin: () => { state.view='admin'; render(); }
};

// ================= FIREBASE SYNC =================

db.ref('users').on('value', snap => {
  state.users = snap.val() || {};
  render();
});

db.ref('threads').on('value', snap => {
  const data = snap.val() || {};
  state.threads = Object.keys(data).map(k => ({ id: k, ...data[k] })).sort((a,b) => (b.date||0) - (a.date||0));
  if(state.view === 'list' || state.view === 'thread' || state.view === 'profile') render();
});

db.ref('chats').on('value', snap => {
  const data = snap.val() || {};
  state.chats = Object.keys(data).reduce((acc, key) => {
    acc[key] = { id: key, ...data[key] };
    return acc;
  }, {});
  
  if(state.view.startsWith('chat')) render();
});

db.ref('dms').on('value', snap => {
  state.dms = snap.val() || {};
  if(state.view.startsWith('dm')) render();
});

auth.onAuthStateChanged(async u => {
  if(u) {
    // Ищем профиль по UID. Если не нашли — создаем
    let rec = await fbGet('users/' + u.uid);
    
    // Если профиля нет, но раньше сохраняли под ником, попробуем найти по нику
    if(!rec) {
      const defaultNick = u.email.split('@')[0];
      const usersSnap = await fbGet('users');
      if(usersSnap) {
         const foundByNick = Object.values(usersSnap).find(user => user.nick && user.nick.toLowerCase() === defaultNick.toLowerCase());
         if(foundByNick) {
           rec = foundByNick;
           // Мигрируем запись на UID
           await fbSet('users/' + u.uid, { ...rec, uid: u.uid });
         }
      }
    }

    if(rec) {
      state.user = { uid: u.uid, email: u.email, nick: rec.nick, owner: rec.owner, role: rec.role };
    } else {
      const defaultNick = u.email.split('@')[0] || 'User_'+u.uid.slice(0,4);
      await fbSet('users/' + u.uid, { uid: u.uid, email: u.email, nick: defaultNick, role: 'user', owner: false, created: Date.now(), profile: {} });
      state.user = { uid: u.uid, email: u.email, nick: defaultNick };
    }
  } else {
    state.user = null;
  }
  render();
});

// INIT
setLang(currentLang);
render();

</script>
</body>
</html>
