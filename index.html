<style>
*{box-sizing:border-box}
:root{
  --bg:#000; --bg-2:#0a0a0c; --surface:#121215; --surface-2:#1a1a1f;
  --line:#2a2a30; --line-2:#3a3a42; --fg:#e0e0e0; --muted:#707075;
  --accent:#ff0000; --accent-dim:#440000; --err:#ff5a5a;
  --radius:4px; --font-body:"Inter",sans-serif; --font-mono:"IBM Plex Mono",monospace; --font-pixel:"VT323",monospace;
  color-scheme:dark;
}
html{background:var(--bg);scroll-behavior:smooth}
body{background:var(--bg); color:var(--fg); font-family:var(--font-body); font-size:14px; line-height:1.5; margin:0; min-height:100vh;}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius)}
h1,h2,h3{margin:0;font-weight:600}
.muted{color:var(--muted)}
.err{color:var(--err);font-size:12px;min-height:16px;margin-top:4px}
.conn-warn{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#140808;border:1px solid #5a1a1a;color:#ff9a9a;padding:12px 16px;border-radius:4px;font-size:13px}
.spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;display:inline-block;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.anim-fade { animation: fadeIn 0.4s ease forwards; }

.nav{background:#000;border-bottom:1px solid #1a1a1a;padding:0 20px;position:sticky;top:0;z-index:20}
.nav-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;min-height:50px;flex-wrap:wrap}
.brand{font-weight:800;font-size:20px;color:#fff;cursor:pointer;display:flex;align-items:center}
.brand span{color:var(--accent)}
.nav button.link{background:none;border:0;color:#888;font-size:13px;cursor:pointer;padding:4px 0;transition:color .2s}
.nav button.link:hover,.nav button.link[aria-current="page"]{color:var(--accent)}
.nav .who{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:#888;font-family:var(--font-mono)}
.nav .who button{background:none;border:0;color:var(--accent);cursor:pointer;font-weight:600}
.nav-search{position:relative;flex:1;max-width:300px}
.nav-search input{width:100%;padding:6px 10px;background:#111;border:1px solid #222;font-size:12px}
.lang-switch{display:flex;border:1px solid #333;border-radius:4px;overflow:hidden;margin-left:10px}
.lang-switch button{background:#111;color:#888;border:0;padding:2px 8px;font-size:11px;cursor:pointer}
.lang-switch button.active{background:var(--accent);color:#fff;font-weight:bold}
.wrap{max-width:1100px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:20px;min-height:70vh}
.footer{text-align:center;padding:30px;color:#444;font-size:12px;border-top:1px solid #1a1a1a;margin-top:40px}

.hero{text-align:center;padding:30px 0 20px; overflow:hidden;}
.hero-art {font-family: var(--font-mono);font-size: 10px;line-height: 1.05;color: var(--accent);white-space: pre;display: inline-block;text-align: left;margin-bottom: 20px;text-shadow: 0 0 8px rgba(255, 0, 0, 0.6);}
.hero .links{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px;margin-bottom:20px}
.hero .links a{color:var(--accent)}

.tablebox{background:#0a0a0c;border:1px solid #1a1a1a;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid #1a1a1a}
thead th{background:#111;color:#666;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
tbody tr:hover{background:#111}
td.title{width:100%}
td.num,th.num{text-align:center;width:1%;white-space:nowrap}
td.date,th.date{text-align:right;white-space:nowrap;width:1%}
tbody tr.pin{background:linear-gradient(90deg,#1a0000,#0a0a0c)}
tbody tr.pin td{color:var(--accent);font-weight:600}

.btn{background:#111;border:1px solid #333;padding:6px 12px;border-radius:2px;cursor:pointer;color:#ccc;font-size:12px;font-weight:500;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn:hover{background:#222;border-color:#555;color:#fff}
.btn.primary{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:700}
.btn.primary:hover{background:var(--accent);color:#fff}
.btn.danger{color:var(--err);border-color:#500}
.btn.small{padding:4px 8px;font-size:11px}
.btn:disabled{opacity:.5;cursor:default}
.search{text-align:center;margin:20px 0}
.sf{display:flex;justify-content:center;gap:8px}
.sf input{width:300px;padding:8px 12px;background:#111;border:1px solid #222}
.sf button{padding:8px 16px;background:#222;border:1px solid #333;color:#fff;cursor:pointer}
.count{font-size:12px;color:#666;margin-top:10px}
.pager{display:flex;justify-content:center;gap:6px;margin-top:20px}
.pager button{background:#111;border:1px solid #333;padding:6px 12px;cursor:pointer;color:#888;font-family:var(--font-mono)}
.pager button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.auth{max-width:400px;margin:40px auto;background:#0a0a0c;border:1px solid #222;padding:24px;display:flex;flex-direction:column;gap:16px}
.auth label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#888}
.auth input{padding:10px;background:#000;border:1px solid #333}
.auth .switch{text-align:center;font-size:12px;color:#666}
.auth .switch button{background:none;border:0;color:var(--accent);cursor:pointer}

.profile-container { background: #0d0d0d; border: 1px solid #222; border-radius: 6px; overflow: hidden; margin-bottom: 20px; }
.profile-banner { width: 100%; height: 220px; background: #1a1a1a; position: relative; }
.profile-banner img { width: 100%; height: 100%; object-fit: cover; }
.profile-main { display: flex; gap: 20px; padding: 0 20px; margin-top: -40px; position: relative; align-items: flex-start; }
.profile-avatar { width: 110px; height: 110px; border-radius: 4px; background: #222; border: 2px solid #0d0d0d; overflow: hidden; flex-shrink: 0; display: grid; place-items: center; font-size: 36px; font-weight: 700; color: var(--accent); }
.profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile-details { flex: 1; display: flex; flex-direction: column; gap: 6px; padding-top: 45px; }
.profile-name-row { display: flex; justify-content: space-between; align-items: center; }
.profile-username { font-size: 22px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 8px; }
.profile-stats-small { font-size: 13px; color: #888; }
.profile-stats-small b { color: #fff; font-weight: 600; }
.btn-follow { background: #222; border: 1px solid #333; color: #ccc; padding: 6px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; }
.btn-follow:hover { background: #333; color: #fff; }
.profile-table { width: 100%; margin-top: 20px; background: #0d0d0d; border: 1px solid #222; border-radius: 6px; border-collapse: collapse; }
.profile-table td { padding: 16px 20px; border-bottom: 1px solid #222; font-size: 14px; color: #888; }
.profile-table td:last-child { text-align: right; color: #fff; font-weight: 500; }
.profile-private-box { background: #0d0d0d; border: 1px solid #222; border-radius: 6px; padding: 40px 20px; text-align: center; color: #ccc; margin-top: 20px; }
.profile-private-box b { color: #fff; }

.post{display:grid;grid-template-columns:140px minmax(0,1fr);background:#0a0a0c;border:1px solid #1a1a1a;margin-bottom:10px}
.post .who{padding:16px;border-right:1px solid #1a1a1a;background:#111;display:flex;flex-direction:column;gap:8px}
.post .body{padding:16px;min-width:0}
.post .meta{font-size:11px;color:#555;margin-bottom:8px;font-family:var(--font-mono);display:flex;justify-content:space-between}
.post .text{white-space:pre-wrap;margin:0;line-height:1.6;overflow-wrap:anywhere}
.post .attach img{max-width:100%;border-radius:2px;margin-top:10px;border:1px solid #222;max-height:300px;object-fit:contain;cursor:pointer}
.avatar{width:40px;height:40px;background:#222;display:grid;place-items:center;font-weight:700;color:#aaa;border-radius:4px;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.chatwin{background:#0a0a0c;border:1px solid #222;min-height:300px;max-height:60vh;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.chatmsg{display:grid;grid-template-columns:36px 1fr;gap:12px}
.chatmsg .bub{background:#111;border:1px solid #222;padding:10px 14px;border-radius:4px}
.chatmsg.self .bub{border-color:var(--accent-dim);background:linear-gradient(180deg,#111,#1a0000)}
.chatmsg .txt{white-space:pre-wrap;margin:0;font-size:13px;line-height:1.5}
.chatmsg .top{display:flex;gap:8px;font-size:11px;color:#666;margin-bottom:6px;font-family:var(--font-mono);align-items:center}
.compose{background:#0a0a0c;border:1px solid #222;padding:16px;display:flex;flex-direction:column;gap:12px}
.compose input,.compose textarea{padding:10px;background:#000;border:1px solid #333}
.compose textarea{min-height:100px;resize:vertical}

.nick-prefix{font-size:11px;font-weight:700;margin-right:4px}
.prefix-owner{color:#ff0} .prefix-admin{color:var(--accent)} .prefix-moderator{color:#0ff}
.nick-media{width:16px;height:16px;vertical-align:-3px;margin-right:4px;border-radius:2px;object-fit:cover}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:grid;place-items:center;z-index:999;cursor:zoom-out}
.lightbox img{max-width:90vw;max-height:90vh;border:1px solid #333}

@media (max-width:700px){
  .nav-in{gap:8px}.nav .who .who-name{display:none}
  .post{grid-template-columns:1fr}
  .hero-art{ font-size: 6px; }
  .profile-main { flex-direction: column; align-items: center; margin-top: -50px; }
  .profile-details { padding-top: 10px; align-items: center; }
  .profile-name-row { flex-direction: column; gap: 10px; }
  .profile-table td { padding: 12px; }
}

.chatwin{max-height:60vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.compose{display:flex;flex-direction:column;gap:8px}
.compose .bar{display:flex;gap:8px;align-items:center}
.compose .bar .primary{margin-left:auto}
.emo{flex-wrap:wrap;gap:8px;background:#0a0a0c;border:1px solid #222;padding:8px;font-size:22px}
.emo span{cursor:pointer}
.prev{display:flex;gap:8px;align-items:flex-start}
.prev img,.msgimg{max-width:240px;max-height:240px;border:1px solid #222;display:block;margin-top:8px}
.bio{background:#0d0d0d;border:1px solid #222;padding:14px;white-space:pre-wrap;border-radius:4px}
.tlist a{display:block;padding:7px 0;cursor:pointer;border-bottom:1px solid #1a1a1a;color:#ddd}
.tlist a:hover{color:var(--accent);text-decoration:none}
.pstats{display:flex;gap:18px;flex-wrap:wrap;color:#888;font-size:13px;margin-top:6px}
.pstats b{color:#fff}
video.nick-media{width:18px;height:18px}
.profile-banner img,.profile-avatar img{width:100%;height:100%;object-fit:cover;display:block}

.ed{background:#0b0b0d;border:1px solid #222;border-radius:8px;padding:22px;max-width:640px;display:grid;gap:20px;margin-top:20px}
.ed h3{margin:0;color:#fff}
.ed .cap{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#777;margin-bottom:8px;display:block}
.ed input[type=text],.ed textarea{width:100%;box-sizing:border-box}
.ed textarea{min-height:80px;resize:vertical}
.ed .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.ed-banner{height:110px;width:100%;background:#111;border:1px dashed #333;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#555;font-size:13px}
.ed-banner img{width:100%;height:100%;object-fit:cover}
.ed-ava{width:72px;height:72px;border-radius:50%;background:#111;border:1px dashed #333;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#555;font-size:11px;flex:none}
.ed-ava img{width:100%;height:100%;object-fit:cover}
.ed-media{min-width:40px;height:40px;background:#111;border:1px dashed #333;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#555;font-size:11px;padding:0 6px}
.ed-media .nick-media{width:28px;height:28px;object-fit:cover}
.ed .hint{color:#666;font-size:12px}
.ed .acts{display:flex;gap:10px;border-top:1px solid #1d1d1d;padding-top:16px}
.nick-glow{display:inline-flex;align-items:center;gap:2px;font-weight:600}
.glow-red{color:#ff5252;text-shadow:0 0 8px rgba(255,82,82,.8)}
.glow-blue{color:#5490ff;text-shadow:0 0 8px rgba(84,144,255,.8)}
.glow-green{color:#4dd47e;text-shadow:0 0 8px rgba(77,212,126,.8)}
.glow-purple{color:#b870ff;text-shadow:0 0 8px rgba(184,112,255,.8)}
.glow-gold{color:#f5b842;text-shadow:0 0 8px rgba(245,184,66,.8)}
.glow-pink{color:#ff70b8;text-shadow:0 0 8px rgba(255,112,184,.8)}
.shimmer{background:linear-gradient(90deg,#e8e8ec,#ff5a5a,#e8e8ec,#ff5a5a,#e8e8ec);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 3s linear infinite}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
.prefix-custom{color:#ccc}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid #333;cursor:pointer}
.dot.on{border-color:#fff}
.emg{display:flex;flex-wrap:wrap;gap:4px;max-height:130px;overflow-y:auto;padding:8px;border:1px solid #222;border-radius:6px;background:#0a0a0c}
.emg button{background:none;border:1px solid transparent;border-radius:4px;width:34px;height:34px;font-size:20px;cursor:pointer}
.emg button.on{border-color:var(--accent)}
.lock{opacity:.45;pointer-events:none}
.admin-tabs{display:flex;gap:4px;border-bottom:1px solid #222;margin:14px 0}
.admin-tabs button{background:none;border:0;border-bottom:2px solid transparent;color:#888;padding:10px 16px;cursor:pointer}
.admin-tabs button.active{color:#fff;border-bottom-color:var(--accent)}
.perk{display:flex;gap:10px;padding:12px 14px;border:1px solid #222;border-radius:6px;background:#0b0b0d;margin-bottom:8px}
.pricetag{display:inline-block;border:1px solid #f5b842;color:#f5b842;border-radius:20px;padding:4px 14px;margin:8px 0}
.tnav{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.tnav .navbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tnav .navbtns button{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phone-cell{display:flex;gap:6px;align-items:center}
.phone-cell .val{font-family:var(--font-mono);font-size:12px}
.create-chat{display:flex;gap:8px;margin-bottom:12px}
.create-chat input{flex:1;padding:8px 12px}

.np{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:0;border:1px solid #1a1a1a;background:#000;min-height:75vh}
.np-main{display:flex;flex-direction:column;min-width:0}
.np-editor{flex:1;width:100%;min-height:70vh;resize:none;border:0;border-radius:0;background:#000;color:#e0e0e0;padding:16px;font-family:var(--font-mono);font-size:13px;line-height:1.6;outline:none}
.np-count{font-family:var(--font-mono);font-size:11px;color:#555;padding:6px 16px;border-top:1px solid #1a1a1a}
.np-side{background:#0a0a0c;border-left:1px solid #1a1a1a;padding:14px;display:flex;flex-direction:column;gap:10px}
.np-art{margin:0;font-family:var(--font-mono);font-size:7.5px;line-height:1.1;color:var(--accent);text-shadow:0 0 8px rgba(255,0,0,.5);white-space:pre;overflow:hidden;text-align:left}
.np-hr{height:1px;background:#1d1d22;margin:2px 0}
.np-user{text-align:center;font-size:13px}
.np-side input[type=text]{width:100%;padding:8px 10px;background:#1a1a1f;border:1px solid #2a2a30;font-size:12px}
.np-row{display:flex;gap:8px}
.np-prev{display:flex;gap:8px;align-items:flex-start}
.np-prev img{max-width:100%;max-height:120px;border:1px solid #222}
.np-check{font-size:12px;color:#aaa;display:flex;align-items:center;gap:6px;cursor:pointer}
.np-send{width:100%;padding:8px}
.np-note{font-size:11px;color:#666;line-height:1.4}
@media (max-width:700px){
  .np{grid-template-columns:1fr}
  .np-side{border-left:0;border-top:1px solid #1a1a1a;order:-1}
  .np-editor{min-height:40vh}
  .np-art{font-size:6.5px}
}

.badge{display:inline-block;min-width:16px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center}
.badge:empty{display:none}
.quote{border-left:2px solid var(--accent);background:#140808;padding:4px 10px;margin:0 0 8px;font-size:12px;color:#aaa;cursor:pointer;border-radius:2px;overflow:hidden}
.quote b{color:#ddd;font-weight:600;display:block}
.qt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

.rbar .qt{flex:1}
.flash{animation:flash 1.7s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 2px var(--accent)}100%{box-shadow:0 0 0 2px transparent}}
.dmmsg{display:flex;flex-direction:column;max-width:80%;gap:2px}
.dmmsg.self{align-self:flex-end;align-items:flex-end}

.dmmsg.self .bub{border-color:var(--accent-dim);background:linear-gradient(180deg,#111,#1a0000);border-radius:10px 10px 2px 10px}
.dmmsg .top{display:flex;gap:8px;font-size:11px;color:#666;margin-bottom:4px;font-family:var(--font-mono);align-items:center;justify-content:space-between}
.dmmsg .txt{white-space:pre-wrap;margin:0;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
audio{max-width:100%;height:36px;margin-top:4px;display:block}
.rec{display:flex;align-items:center;gap:8px;color:var(--err);font-family:var(--font-mono);font-size:12px}
.rec i{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;z-index:1000;padding:16px}
.modal-box{background:#0b0b0d;border:1px solid #333;border-radius:8px;padding:20px;width:min(480px,100%);max-height:85vh;overflow:auto;display:grid;gap:12px}

.row-item .peer{display:flex;gap:10px;align-items:center;min-width:0}

// ужимаем картинку: max - сторона в пикселях, kb - предел размера
function compress(file, max, kb) {
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith('image/') || file.size > 10e6) return rej(new Error('нужна картинка до 10 МБ'));
    const r = new FileReader();
    r.onerror = () => rej(new Error('не прочиталось'));
    r.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('битая картинка'));
      img.onload = () => {
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        let q = 0.85, u = c.toDataURL('image/jpeg', q);
        while (u.length * 0.75 > kb * 1000 && q > 0.1) { q -= 0.1; u = c.toDataURL('image/jpeg', q); }
        res(u);
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function ding(kind) {
  if (!SND.on || !_ac || _ac.state !== 'running') return;
  const notes = kind === 'dm' ? [1046, 1397] : [880, 1319];
  const t0 = _ac.currentTime;
  notes.forEach((f, i) => {
    const o = _ac.createOscillator(), g = _ac.createGain();
    o.type = 'sine'; o.frequency.value = f;
    const st = t0 + i * 0.12;
    g.gain.setValueAtTime(0.0001, st);
    g.gain.exponentialRampToValueAtTime(0.25, st + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, st + 0.3);
    o.connect(g); g.connect(_ac.destination);
    o.start(st); o.stop(st + 0.34);
  });
}

function authView() {

  const form = el('form', {class:'auth', onsubmit: async e => {

    if (S.busy) return;

    const name = n.value.trim().replace(/[^a-zA-Z0-9_]/g, '');
    if (name.length < 3) {
      err.textContent = 'Ник от 3 символов';
      S.busy = false;
      return;
    }
    if (!isLogin && p.value.length < 8) {
      err.textContent = 'Пароль минимум 8 символов';
      S.busy = false;
      return;
    }
    const email = name.toLowerCase() + '@60tdel.local';

    try {
      if (isLogin) {
        await auth.signInWithEmailAndPassword(email, p.value);
      } else {
        S.registering = true;
        const c = await auth.createUserWithEmailAndPassword(email, p.value);
        await c.user.updateProfile({displayName: name});
        let ok = false;
        try { ok = await claimNick(name, c.user.uid); } catch (x) { console.error(x); }
        if (!ok) {
          await c.user.delete().catch(() => {});
          S.registering = false; S.busy = false;
          err.textContent = 'Ник занят';
          return;
        }
        try {
          await set('users/' + c.user.uid, {uid: c.user.uid, nick: name, role:'user', owner:false, premium:false, created: TS, profile:{}});
        } catch (ex) {
          console.error('не записался юзер в базу', ex);

        await boot(auth.currentUser);
      }
      S.view = 'list';
      draw();
    } catch (ex) {
      S.registering = false;
      console.error(ex);
      const code = ex.code || '';
      let m = ex.message;
      if (/wrong-password|user-not-found|invalid-credential|invalid-login/.test(code)) m = 'Неверный ник или пароль';
      else if (code.includes('email-already')) m = 'Ник занят';
      else if (code.includes('weak-password')) m = 'Слишком простой пароль';
      else if (code.includes('too-many-requests')) m = 'Слишком много попыток, подожди пару минут';
      else if (code.includes('network')) m = 'Нет связи с сервером';
      else m = m + ' (' + code + ')';
      err.textContent = m;
    }
    S.busy = false;
  }}, [
    el('h2', {text: isLogin ? t('auth') : t('reg_title'), style:'color:#fff;text-align:center'}),

  return [form];
}

const EMO = ['😀','😂','😍','😎','😭','😡','👍','👎','🔥','💀','❤️','🎉','🤔','😱','🙏','👀'];

function composer(key, ph, onSend, opts) {
  opts = opts || {};
  let pic = null, busy = false, rp = null, vo = null, rec = null, timer = null, stream = null, chunks = [], t0 = 0, mime = '';
  const ta = el('textarea', {placeholder: ph, maxlength:'2000', rows:'2'});
  ta.value = S.drafts[key] || '';
  ta.oninput = () => { S.drafts[key] = ta.value; };
  const prev = el('div', {class:'prev'});
  const vbox = el('div', {class:'prev'});
  const rbar = el('div', {class:'rbar', style:'display:none'});
  const setReply = r => {
    rp = r; rbar.innerHTML = '';
    if (!r) { rbar.style.display = 'none'; return; }
    rbar.style.display = 'flex';
    rbar.append(el('span', {text:'↩ ' + r.nick + ':'}), el('span', {class:'qt', text: r.text || '…'}),
      el('button', {class:'btn small', type:'button', text:'✕', onclick: () => setReply(null)}));
    ta.focus();
  };
  COMP[key] = {setReply};

  const panel = el('div', {class:'emo', style:'display:none'}, EMO.map(e =>
    el('span', {text: e, onclick: () => { ta.value += e; S.drafts[key] = ta.value; ta.focus(); }})));
  const file = el('input', {type:'file', accept:'image/*', style:'display:none', onchange: async e => {
    const f = e.target.files[0];
    if (!f) return;
    try { pic = await compress(f, 900, 120); }
    catch (x) { alert('Не вышло: ' + x.message); return; }
    prev.innerHTML = '';
    prev.append(el('img', {src: pic}), el('button', {class:'btn small', type:'button', text:'✕', onclick: () => { pic = null; prev.innerHTML = ''; }}));
    file.value = '';
  }});

  // ---- голосовые ----
  const showVo = () => {
    vbox.innerHTML = '';
    if (vo) vbox.append(el('audio', {controls:'', src: vo.s}), el('span', {class:'muted', text: vo.d + ' c'}),
      el('button', {class:'btn small', type:'button', text:'✕', onclick: () => { vo = null; showVo(); }}));
  };
  function stopRec(cancel) {
    if (rec && rec.state === 'recording') { rec._cancel = !!cancel; rec.stop(); }
  }
  async function startRec() {
    if (rec) { stopRec(false); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder) { alert('Запись голоса не поддерживается в этом браузере'); return; }
    try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
    catch (e) { alert('Нет доступа к микрофону'); return; }
    mime = ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/mp4'].find(m => MediaRecorder.isTypeSupported(m)) || '';
    chunks = [];
    rec = new MediaRecorder(stream, mime ? {mimeType: mime, audioBitsPerSecond: 24000} : {audioBitsPerSecond: 24000});
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = async () => {
      clearInterval(timer);
      stream.getTracks().forEach(tr => tr.stop());
      const cancelled = rec && rec._cancel;
      const dur = Math.round((Date.now() - t0) / 1000);
      rec = null; vbox.innerHTML = '';
      if (cancelled || !chunks.length) return;
      const base = (mime || 'audio/webm').split(';')[0];
      const url = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(new Blob(chunks, {type: base})); });
      if (!okAud(url) || url.length > 500000) { alert('Слишком длинное сообщение'); return; }
      vo = {s: url, d: Math.max(1, Math.min(60, dur))};
      showVo();
    };
    rec.start();
    t0 = Date.now();
    const lbl = el('span', {text:'0:00'});
    vbox.innerHTML = '';
    vbox.append(el('div', {class:'rec'}, [el('i'), lbl]),
      el('button', {class:'btn small', type:'button', text:'⏹ Стоп', onclick: () => stopRec(false)}),
      el('button', {class:'btn small', type:'button', text:'✕', onclick: () => stopRec(true)}));
    timer = setInterval(() => {
      const sec = Math.floor((Date.now() - t0) / 1000);
      lbl.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
      if (sec >= 60) stopRec(false);
    }, 250);
  }

  async function send() {
    const text = ta.value.trim();
    if ((!text && !pic && !vo) || busy || rec) return;
    const now = Date.now();
    if (now - (S.lastSend[key] || 0) < 1500) return; // не чаще раза в 1.5 сек на поле
    S.lastSend[key] = now;
    busy = true;
    try {
      await onSend(text, pic, rp, vo);
      ta.value = ''; S.drafts[key] = ''; pic = null; vo = null; prev.innerHTML = ''; showVo(); setReply(null);
    } catch (x) { alert('Не отправилось: ' + x.message); }
    busy = false;
    ta.focus();
  }
  ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };

  return el('div', {class:'compose'}, [rbar, prev, vbox, ta, panel, el('div', {class:'bar'}, [
    el('button', {class:'btn small', type:'button', text:'😊', onclick: () => { panel.style.display = panel.style.display === 'none' ? 'flex' : 'none'; }}),
    el('button', {class:'btn small', type:'button', text:'📷', onclick: () => file.click()}),
    opts.voice ? el('button', {class:'btn small', type:'button', text:'🎤', title:'Записать голосовое', onclick: startRec}) : null,
    file,
    el('button', {class:'btn primary', type:'button', text: t('send'), onclick: send})
  ])]);
}

      const cur = usesOf(S.users[k] || {});
      if (cur.length >= 30) { err.textContent = 'Лимит — 30 юзов'; return; }
      if (cur.includes(name)) { err.textContent = 'Уже выдан этому человеку'; return; }

        if (!ok) { err.textContent = 'Этот юз уже занят'; return; }
        const taken = (S.users[k] || {}).uses || {};

        if (slot === null) { err.textContent = 'Лимит — 30 юзов'; return; }
        await db.ref('users/' + k + '/uses/' + slot).set(name);
        inp.value = '';
      } catch (e) { err.textContent = e.message; }
    };

      el('h3', {text:'💎 Юзы · ' + (u.nick || ''), style:'color:#fff'}),

      ]),

      iOwner

            db.ref('users/' + k + '/owner').set(!isOwn).catch(fail);
          })
        : el('span', {text: isOwn ? 'Да' : 'Нет'}),
      el('span', {style:'display:flex;gap:6px'}, [

        iOwner ? abtn('Удалить', 'danger', () => {

      ])

  const out = [
    el('div', {class:'profile-container'}, [banner, el('div', {class:'profile-main'}, [av, el('div', {class:'profile-details'}, [

        el('span', null, [el('b', {text: String(mine.length)}), ' тем']),
        el('span', null, [el('b', {text: String(posts)}), ' ответов'])

    ])])]),

      el('tr', null, [el('td', {text:'Username'}), el('td', {text:'@' + u.nick})]),
      el('tr', null, [el('td', {text:'Роль'}), el('td', {text: u.owner ? 'Founder' : (u.role || 'user')})]),
      el('tr', null, [el('td', {text:'Joined'}), el('td', {text: fmt(u.created)})]),
      ...(phoneOf(u) ? [el('tr', null, [el('td', {text:'Номер'}), el('td', {text: phoneOf(u)})])] : []),
      ...(usesOf(u).length ? [el('tr', null, [el('td', {text:'Юзы'}), el('td', null, [el('div', {class:'chips', style:'justify-content:flex-end'}, usesOf(u).map(x => el('span', {class:'chip', text:'💎 @' + x})))])])] : [])
    ])])

    out.push(el('div', {class:'tlist'}, mine.slice(0, 10).map(th => el('a', {text: th.title, onclick: () => { S.view = 'thread'; S.open = th.id; draw(); }}))));
  }

    const d = S.draft;
    const err = el('div', {class:'err'});
    const bPrev = el('div', {class:'ed-banner'});
    const aPrev = el('div', {class:'ed-ava'});
    const mPrev = el('div', {class:'ed-media'});

    function showPrev() {
      bPrev.innerHTML = ''; aPrev.innerHTML = ''; mPrev.innerHTML = '';
      if (okImg(d.banner)) bPrev.append(el('img', {src: d.banner})); else bPrev.textContent = 'Баннер не выбран';

      if (m) mPrev.append(m); else mPrev.textContent = 'нет';
    }
    const readUrl = f => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
    function fileBtn(text, accept, onFile) {

    }
    showPrev();

    const nIn = el('input', {type:'text', value: d.nick, maxlength:'15', oninput: e => { d.nick = e.target.value; }});
    const bIn = el('textarea', {maxlength:'300', placeholder:'Расскажите о себе', oninput: e => { d.bio = e.target.value; cnt.textContent = d.bio.length + '/300'; }});

      el('div', null, [el('span', {class:'cap', text:'О себе'}), bIn, cnt]),
      el('div', null, [el('span', {class:'cap', text:'Баннер'}), bPrev,

        el('div', {class:'hint', text:'Картинка или видео mp4/webm до 1 МБ'})]),

      el('div', {class:'acts'}, [

          if (d.prefix && !isStaff(S.user) && BAD_PREFIX.test(d.prefix)) { err.textContent = 'Этот префикс запрещён'; return; }
          const oldLow = (u.nick || '').toLowerCase();
          if (n.toLowerCase() !== oldLow) {

            if (busy) { err.textContent = 'Ник занят'; return; }

            try { ok = await claimNick(n, u.uid); } catch (x) { console.error(x); }

          try {

            if (n.toLowerCase() !== oldLow && !usesOf(u).includes(oldLow)) db.ref('nicks/' + oldLow).remove().catch(() => {});
            S.user.nick = n; S.edit = false; draw();
          } catch (x) { err.textContent = 'Не сохранилось: ' + x.message; }

function chatView() {
  const c = S.chats[S.chatId];
  if (!c) return [el('div', {text:'Не найдено'})];
  const win = el('div', {class:'chatwin'});
  let stick = true; // прилипать к низу

  S.fill = () => {
    const cc = S.chats[S.chatId];
    if (!cc) return;
    const old = win.scrollTop;
    const near = stick || win.scrollHeight - win.scrollTop - win.clientHeight < 80;
    win.innerHTML = '';
    Object.entries(cc.messages || {}).map(([key, m]) => ({...m, key})).sort((a, b) => a.date - b.date).forEach(m => {
      const mine = S.user && m.uid === S.user.uid;
      win.append(el('div', {class:'chatmsg' + (mine ? ' self' : ''), 'data-k': m.key}, [
        avatar(m.uid, 32),
        el('div', {class:'bub'}, [
          el('div', {class:'top'}, [nick(m.uid, m.author), el('span', {text: fmt(m.date) + (m.edited ? ' · изменено' : '')}),
            S.user ? replyBtn('c' + cc.id, m.key, m) : null,
            mine ? editBtn(m.key, m) : null,
            (mine || isAdmin()) ? el('button', {class:'btn small danger', text:'✕', onclick: () => { if (confirm('Удалить?')) del('chats/' + cc.id + '/messages/' + m.key); }}) : null]),
          quoteEl(cc.messages, m.reply),
          S.editing === m.key ? editBox('chats/' + cc.id + '/messages/' + m.key, m, 2000) : el('div', {class:'txt', text: m.text || ''}),
          picEl(m.media)
        ])
      ]));
    });
    win.scrollTop = near ? win.scrollHeight : old;
    stick = false;
    doJump(win);
  };
  const wantJump = !!S.jump;
  S.fill();
  setTimeout(() => { if (!wantJump) win.scrollTop = win.scrollHeight; }, 0);

  const out = [
    el('button', {class:'btn', text:'← Назад', onclick: () => { S.view = 'chatList'; draw(); }}),
    el('h2', {text: c.name, style:'margin:16px 0'}),
    win
  ];
  if (S.user) {
    out.push(composer('c' + c.id, 'Сообщение... (Enter - отправить)', async (text, pic, rp) => {
      stick = true;
      const r = db.ref('chats/' + c.id + '/messages').push();
      const msg = {uid: S.user.uid, author: S.user.nick, text: text, date: TS};
      if (pic) msg.media = pic;
      if (rp) msg.reply = {key: rp.key};
      await r.set(msg);
      if (rp) notify(rp.uid, {view:'chat', id: c.id, key: r.key, text: text || '📷 Фото'});
    }));
  } else out.push(el('div', {class:'muted', text:'Войдите, чтобы писать'}));
  return out;
}

// ---------- личные сообщения ----------

function openDM(uid) {
  if (!S.user) { S.view = 'auth'; draw(); return; }
  if (!uid || uid === S.user.uid) return;
  S.view = 'dm'; S.dmWith = uid; draw();
}
let dmSub = null;
function dmUnsub() {
  if (dmSub) { dmSub.ref.off('value', dmSub.cb); dmSub = null; }
  S.dmMsgs = {};
}
function dmUnread(p) {
  const x = S.dmIndex[p];
  return !!(S.user && x && x.from !== S.user.uid && (x.date || 0) > (S.dmRead[p] || 0));
}
function dmMarkRead(p) {
  if (S.user && dmUnread(p)) db.ref('dmRead/' + S.user.uid + '/' + p).set(TS).catch(() => {});
}
async function sendDM(other, text, pic, replyKey, voice) {
  const me = S.user.uid, key = dmKey(me, other);
  const msg = {uid: me, text: text || '', date: TS};
  if (pic) msg.media = pic;
  if (voice) { msg.voice = voice.s; msg.dur = voice.d; }
  if (replyKey) msg.reply = {key: replyKey};
  const id = db.ref('dms/' + key + '/messages').push().key;
  const idx = {last: snip(msg, 80) || '…', date: TS, from: me};
  const up = {};
  up['dms/' + key + '/messages/' + id] = msg;
  up['dmIndex/' + me + '/' + other] = idx;
  up['dmIndex/' + other + '/' + me] = idx;
  await db.ref().update(up);
}

function dmView() {
  const other = S.dmWith;
  if (!other || !S.user) { S.view = 'dmList'; return dmListView(); }
  const key = dmKey(S.user.uid, other);

  if (!dmSub || dmSub.key !== key) {
    dmUnsub();
    const ref = db.ref('dms/' + key + '/messages').limitToLast(200);
    const cb = sn => {
      S.dmMsgs = sn.val() || {};
      if (S.view === 'dm' && S.dmWith === other && S.fill) { S.fill(); dmMarkRead(other); }
    };
    ref.on('value', cb, e => console.warn('dm:', e.message));
    dmSub = {ref, cb, key};
  }

  const win = el('div', {class:'chatwin'});
  let stick = true;
  S.fill = () => {
    const near = stick || win.scrollHeight - win.scrollTop - win.clientHeight < 80;
    const old = win.scrollTop;
    win.innerHTML = '';
    const msgs = Object.entries(S.dmMsgs).map(([k, m]) => ({...m, key: k})).sort((a, b) => (a.date || 0) - (b.date || 0));
    if (!msgs.length) win.append(el('div', {class:'muted', text:'Сообщений пока нет. Напишите первым.', style:'text-align:center;padding:20px'}));
    msgs.forEach(m => {
      const mine = m.uid === S.user.uid;
      win.append(el('div', {class:'dmmsg' + (mine ? ' self' : ''), 'data-k': m.key}, [
        el('div', {class:'bub'}, [
          el('div', {class:'top'}, [
            el('span', {text: fmt(m.date) + ' ' + tm(m.date)}),
            el('span', {style:'display:flex;gap:6px'}, [
              replyBtn('d' + key, m.key, m),
              mine ? el('button', {class:'btn small danger', text:'✕', onclick: () => { if (confirm('Удалить?')) del('dms/' + key + '/messages/' + m.key); }}) : null
            ])
          ]),
          quoteEl(S.dmMsgs, m.reply),
          m.text ? el('div', {class:'txt', text: m.text}) : null,
          picEl(m.media),
          okAud(m.voice) ? el('audio', {controls:'', preload:'metadata', src: m.voice}) : null
        ])
      ]));
    });
    win.scrollTop = near ? win.scrollHeight : old;
    stick = false;
    doJump(win);
  };
  const wantJump = !!S.jump;
  S.fill();
  setTimeout(() => { if (!wantJump) win.scrollTop = win.scrollHeight; }, 0);
  dmMarkRead(other);

  const ou = getUser(other);
  return [
    el('div', {class:'tnav'}, [
      el('button', {class:'btn', text:'← Все диалоги', onclick: () => { S.view = 'dmList'; draw(); }}),

    ]),

    composer('d' + key, 'Сообщение... (Enter - отправить)', async (text, pic, rp, vo) => {
      stick = true;
      await sendDM(other, text, pic, rp && rp.key, vo);
    }, {voice: true})
  ];
}

// ---------- сессии ----------

const sidKey = uid => 'sid_' + uid;
function devName() {
  const ua = navigator.userAgent;
  const br = /Edg\//.test(ua) ? 'Edge' : /OPR\/|Opera/.test(ua) ? 'Opera' : /Firefox\//.test(ua) ? 'Firefox' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : 'Браузер';
  const os = /Windows/.test(ua) ? 'Windows' : /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iOS' : /Mac OS/.test(ua) ? 'macOS' : /Linux/.test(ua) ? 'Linux' : '?';
  return (br + ' · ' + os).slice(0, 60);
}
let hb = null, sesWatch = null;
function stopSession() {
  clearInterval(hb); hb = null;
  if (sesWatch) { sesWatch.ref.off('value', sesWatch.cb); sesWatch = null; }
}
function kicked() {
  stopSession();
  if (S.user) localStorage.removeItem(sidKey(S.user.uid));
  alert('Эта сессия была завершена');
  auth.signOut();
}
// true — можно работать, false — сессию завершили или она истекла
async function startSession(u) {
  stopSession();
  const k = sidKey(u.uid);
  let sid = localStorage.getItem(k);
  if (sid) {
    let rec = null;
    try { rec = await get('sessions/' + u.uid + '/' + sid); } catch (e) { return true; }
    if (!rec || Date.now() - (rec.last || 0) > 30 * 864e5) {
      localStorage.removeItem(k);
      if (rec) db.ref('sessions/' + u.uid + '/' + sid).remove().catch(() => {});
      return false;
    }
  } else {
    sid = db.ref('sessions/' + u.uid).push().key;
    try {
      await db.ref('sessions/' + u.uid + '/' + sid).set({device: devName(), created: TS, last: TS});
      localStorage.setItem(k, sid);
    } catch (e) { console.warn('session:', e.message); return true; }
  }
  const ref = db.ref('sessions/' + u.uid + '/' + sid);
  const cb = sn => { if (!sn.exists()) kicked(); };
  ref.on('value', cb);
  sesWatch = {ref, cb};
  const beat = () => { if (!document.hidden) ref.child('last').set(TS).catch(() => {}); };
  hb = setInterval(beat, 120000);
  beat();
  return true;
}
async function doSignOut() {
  try {
    if (S.user) {
      const k = sidKey(S.user.uid), sid = localStorage.getItem(k);
      localStorage.removeItem(k);
      stopSession();
      if (sid) await db.ref('sessions/' + S.user.uid + '/' + sid).remove();
    }
  } catch (e) {}
  auth.signOut();
}

// ---------- личные подписки (ЛС, уведомления, сессии) ----------

const subs = [];
function sub(ref, cb) { ref.on('value', cb, e => console.warn(ref.toString(), e.message)); subs.push([ref, cb]); }
function unbindUser() {
  subs.splice(0).forEach(([r, cb]) => r.off('value', cb));
  S.dmIndex = {}; S.dmRead = {}; S.notifs = {}; S.sessions = {};
  dmUnsub();
}
function bindUser(uid) {
  unbindUser();
  const first = {dm: true, nf: true};
  sub(db.ref('dmRead/' + uid), s => { S.dmRead = s.val() || {}; updateBadges(); });
  sub(db.ref('dmIndex/' + uid), s => {
    const prev = S.dmIndex;
    S.dmIndex = s.val() || {};
    if (!first.dm) {
      Object.keys(S.dmIndex).forEach(p => {
        const x = S.dmIndex[p], o = prev[p];
        if (x.from !== uid && (!o || (x.date || 0) > (o.date || 0))) {
          const viewing = S.view === 'dm' && S.dmWith === p && !document.hidden;
          if (viewing) dmMarkRead(p); else ding('dm');
        }
      });
    }
    first.dm = false;
    updateBadges();
    if (S.view === 'dmList') draw();
  });
  sub(db.ref('notifs/' + uid), s => {
    const prev = S.notifs;
    S.notifs = s.val() || {};
    if (!first.nf && Object.keys(S.notifs).some(k => !prev[k])) ding('reply');
    first.nf = false;
    updateBadges();
    if (S.view === 'notifs') draw();
  });
  sub(db.ref('sessions/' + uid), s => { S.sessions = s.val() || {}; if (S.view === 'sessions') draw(); });
}

// ---------- кто залогинен ----------

async function loadUser(u) {
  if (!u) { S.user = null; return; }

  const fromMail = (u.email || '').split('@')[0];
  let me = {uid: u.uid, login: fromMail, nick: u.displayName || fromMail, role:'user', owner:false};

  try {
    let rec = await get('users/' + u.uid);
    let viaNick = false;

    if (!rec) {
      try {
        const all = await get('users');
        if (all) {
          rec = Object.values(all).find(x => x.nick && x.nick.toLowerCase() === fromMail.toLowerCase());
          viaNick = !!rec;
        }
      } catch (e) {
        console.warn('список юзеров не прочитать', e.message);
      }
    }

    if (rec) {
      me.nick = rec.nick || me.nick;
      if (!viaNick) { me.owner = rec.owner === true; me.role = rec.role || 'user'; }
      me.created = rec.created;
      if (!viaNick) me.premium = rec.premium === true;
      me.profile = rec.profile;
      me.phone = rec.phone;
      me.followers = rec.followers;
      me.uses = rec.uses;
    }

    // всегда занимаем текущий ник за текущим uid
    if (rec && rec.uid === u.uid) {
      claimNick(me.nick, u.uid).catch(() => {});
    }

    // если записи именно для этого uid нет — создаём её с обычными правами (овнеров/админов назначают только в базе)
    if (!rec || rec.uid !== u.uid) {
      try {
        await claimNick(me.nick, u.uid);
        await set('users/' + u.uid, {
          uid: u.uid, nick: me.nick, role:'user', owner:false,
          premium:false, created: TS
        });
      } catch (e) {
        console.warn('не смог создать запись юзера', e.message);
      }
    }
  } catch (e) {
    console.error('loadUser:', e.message);
  }

  S.user = me;
}

let bootDone = false;
async function boot(u) {
  try {
    await loadUser(u);
    if (u && S.user) {
      const ok = await startSession(u);
      if (!ok) {
        S.user = null;
        alert('Сессия завершена. Войдите снова.');
        await auth.signOut().catch(() => {});
        return;
      }
      bindUser(u.uid);
    } else {
      stopSession();
      unbindUser();
    }
  } catch (e) {
    console.error('boot:', e.message);
  }
  S.ready = true;
  bootDone = true;
  S.bootStalled = false;
  draw();
}
// сторож: boot завис (база/сеть недоступны) — рисуем сайт в режиме просмотра с предупреждением
setTimeout(() => {
  if (bootDone) return;
  console.error('boot: timeout, offline-mode render');
  S.user = null; S.ready = true; S.bootStalled = true;
  draw();
}, 25000);

(function () {
  const [v, i] = location.hash.slice(1).split('/');
  if (['thread', 'chat', 'chatList', 'profile', 'members', 'admin', 'priv', 'dm', 'dmList', 'notifs', 'sessions'].includes(v)) {
    S.view = v;
    if (v === 'thread') S.open = i;
    if (v === 'chat') S.chatId = i;
    if (v === 'profile') S.profile = i;
    if (v === 'dm') S.dmWith = i;
  }
})();

auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(e => console.warn('persistence:', e.code));

auth.onAuthStateChanged(async u => {
  if (S.registering) return;
  await boot(u);
});
// если событие авторизации не пришло (зависший SDK/сеть) — показываем сайт как гостю
setTimeout(() => { if (!bootDone) boot(null); }, 15000);

// поиск в шапке
(function () {
  const inp = document.getElementById('global-search');
  let tm = null;
  inp.addEventListener('input', () => {
    clearTimeout(tm);
    tm = setTimeout(() => {
      S.search = inp.value.trim();
      S.page = 1;
      if (S.view !== 'list') S.view = 'list';
      draw();
    }, 250);
  });
})();

setLang(lang);
</script>
</body>
</html>
