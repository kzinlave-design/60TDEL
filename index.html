async function compress(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => {
      const i = new Image();
      i.onload = () => {
        let w = i.width, h = i.height, sc = Math.min(1, 1000/Math.max(w,h));
        w = Math.round(w*sc); h = Math.round(h*sc);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(i, 0, 0, w, h);
        let q = 0.8, u = c.toDataURL('image/jpeg', q);
        while(u.length * 0.75 > 200000 && q > 0.1){ q -= 0.1; u = c.toDataURL('image/jpeg', q); }
        res(u);
      };
      i.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function getUser(id) {
  if (!id) return null;
  return S.users[id] || Object.values(S.users).find(u => u.nick?.toLowerCase() === String(id).toLowerCase());

function nick(id, fallback) {
  const u = getUser(id);
  if (!u) return el('span', {text: fallback || 'User', style: 'color:#aaa'});
  
  let pre = '';
  if(u.owner) pre = el('span', {class: 'nick-prefix prefix-owner', text: '[Founder]'});
  else if(u.role === 'admin') pre = el('span', {class: 'nick-prefix prefix-admin', text: '[Admin]'});

  const n = el('span', {text: u.nick || 'User'});
  const w = el('span', {style: 'display:inline-flex;align-items:center;gap:4px;cursor:pointer'}, [pre, n]);
  if(u.profile?.mediaUrl) w.prepend(el('img', {class: 'nick-media', src: u.profile.mediaUrl}));
  
  w.onclick = e => { e.stopPropagation(); S.view = 'profile'; S.profile = u.uid || id; draw(); };
  return w;
}

function avatar(id, sz = 40) {

  return a;

    e.preventDefault();
    if(S._busy) return; S._busy = true; err.textContent = '';
    
    const user = n.value.trim().replace(/[^a-zA-Z0-9_]/g, '');

    const email = user.toLowerCase() + '@60tdel.local';

    try {
      if(isL) await auth.signInWithEmailAndPassword(email, p.value);
      else {
        const c = await auth.createUserWithEmailAndPassword(email, p.value);

      S.view = 'list'; draw();

      let m = ex.message;
      if(ex.code?.includes('wrong-password') || ex.code?.includes('not-found')) m = 'Неверный ник или пароль';

    el('h2', {text: isL ? t('auth') : t('reg_title'), style: 'color:#fff;text-align:center'}),

  ])];
}

  paged.forEach(th => {
    const tr = el('tr', {class: th.pin ? 'pin' : '', style: 'cursor:pointer', onclick: () => { S.view = 'thread'; S.open = th.id; draw(); }}, [
      el('td', {text: th.title}),
      el('td', {class: 'num', text: String(Math.max(0, Object.keys(th.posts || {}).length - 1))}),
      el('td', {class: 'num', text: String(th.views || 0)}),
      el('td', null, [nick(th.uid, th.author)]),
      el('td', {class: 'date', text: fmt(th.date)})
    ]);
    tbody.appendChild(tr);
  });

  out.push(el('div', {class: 'tablebox'}, [el('table', null, [
    el('thead', null, [el('tr', null, ['Заголовок', 'Комменты', 'Просмотры', 'Автор', 'Дата'].map((t, i) => el('th', {text: t, class: i===1 || i===2 ? 'num' : i===4 ? 'date' : ''})))]),
    tbody
  ])]));

  return out;
}

function threadView() {
  const th = S.threads.find(x => x.id === S.open);
  if(!th) return [el('div', {text: 'Не найдено'})];

  const out = [el('button', {class: 'btn', text: '← Назад', onclick: () => { S.view = 'list'; draw(); }, style: 'align-self:flex-start'}), el('h2', {text: th.title, style: 'margin:16px 0;color:#fff'})];
  const posts = Object.values(th.posts || {}).sort((a,b) => a.date - b.date);

  posts.forEach(p => {
    out.push(el('div', {class: 'post'}, [
      el('div', {class: 'who'}, [avatar(p.uid, 48), nick(p.uid, p.author)]),
      el('div', {class: 'body'}, [
        el('div', {class: 'meta'}, [
          el('span', {text: fmt(p.date)}),
          (p.uid === S.user?.uid || isAdmin()) ? el('button', {class: 'btn small danger', text: '✕', onclick: () => {
            if(confirm('Удалить?')) del(`threads/${th.id}/posts/${Object.keys(th.posts).find(k => th.posts[k].date === p.date)}`);
          }}) : null
        ]),
        el('div', {class: 'text', text: p.text}),
        p.media ? el('img', {src: p.media, style: 'max-width:100%;margin-top:10px;border:1px solid #222'}) : null
      ])
    ]));
  });

  if(S.user) {
    const ta = el('textarea', {placeholder: 'Ответ...'});
    out.push(el('div', {class: 'compose'}, [
      ta,
      el('button', {class: 'btn primary', text: t('send'), onclick: async () => {
        if(!ta.value.trim()) return;
        await set(`threads/${th.id}/posts/p${Date.now()}`, { uid: S.user.uid, author: S.user.nick, text: ta.value.trim(), date: Date.now() });
        draw();
      }})
    ]));
  }
  return out;
}

function profileView() {
  if(!S.user) return [el('div', {text: 'Войдите'})];
  const uid = S.profile || S.user.uid;
  const u = getUser(uid) || S.user;
  const isMe = u.uid === S.user.uid;
  const pf = u.profile || {};

  let topics = 0;
  S.threads.forEach(th => { if(th.uid === u.uid || th.author === u.nick) topics++; });

  const out = [
    el('div', {class: 'profile-container'}, [
      el('div', {class: 'profile-banner', html: pf.banner ? `<img src="${pf.banner}">` : ''}),
      el('div', {class: 'profile-main'}, [
        el('div', {class: 'profile-avatar', html: pf.avatar ? `<img src="${pf.avatar}">` : (u.nick || '?')[0].toUpperCase()}),
        el('div', {class: 'profile-details'}, [
          el('div', {class: 'profile-name-row'}, [
            el('div', {class: 'profile-username'}, [nick(u.uid)]),
            !isMe ? el('button', {class: 'btn-follow', text: 'follow'}) : el('button', {class: 'btn', text: t('edit'), onclick: () => { S.edit = !S.edit; S.draft = {...pf, nick: u.nick}; draw(); }})
          ]),
          el('div', {class: 'profile-stats-small', html: `<b>1</b> following &nbsp; <b>2</b> followers`})
        ])
      ])
    ]),
    el('table', {class: 'profile-table'}, [
      el('tbody', null, [
        el('tr', null, [el('td', {text: 'Username'}), el('td', {text: '@' + u.nick})]),
        el('tr', null, [el('td', {text: 'Joined'}), el('td', {text: fmt(u.created)})]),
        el('tr', null, [el('td', {text: 'Topics'}), el('td', {text: topics})])
      ])
    ])
  ];

  if(!isMe) {
    out.push(el('div', {class: 'profile-private-box'}, [
      el('div', {html: `This user's account is <b>private</b>.`}),
      el('div', {style: 'margin-top:10px;font-size:12px', html: `Already follow <b>${u.nick}</b>? <a href="#" onclick="event.preventDefault(); S.view='auth'; draw();">Login</a> to see their pastes.`})
    ]));
  }

  if(isMe && S.edit) {
    const d = S.draft;
    const aF = el('input', {type: 'file', accept: 'image/*', onchange: async e => { d.avatar = await compress(e.target.files[0]); }});
    const bF = el('input', {type: 'file', accept: 'image/*', onchange: async e => { d.banner = await compress(e.target.files[0]); }});
    
    out.push(el('div', {class: 'profile-edit'}, [
      el('h3', {text: t('edit'), style: 'color:#fff'}),
      el('label', null, [t('nick'), el('input', {type: 'text', value: d.nick, oninput: e => d.nick = e.target.value})]),
      el('label', null, ['Bio', el('textarea', {value: d.bio, oninput: e => d.bio = e.target.value})]),
      el('label', null, ['Avatar', aF]),
      el('label', null, ['Banner', bF]),
      el('div', {style: 'display:flex;gap:10px'}, [
        el('button', {class: 'btn primary', text: t('save'), onclick: async () => {
          await upd('users/' + u.uid, { nick: d.nick, profile: d }); S.edit = false; draw();
        }}),
        el('button', {class: 'btn', text: t('cancel'), onclick: () => { S.edit = false; draw(); }})
      ])
    ]));
  }

  return out;
}

function chatView() {
  const c = S.chats[S.chatId];
  if(!c) return [el('div', {text: 'Не найдено'})];
  
  const out = [
    el('button', {class: 'btn', text: '← Назад', onclick: () => { S.view = 'chatList'; draw(); }}),
    el('h2', {text: c.name, style: 'margin:16px 0'}),
    el('div', {class: 'chatwin'}, Object.values(c.messages || {}).sort((a,b) => a.date - b.date).map(m => 
      el('div', {class: 'chatmsg' + (m.uid === S.user?.uid ? ' self' : '')}, [
        avatar(m.uid, 32),
        el('div', {class: 'bub'}, [
          el('div', {class: 'top'}, [nick(m.uid, m.author), el('span', {text: fmt(m.date)})]),
          el('div', {class: 'txt', text: m.text})
        ])
      ])
    ))
  ];

  if(S.user) {
    const i = el('input', {placeholder: 'Сообщение...'});
    out.push(el('div', {class: 'compose'}, [
      i,
      el('button', {class: 'btn primary', text: t('send'), onclick: async () => {
        if(!i.value.trim()) return;
        await set(`chats/${S.chatId}/messages/m${Date.now()}`, { uid: S.user.uid, author: S.user.nick, text: i.value.trim(), date: Date.now() });
        i.value = '';
      }})
    ]));
  }
  return out;
}

function chatListView() {
  const tbody = el('tbody');
  Object.values(S.chats).sort((a,b) => (b.date||0) - (a.date||0)).forEach(c => {
    tbody.appendChild(el('tr', {style: 'cursor:pointer', onclick: () => { S.view = 'chat'; S.chatId = c.id; draw(); }}, [
      el('td', {text: c.name}),
      el('td', {text: Object.keys(c.messages || {}).length}),
      el('td', null, [nick(c.uid, c.author)])
    ]));
  });
  return [
    el('h2', {text: 'Чаты'}),
    el('div', {class: 'tablebox'}, [el('table', null, [tbody])])
  ];
}

function membersView() {
  const tbody = el('tbody');
  Object.values(S.users).forEach(u => {
    if(!u.nick) return;
    tbody.appendChild(el('tr', null, [
      el('td', null, [nick(u.uid)]),
      el('td', {text: u.owner ? 'Owner' : (u.role || 'user')}),
      el('td', {text: fmt(u.created)})
    ]));
  });
  return [el('h2', {text: 'Юзеры'}), el('div', {class: 'tablebox'}, [el('table', null, [tbody])])];
}

function draw() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  
  const w = document.getElementById('who');
  w.innerHTML = '';
  if(S.user) {
    w.append(nick(S.user.uid), el('button', {text: t('out'), onclick: () => auth.signOut()}));
  } else {
    w.append(el('button', {text: t('login'), onclick: () => { S.view = 'auth'; S.authMode = 'login'; draw(); }}));
  }
  document.getElementById('nav-admin').style.display = isAdmin() ? '' : 'none';

  let nodes = [];
  if(S.view === 'auth') nodes = authView();
  else if(S.view === 'thread') nodes = threadView();
  else if(S.view === 'chatList') nodes = chatListView();
  else if(S.view === 'chat') nodes = chatView();
  else if(S.view === 'profile') nodes = profileView();
  else if(S.view === 'members') nodes = membersView();
  else nodes = listView();

  nodes.forEach(n => n && app.append(n));
}

const router = {
  home: () => { S.view = 'list'; S.open = null; draw(); },
  goChats: () => { S.view = 'chatList'; draw(); },
  goMembers: () => { S.view = 'members'; draw(); },
  goNew: () => { 
    if(!S.user) { S.view = 'auth'; draw(); return; }
    const title = prompt('Заголовок:');
    const text = prompt('Текст:');
    if(title && text) set('threads/t' + Date.now(), { title, uid: S.user.uid, author: S.user.nick, date: Date.now(), posts: { p0: { uid: S.user.uid, text, date: Date.now() } } }).then(draw);
  }
};

db.ref('users').on('value', s => { S.users = s.val() || {}; draw(); });
db.ref('threads').on('value', s => { 
  const d = s.val() || {}; 
  S.threads = Object.keys(d).map(k => ({ id: k, ...d[k] })).sort((a,b) => (b.date||0) - (a.date||0)); 
  if(S.view !== 'chat') draw(); 
});
db.ref('chats').on('value', s => { 
  const d = s.val() || {}; 
  S.chats = Object.keys(d).reduce((a, k) => { a[k] = { id: k, ...d[k] }; return a; }, {}); 
  if(S.view.includes('chat')) draw(); 
});

auth.onAuthStateChanged(async u => {
  if(u) {
    let rec = await get('users/' + u.uid);
    if(!rec) {
      const dNick = u.email.split('@')[0];
      const all = await get('users');
      const found = all ? Object.values(all).find(x => x.nick?.toLowerCase() === dNick) : null;
      if(found) { rec = found; await set('users/' + u.uid, { ...rec, uid: u.uid }); }
    }
    S.user = rec ? { uid: u.uid, nick: rec.nick, owner: rec.owner, role: rec.role } : { uid: u.uid, nick: u.email.split('@')[0], role: 'user' };
  } else S.user = null;
  draw();
});

setLang(lang);
</script>
</body>
</html>
